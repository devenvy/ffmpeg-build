# Recipe checks: a change to recipes/<name>/ builds that library, and every recipe that builds against it, on every
# platform it claims (without FFmpeg), at the canary lock's versions. `ffmpeg-build recipe-check --plan` writes the
# check targets once (one per platform and option, locked). TensorFlow and Torch each get a separate job so a cold
# native ML batch stays within GitHub's six-hour limit; other targets share their platform's job. Each job uses
# that same locked folder. A recipe that claims a platform no option builds it on fails the check; one no
# platform builds is a notice. ci.yml calls this on every pull request and its required `result` needs it (no recipe
# changed: nothing builds, and it passes); a push to main runs it too, which keeps main's library caches warm.
# A change to the toolchains (src/build, images, platforms.yml) is toolchains.yml's.
name: Recipes
on:
  workflow_call:
  push:
    branches: [main]
    paths: ['recipes/**']

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      recipes: ${{ steps.diff.outputs.recipes }}
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      lock: ${{ steps.plan.outputs.lock }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        name: the recipes that changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # an unknown base (a push that created the branch): the commit before; a repository's first commit has none, so
          # everything in it is new (git's empty tree)
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse -q --verify 'HEAD~1^{commit}' || git hash-object -t tree /dev/null)"
          fi
          git diff --name-only "${BASE}" HEAD > "${RUNNER_TEMP}/changed"
          # a recipe removed (or renamed away) has nothing left to build
          recipes="$(sed -n 's#^recipes/\([^/]*\)/.*#\1#p' "${RUNNER_TEMP}/changed" | sort -u | while read -r r; do
            if [ -f "recipes/${r}/recipe.yml" ]; then echo "${r}"; else echo "::notice::recipes/${r} is gone; nothing to build" >&2; fi
          done | tr '\n' ' ')"
          echo "recipes=${recipes% }" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.diff.outputs.recipes != ''
        with:
          node-version: 24
      - name: engine
        if: steps.diff.outputs.recipes != ''
        run: corepack pnpm install --frozen-lockfile && npm link
      - id: plan
        name: where each recipe builds
        env:
          RECIPES: ${{ steps.diff.outputs.recipes }}
        run: |
          if [ -z "${RECIPES}" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          # shellcheck disable=SC2086 # the recipe names, one argument each
          ffmpeg-build recipe-check ${RECIPES} --plan --json --dir "${RUNNER_TEMP}/recipe-check" > "${RUNNER_TEMP}/plan.json" || status=$?
          if ! jq -e '.platforms' "${RUNNER_TEMP}/plan.json" > /dev/null 2>&1; then
            jq -r '.error? // empty' "${RUNNER_TEMP}/plan.json" 2>/dev/null | sed 's/^/::error::/'
            cat "${RUNNER_TEMP}/plan.json"
            exit 1
          fi
          jq -r '.unbuildable[] | "::notice::no option builds \(.) on any platform, so nothing checks it here"' "${RUNNER_TEMP}/plan.json"
          jq -r '.unbuilt[] | "::error::\(.recipe) claims \(.platforms | join(", ")), but no option builds it there: correct its platforms: in recipes/\(.recipe)/recipe.yml"' "${RUNNER_TEMP}/plan.json"
          {
            echo "matrix=$(jq -c '{include: [
              .platforms[] as $platform |
              $platform.targets | group_by(if any(.only[]; . == "tensorflow" or . == "torch") then .name else "ordinary" end)[] |
              {platform: $platform.platform, runner: $platform.runner,
               shard: (if any(.[0].only[]; . == "tensorflow" or . == "torch") then .[0].name else "ordinary" end),
               targets: (map(.name) | join(" "))}
            ]}' "${RUNNER_TEMP}/plan.json")"
            echo "any=$(jq '.platforms | length > 0' "${RUNNER_TEMP}/plan.json")"
            echo "lock=$(sha256sum "${RUNNER_TEMP}/recipe-check/ffmpeg.lock" 2>/dev/null | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
          jq -r '"checks \(.recipes | join(", "))", (.platforms[] | "- \(.platform): \([.targets[] | "\(.name) (\(.only | join(", ")))"] | join("; "))")' "${RUNNER_TEMP}/plan.json" >> "$GITHUB_STEP_SUMMARY"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.any == 'true'
        with:
          name: recipe-check
          path: ${{ runner.temp }}/recipe-check
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: error
      # after the outputs: the platforms that do build are still built
      - name: every platform a recipe claims builds it
        if: steps.plan.outputs.status != '' && steps.plan.outputs.status != '0'
        run: exit 1

  recipe:
    needs: changed
    if: ${{ !cancelled() && needs.changed.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed.outputs.matrix) }}
    name: ${{ matrix.platform }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    # A cold batch containing the native ML libraries can exceed four hours.
    timeout-minutes: 360
    env:
      FFMPEG_BUILD_IMAGE_CACHE: gha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: engine
        run: corepack pnpm install --frozen-lockfile && npm link
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recipe-check
          path: ${{ runner.temp }}/recipe-check
      # Apple platforms build natively with Homebrew's tools (x86_64 ones run their own programs under Rosetta); the
      # rest in their Docker images on Linux (Windows, Android and armhf cross-built)
      - name: Apple build tools
        if: runner.os == 'macOS'
        run: sed 's/#.*//' platforms/apple-brew.txt | xargs brew install
      - name: Rosetta (x86_64 builds run under it on Apple silicon)
        if: runner.os == 'macOS' && endsWith(matrix.platform, '-x64')
        env:
          RETRY_DELAY: '20'
        # Apple's catalog sometimes has no Rosetta for a while ("Rosetta 2 update is not available"): retried, and
        # what counts is that an x86_64 program runs
        run: |
          for attempt in 1 2 3 4 5; do
            if arch -x86_64 /usr/bin/true 2> /dev/null; then
              exit 0
            fi
            sudo softwareupdate --install-rosetta --agree-to-license || true
            if arch -x86_64 /usr/bin/true 2> /dev/null; then
              exit 0
            fi
            echo "::warning::Rosetta didn't install (attempt ${attempt} of 5)"
            [ "${attempt}" = 5 ] || sleep "$((RETRY_DELAY * attempt))"
          done
          echo "::error::Rosetta is still missing after 5 attempts: this runner can't run the x86_64 programs the build checks"
          exit 1
      - name: buildx with the Actions cache
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: expose the Actions cache to buildx
        if: runner.os == 'Linux'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # the libraries, by platform, recipes and lock: a recipe change saves the libraries it rebuilt under a key of its own
      - id: library-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-build
          key: ffmpeg-build-libs-${{ matrix.platform }}-recipes-${{ hashFiles('recipes/**', 'platforms/**', 'platforms.yml', 'images/**', 'src/build/**') }}-${{ needs.changed.outputs.lock }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ffmpeg-build-libs-${{ matrix.platform }}-recipes-${{ hashFiles('recipes/**', 'platforms/**', 'platforms.yml', 'images/**', 'src/build/**') }}-${{ needs.changed.outputs.lock }}-${{ matrix.shard }}-
            ffmpeg-build-libs-${{ matrix.platform }}-recipes-${{ hashFiles('recipes/**', 'platforms/**', 'platforms.yml', 'images/**', 'src/build/**') }}-${{ needs.changed.outputs.lock }}-
            ffmpeg-build-libs-${{ matrix.platform }}-
      - name: build ${{ matrix.targets }}
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          cd "${RUNNER_TEMP}/recipe-check"
          failed=0
          # shellcheck disable=SC2086 # the planner's target names, one argument each
          for target in ${TARGETS}; do
            only=$(jq -er --arg target "$target" '.plan.targets[] | select(.name == $target) | .only | select(length > 0) | join(",")' recipe-check.json)
            if ! ffmpeg-build build --target "${target}" --only "${only}" --out "${RUNNER_TEMP}/dist"; then
              failed=1
            fi
          done
          exit "${failed}"
      - name: retain completed library builds
        if: always() && steps.library-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ffmpeg-build
          key: ${{ steps.library-cache.outputs.cache-primary-key }}
      - name: the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-check-logs-${{ matrix.platform }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/dist/*.log
          retention-days: 5
          if-no-files-found: ignore
