# REUSABLE. Re-runs a failed build run's failed jobs when GitHub never gave them a runner, and nothing else failed.
# Hosted macOS capacity runs short: a release queues dozens of macOS jobs (a free plan runs 5 at a time), and a job
# that waits too long is dropped with "The job was not acquired by Runner of type hosted even after multiple attempts".
# all-builds then fails the whole run, and its release waits for the next day. A run with any other failure (a build,
# a test) is left alone: a re-run wouldn't change it.
#
# The caller is a `workflow_run` workflow on the build workflow's completion (examples/workflows/retry.yml): a job
# can't re-run its own run, which has to be complete first. `gh run rerun --failed` keeps the jobs that passed and their
# artifacts, and runs the failed ones and those after them (the release) again.
#
# Permissions: actions: write (re-run), checks: read (the failed jobs' annotations, which hold GitHub's reason).
name: Retry

on:
  workflow_call:
    inputs:
      max-attempts:
        description: the run attempt after which no more re-runs are started (1 is the first run; default 3, two re-runs)
        type: number
        default: 3

permissions: {}

jobs:
  retry:
    # the build run that just completed; only a failed one, below its attempt limit
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < inputs.max-attempts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # re-run the failed jobs
      checks: read # the jobs' annotations
    steps:
      - name: re-run jobs GitHub gave no runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # the jobs of the attempt that just ended that neither passed nor were skipped (the API sometimes answers 502)
          for try in 1 2 3; do
            gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN}/attempts/${ATTEMPT}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.id)\t\(.name)"' \
              > jobs.tsv && break
            [ "${try}" -lt 3 ] || exit 1
            sleep 15
          done
          unacquired=0
          other=0
          while IFS=$'\t' read -r id name; do
            # GitHub's reason is an annotation on the job; one that can't be read counts as another failure
            messages="$(gh api "repos/${GH_REPO}/check-runs/${id}/annotations" --jq '.[].message' || true)"
            if [[ "${messages}" == *'was not acquired by Runner'* ]]; then
              echo "no runner: ${name}"
              unacquired=$((unacquired + 1))
            elif [[ "${name}" == *all-builds ]]; then
              : # the gate fails because of the others
            else
              echo "failed: ${name}"
              other=$((other + 1))
            fi
          done < jobs.tsv
          {
            echo "Run ${RUN} attempt ${ATTEMPT}: ${unacquired} job(s) got no runner, ${other} other failure(s)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${unacquired}" -gt 0 ] && [ "${other}" -eq 0 ]; then
            echo "re-running the failed jobs of run ${RUN}" | tee -a "$GITHUB_STEP_SUMMARY"
            gh run rerun "${RUN}" --failed
          else
            echo "nothing to re-run: only a run whose every failure is a job GitHub gave no runner is re-run" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
