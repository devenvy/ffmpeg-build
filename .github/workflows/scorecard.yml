name: Scorecard

# OpenSSF Scorecard: supply-chain security checks, published to the public Scorecard API (for
# the badge) and uploaded to code scanning. Its own workflow because publishing requires that
# no other job in the workflow holds id-token: write and that there are no workflow-level
# write permissions, env or defaults.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # upload results to code scanning
      id-token: write # publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
