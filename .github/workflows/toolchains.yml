# The engine's toolchain check: a change to the toolchains (src/build, images, platforms.yml) builds and tests
# examples/test-builds (one small target per kind of runner) in full with the reusable build workflow, and
# examples/native (the same targets built natively: Linux, and Windows in MSYS2), running the engine from this
# repository's source. It never publishes. Run it by hand from the Actions tab
# too.
name: Toolchains
on:
  pull_request:
    paths: ['platforms/**', 'images/**', 'platforms.yml', 'src/build/**']
  push:
    branches: [main]
    paths: ['platforms/**', 'images/**', 'platforms.yml', 'src/build/**']
  workflow_dispatch:

permissions: {}

jobs:
  libraries:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        recipe: [onnxruntime, openvino, tensorflow, torch]
    defaults:
      run:
        shell: bash
    env:
      FFMPEG_BUILD_IMAGE_CACHE: gha
      FFMPEG_BUILD_SOURCE_REPO: ${{ github.server_url }}/${{ github.repository }}
      FFMPEG_BUILD_SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: engine
        run: corepack pnpm install --frozen-lockfile && npm link
      - name: buildx with the Actions cache
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: build one ML library without FFmpeg
        working-directory: examples/verify-recipes-h4-tensorflow
        env:
          RECIPE: ${{ matrix.recipe }}
        run: ffmpeg-build build --target linux-x64-ml-lgplv3 --only "${RECIPE}"
      # The combined source build finished all four libraries but hit the hosted
      # six-hour limit compiling FFmpeg. Artifacts avoid cache-quota eviction and
      # preserve each library together with its exact recorded source inputs.
      - name: package verified library cache and sources
        env:
          RECIPE: ${{ matrix.recipe }}
        run: tar -C "${HOME}/.cache/ffmpeg-build" -cf "${RUNNER_TEMP}/${RECIPE}-cache.tar" libs sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ml-library-cache-${{ matrix.recipe }}
          path: ${{ runner.temp }}/${{ matrix.recipe }}-cache.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  # contents: write although nothing is published: GitHub refuses to start a run whose called workflow has a job
  # (the skipped release job) asking for more than the caller grants
  build:
    needs: [libraries]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      folder: examples/verify-recipes-h4-tensorflow
      engine: source
      publish: never
    # not a secret: a value tests/test-env.sh recognises, to check the test-env path end to end (masked all the same)
    secrets:
      test-env: FFB_TEST_ENV_CHECK=${{ github.run_id }}-ok
  native:
    if: false
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      folder: examples/native
      engine: source
      publish: never

  # Dependabot's base image bumps merge once every toolchain built and tested on them. CI's own auto-merge leaves
  # them alone: its required check (result) doesn't include these builds, so it would merge an untested toolchain.
  # As devenvy-bot (org variable DEVENVY_BOT_CLIENT_ID, org secret DEVENVY_BOT_PRIVATE_KEY, both also Dependabot
  # secrets), so the merge starts the workflows on main.
  dependabot-auto-merge:
    needs: [build, native]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/docker/') && needs.build.result == 'success' && needs.native.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEVENVY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEVENVY_BOT_PRIVATE_KEY }}
          # enabling auto-merge
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
