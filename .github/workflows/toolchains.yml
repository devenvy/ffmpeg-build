# The engine's toolchain check: a change to the toolchains (src/build, images, platforms.yml) builds and tests
# examples/test-builds (one small target per kind of runner) in full with the reusable build workflow, and
# examples/native (the same targets built natively: Linux, and Windows in MSYS2), running the engine from this
# repository's source. It never publishes. Run it by hand from the Actions tab
# too.
name: Toolchains
on:
  pull_request:
    paths: ['platforms/**', 'images/**', 'platforms.yml', 'src/build/**']
  push:
    branches: [main]
    paths: ['platforms/**', 'images/**', 'platforms.yml', 'src/build/**']
  workflow_dispatch:

permissions: {}

jobs:
  # contents: write although nothing is published: GitHub refuses to start a run whose called workflow has a job
  # (the skipped release job) asking for more than the caller grants
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      folder: examples/verify-library-linkage-video
      engine: source
      publish: never
    # not a secret: a value tests/test-env.sh recognises, to check the test-env path end to end (masked all the same)
    secrets:
      test-env: FFB_TEST_ENV_CHECK=${{ github.run_id }}-ok
  native:
    if: false
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      folder: examples/native
      engine: source
      publish: never

  # Dependabot's base image bumps merge once every toolchain built and tested on them. CI's own auto-merge leaves
  # them alone: its required check (result) doesn't include these builds, so it would merge an untested toolchain.
  # As devenvy-bot (org variable DEVENVY_BOT_CLIENT_ID, org secret DEVENVY_BOT_PRIVATE_KEY, both also Dependabot
  # secrets), so the merge starts the workflows on main.
  dependabot-auto-merge:
    needs: [build, native]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/docker/') && needs.build.result == 'success' && needs.native.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEVENVY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEVENVY_BOT_PRIVATE_KEY }}
          # enabling auto-merge
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
