# ffmpeg-build.yml: made by `ffmpeg-build init` from the shipped devenvy targets. Each target is one build
# (one platform, one license, one FFmpeg series); bases hold what targets share. `ffmpeg-build show <target>`
# lists what a target gets and where each entry comes from.
bases:
  common:
    with:
      [
        openh264,
        dav1d,
        openjpeg,
        jxl,
        zimg,
        vmaf,
        lcms2,
        vorbis,
        mp3lame,
        speex,
        gsm,
        soxr,
        chromaprint,
        xml2,
        zlib,
        bzlib,
        lzma,
        iconv,
        srt,
        rist,
        whisper,
        aom,
        vpx,
        webp,
        opus,
        freetype,
        fribidi,
        harfbuzz,
        ass,
        nvenc,
        vpl,
        svtav1,
        theora,
        vvenc,
        twolame,
        shine,
        codec2,
        uavs3d,
        xeve,
        xevd,
        oapv,
        svtjpegxs,
        gme,
        modplug,
        openmpt,
        rav1e,
        mysofa,
        bs2b,
        qrencode,
        quirc,
        flite,
        aribcaption,
        lv2,
        opencolorio,
        cairo,
        zmq,
        rabbitmq,
        snappy,
        rtmp,
        bluray,
        vapoursynth,
        openal,
      ]
  linux:
    with:
      [
        v4l2-m2m,
        fontconfig,
        vaapi,
        drm,
        cuda-llvm,
        vdpau,
        ladspa,
        ssh,
        alsa,
        pulse,
        jack,
        sndio,
        xcb,
        xlib,
        caca,
        v4l2,
        dc1394,
        iec61883,
      ]
  win:
    with: [amf, d3d11va, dxva2, mediafoundation, schannel, cuda-llvm, d3d12va]
  gplv2:
    with:
      [
        x264,
        x265,
        xvid,
        xavs,
        davs2,
        xavs2,
        vidstab,
        zvbi,
        rubberband,
        frei0r,
        dvdnav,
        dvdread,
        avisynth,
      ]
  gplv3:
    with:
      [
        x264,
        x265,
        xvid,
        xavs,
        davs2,
        xavs2,
        rubberband,
        frei0r,
        vidstab,
        aribb24,
        lensfun,
        rsvg,
        tesseract,
        opencv,
        lc3,
        ilbc,
        opencore-amrnb,
        opencore-amrwb,
        placebo,
        vo-amrwbenc,
        vulkan,
        opencl,
        gmp,
        dvdnav,
        dvdread,
        cdio,
      ]
  lgplv3:
    with:
      [
        kvazaar,
        lcevc-dec,
        aribb24,
        lensfun,
        rsvg,
        tesseract,
        opencv,
        lc3,
        ilbc,
        opencore-amrnb,
        opencore-amrwb,
        placebo,
        vo-amrwbenc,
        vulkan,
        opencl,
        gmp,
      ]
targets:
  linux-x64-network-batch-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [gnutls, ssh, rtmp, srt, rist, zmq, rabbitmq]
    link:
      {
        libssh: shared,
        librtmp: shared,
        srt: shared,
        librist: shared,
        libzmq: shared,
        rabbitmq-c: shared,
        mbedtls: shared,
        gnutls: shared,
        gmp: shared,
        nettle: shared,
        libtasn1: shared,
      }
    tests: [tests/network-batch-linkage.sh]
  linux-x64-network-batch-static-lgplv3:
    platform: linux-x64
