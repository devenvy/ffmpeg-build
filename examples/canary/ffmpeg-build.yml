# ffmpeg-build.yml: made by `ffmpeg-build init` from the shipped devenvy targets. Each target is one build
# (one platform, one license, one FFmpeg series); bases hold what targets share. `ffmpeg-build show <target>`
# lists what a target gets and where each entry comes from.
bases:
  common:
    with:
      [
        openh264,
        dav1d,
        openjpeg,
        jxl,
        zimg,
        vmaf,
        lcms2,
        vorbis,
        mp3lame,
        speex,
        gsm,
        soxr,
        chromaprint,
        xml2,
        zlib,
        bzlib,
        lzma,
        iconv,
        srt,
        rist,
        whisper,
        aom,
        vpx,
        webp,
        opus,
        freetype,
        fribidi,
        harfbuzz,
        ass,
        nvenc,
        vpl,
        svtav1,
        theora,
        vvenc,
        twolame,
        shine,
        codec2,
        uavs3d,
        xeve,
        xevd,
        oapv,
        svtjpegxs,
        gme,
        modplug,
        openmpt,
        rav1e,
        mysofa,
        bs2b,
        qrencode,
        quirc,
        flite,
        aribcaption,
        lv2,
        opencolorio,
        cairo,
        zmq,
        rabbitmq,
        snappy,
        rtmp,
        bluray,
        vapoursynth,
        openal,
      ]
  linux:
    with:
      [
        v4l2-m2m,
        fontconfig,
        vaapi,
        drm,
        cuda-llvm,
        vdpau,
        ladspa,
        ssh,
        alsa,
        pulse,
        jack,
        sndio,
        xcb,
        xlib,
        caca,
        v4l2,
        dc1394,
        iec61883,
      ]
  win:
    with: [amf, d3d11va, dxva2, mediafoundation, schannel, cuda-llvm, d3d12va]
  gplv2:
    with:
      [
        x264,
        x265,
        xvid,
        xavs,
        davs2,
        xavs2,
        vidstab,
        zvbi,
        rubberband,
        frei0r,
        dvdnav,
        dvdread,
        avisynth,
      ]
  gplv3:
    with:
      [
        x264,
        x265,
        xvid,
        xavs,
        davs2,
        xavs2,
        rubberband,
        frei0r,
        vidstab,
        aribb24,
        lensfun,
        rsvg,
        tesseract,
        opencv,
        lc3,
        ilbc,
        opencore-amrnb,
        opencore-amrwb,
        placebo,
        vo-amrwbenc,
        vulkan,
        opencl,
        gmp,
        dvdnav,
        dvdread,
        cdio,
      ]
  lgplv3:
    with:
      [
        kvazaar,
        lcevc-dec,
        aribb24,
        lensfun,
        rsvg,
        tesseract,
        opencv,
        lc3,
        ilbc,
        opencore-amrnb,
        opencore-amrwb,
        placebo,
        vo-amrwbenc,
        vulkan,
        opencl,
        gmp,
      ]
targets:
  linux-x64-tensorflow-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [tensorflow]
    tests: [tests/tensorflow.sh]
  linux-x64-tensorflow-combined-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [tensorflow, torch, onnxruntime, openvino]
    tests: [tests/tensorflow.sh, tests/torch.sh, tests/onnxruntime.sh, tests/openvino.sh]
  linux-x64-audio-shared-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [vorbis, opus, speex, mp3lame, shine]
    link:
      {
        libogg: shared,
        libvorbis: shared,
        opus: shared,
        speex: shared,
        libmp3lame: shared,
        shine: shared,
      }
    tests: [tests/audio-linkage.sh]
  linux-x64-leaf-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [twolame, lc3, qrencode, quirc, openjpeg, webp, vpx, zimg, snappy]
    link:
      {
        twolame: shared,
        liblc3: shared,
        libqrencode: shared,
        openjpeg: shared,
        libwebp: shared,
        libvpx: shared,
        zimg: shared,
        snappy: shared,
      }
    tests: [tests/leaf-linkage.sh]
  linux-x64-alsa-static-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [alsa, sndio, openal]
    tests: [tests/alsa-linkage.sh]
  linux-x64-alsa-shared-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [alsa, sndio, openal]
    link: { alsa-lib: shared }
    tests: [tests/alsa-linkage.sh]
  linux-x64-font-static-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [ass, freetype, fribidi, harfbuzz, fontconfig]
    tests: [tests/font-linkage.sh]
  linux-x64-font-shared-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [ass, freetype, fribidi, harfbuzz, fontconfig]
    link:
      {
        freetype: shared,
        libpng: shared,
        fribidi: shared,
        harfbuzz: shared,
        fontconfig: shared,
        libass: shared,
        libexpat: shared,
      }
    tests: [tests/font-linkage.sh]
  linux-x64-audio-clients-static-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [jack, pulse, openal]
    tests: [tests/pulse-linkage.sh, tests/jack-linkage.sh]
  linux-x64-audio-clients-shared-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [jack, pulse, openal]
    link: { jack2: shared, pulseaudio: shared }
    tests: [tests/pulse-linkage.sh, tests/jack-linkage.sh]
  linux-x64-smbclient-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [smbclient, gnutls]
    tests: [tests/smbclient.sh]
  linux-x64-core-shared-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [zlib, lzma, aom, dav1d, soxr, bs2b]
    link: { zlib: shared, xz: shared, aom: shared, dav1d: shared, soxr: shared, libbs2b: shared }
    tests: [tests/core-linkage.sh]
  linux-x64-crypto-system-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [gcrypt]
    link: { libgcrypt: system-shared, libgpg-error: system-shared }
    tests: [tests/system-shared.sh]
  linux-x64-nvidia-nonfree:
    platform: linux-x64
    license: nonfree
    ffmpeg: '8'
    with: [cuda-nvcc]
  linux-x64-crypto-shared-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [gcrypt, libtls]
    link: { libgcrypt: shared, libgpg-error: shared }
  linux-x64-crypto-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [gcrypt, libtls]
  linux-x64-ml-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [torch, onnxruntime, openvino]
    tests: [tests/torch.sh, tests/onnxruntime.sh, tests/openvino.sh]
  linux-x64-openvino-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [openvino]
    tests: [tests/openvino.sh]
  linux-x64-onnxruntime-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [onnxruntime]
    tests: [tests/onnxruntime.sh]
  linux-x64-nonfree:
    platform: linux-x64
    license: nonfree
    ffmpeg: '9'
    with: [fdk-aac, mpeghdec, decklink]
  # MoltenVK, which no Linux or Windows target builds: on macOS its dylib and ICD manifest ship beside the Khronos
  # loader. Just Vulkan and libplacebo on it, to keep the macOS run short, and iconv, the one library only Apple and
  # Windows build (GNU libiconv: the C library has no iconv FFmpeg links by itself there), and OpenCL (macOS's own
  # framework), and OpenColorIO (FFmpeg's ocio filter is C++, which needs the engine's fix for FFmpeg's VERSION file
  # on macOS, #41). (The static MoltenVK of iOS and Mac Catalyst is built by examples/test-builds: a canary iOS target
  # would need all four xcframework slices.)
  osx-arm64-lgplv3:
    platform: osx-arm64
    license: lgplv3
    ffmpeg: '9'
    with: [vulkan, placebo, iconv, opencl, opencolorio]
  # Rockchip MPP, which only ARM Linux builds: rkmpp alone (with the libdrm it needs), to keep the arm64 run short; and
  # mbedTLS as the build's TLS, which the other Linux targets' OpenSSL and GnuTLS leave out (one TLS per build)
  linux-arm64-lgplv3:
    platform: linux-arm64
    license: lgplv3
    ffmpeg: '9'
    with: [rkmpp, mbedtls]
  # cpu_features' NDK layer, which only Tesseract's Android build takes: tesseract alone, to keep the Android run short
  android-arm64-lgplv3:
    platform: android-arm64
    license: lgplv3
    ffmpeg: '9'
    with: [tesseract]
  linux-x64-gplv2:
    platform: linux-x64
    license: gplv2
    ffmpeg: '9'
    base: [common, linux, gplv2]
    with: [gnutls]
  linux-x64-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    base: [common, linux, gplv3]
    with: [openssl]
  linux-x64-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    base: [common, linux, lgplv3]
    with: [openssl]
  win-x64-gplv2:
    platform: win-x64
    license: gplv2
    ffmpeg: '9'
    base: [common, win, gplv2]
  win-x64-gplv3:
    platform: win-x64
    license: gplv3
    ffmpeg: '9'
    base: [common, win, gplv3]
  win-x64-lgplv3:
    platform: win-x64
    license: lgplv3
    ffmpeg: '9'
    base: [common, win, lgplv3]
