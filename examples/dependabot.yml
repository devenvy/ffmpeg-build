# A consumer's .github/dependabot.yml: the actions its workflows use, one grouped PR a week. (ffmpeg.lock is kept
# current by ffmpeg-build update, not Dependabot.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # a release waits a week before it is proposed, so a compromised one is usually caught first
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
