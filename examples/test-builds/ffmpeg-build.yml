# The engine's own end-to-end test: one small target per kind of runner (Linux x64 and arm64, Windows and Android
# cross-builds, macOS, and the four iOS / Mac Catalyst slices of one xcframework bundle), built by .github/workflows/toolchains.yml from this repository's source.
# Some are there for where they are tested: linux-armhf in Debian armhf under qemu, linux-musl-arm64 in Alpine, and
# win-arm64 on a Windows on Arm runner.
# The GPU options each platform offers ride along (cuda-llvm, opencl, d3d12va, vdpau, rkmpp): small, and only a full
# build and `ffmpeg-build test` show that FFmpeg took them (clang emitting the CUDA kernels' PTX, the D3D12 video
# headers, the OpenCL loader linked statically, Rockchip MPP). So do Apple's built-in device and framework options:
# avfoundation on the Apple slices but the lean simulator one, coreimage (with AppKit) on macOS.
# Every platform librsvg builds on (Linux, Windows, Android) has rav1e and rsvg together: two Rust static libraries,
# each with its own copy of Rust's standard library, under its own names (DEVELOPMENT.md, Rust libraries), so FFmpeg
# links both (devenvy/ffmpeg-build#48) with each platform's linker (GNU ld, lld, MinGW's ld, llvm-mingw's lld).
# tests/test-env.sh checks that build.yml's test-env secret reaches a target's tests: natively (linux-x64, osx-arm64,
# win-x64 on its test runner) and in the test containers (Alpine for linux-musl-arm64, Debian armhf for linux-armhf).
bases:
  small: { with: [dav1d, opus] }
targets:
  # components: a restricted build, so the --disable-<kind> / --enable-<kind>=a,b path is built and tested for real:
  # what its options bring (nvenc's encoders, CUVID decoders and NVDEC hwaccels; the CUDA, OpenCL and VDPAU components;
  # opus and dav1d), and names a build lists otherwise (adpcm_g726 is g726, the pcm_s16le demuxer s16le, mov is
  # mov,mp4,...). The test's own pattern (lavfi testsrc2 into -f null) needs testsrc2, the null muxer, and
  # wrapped_avframe as both decoder and encoder.
  linux-x64-lgplv3:
    {
      platform: linux-x64,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      with: [cuda-llvm, opencl, vdpau, nvenc, rav1e, rsvg],
      components:
        {
          decoders: [h264, hevc, aac, pcm_s16le, wrapped_avframe],
          encoders: [aac, adpcm_g726, wrapped_avframe],
          hwaccels: [],
          demuxers: [mov, matroska, pcm_s16le],
          muxers: [mp4, matroska, null],
          protocols: [file, pipe],
          filters: [scale, aresample, testsrc2],
        },
      tests: [tests/test-env.sh],
      test-env: [FFB_TEST_ENV_CHECK],
    }
  linux-arm64-lgplv3:
    {
      platform: linux-arm64,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      with: [cuda-llvm, opencl, vdpau, rkmpp, rav1e, rsvg],
    }
  win-x64-lgplv3:
    {
      platform: win-x64,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      with: [cuda-llvm, opencl, d3d12va, rav1e, rsvg],
      tests: [tests/test-env.sh],
      test-env: [FFB_TEST_ENV_CHECK],
    }
  linux-armhf-lgplv3:
    {
      platform: linux-armhf,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      with: [opencl, vdpau, rkmpp, rav1e, rsvg],
      tests: [tests/test-env.sh],
      test-env: [FFB_TEST_ENV_CHECK],
    }
  linux-musl-arm64-lgplv3:
    {
      platform: linux-musl-arm64,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      with: [cuda-llvm, opencl, vdpau, rkmpp, rav1e, rsvg],
      tests: [tests/test-env.sh],
      test-env: [FFB_TEST_ENV_CHECK],
    }
  win-arm64-lgplv3:
    {
      platform: win-arm64,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      with: [opencl, d3d12va, rav1e, rsvg],
    }
  # android-api: 24, below the default 28: the NDK's API 24 compilers, and the smoke program linked for API 24
  android-arm64-lgplv3:
    { platform: android-arm64, license: lgplv3, ffmpeg: 9, base: [small], android-api: 24 }
  # rav1e and rsvg on Android, at the default API 28: GLib (under librsvg) takes bionic's iconv, which is API 28
  android-arm64-rust-lgplv3:
    { platform: android-arm64, license: lgplv3, ffmpeg: 9, base: [small], with: [rav1e, rsvg] }
  # a slim library build (devenvy/ffmpeg-build#53): decode-only, every kind restricted (bitstream filters, parsers and
  # filters too), so the smoke program is asked only for what it built: no frame round trip, and none of the decoders
  # and formats an unrestricted build is checked for. No options, so nothing brings an encoder along.
  android-arm64-slim-lgplv3:
    {
      platform: android-arm64,
      license: lgplv3,
      ffmpeg: 9,
      components:
        {
          decoders: [h264, aac],
          encoders: [],
          hwaccels: [],
          demuxers: [mov],
          muxers: [mp4],
          parsers: [h264, aac],
          bsfs: [h264_mp4toannexb],
          protocols: [file],
          indevs: [],
          outdevs: [],
          filters: [],
        },
    }
  # OpenColorIO: FFmpeg's ocio filter is C++, which on macOS compiles only without the release's VERSION file
  # (devenvy/ffmpeg-build#41); tests/ocio.sh runs it
  osx-arm64-lgplv3:
    {
      platform: osx-arm64,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      with: [opencl, opencolorio, avfoundation, coreimage],
      tests: [tests/test-env.sh, tests/ocio.sh],
      test-env: [FFB_TEST_ENV_CHECK],
    }
  # MoltenVK linked statically into the frameworks (--enable-vulkan-static), as the shipped v3 targets have it
  ios-arm64-lgplv3:
    {
      platform: ios-arm64,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      with: [vulkan, placebo, avfoundation],
    }
  # slim (devenvy/ffmpeg-build#53), run in the iOS simulator: no mpeg4 codecs, so the smoke program round-trips a
  # frame with ffv1, the first codec of its list this build has as both encoder and decoder
  ios-sim-arm64-lgplv3:
    {
      platform: ios-sim-arm64,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      components:
        {
          decoders: [h264, aac, ffv1],
          encoders: [aac, ffv1],
          demuxers: [mov],
          muxers: [mp4, 'null'],
          filters: [scale],
        },
    }
  maccatalyst-arm64-lgplv3:
    {
      platform: maccatalyst-arm64,
      license: lgplv3,
      ffmpeg: 9,
      base: [small],
      with: [vulkan, placebo, avfoundation],
    }
  maccatalyst-x64-lgplv3:
    { platform: maccatalyst-x64, license: lgplv3, ffmpeg: 9, base: [small], with: [avfoundation] }
