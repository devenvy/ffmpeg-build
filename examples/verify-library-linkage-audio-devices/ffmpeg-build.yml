targets:
  linux-x64-static-9-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [openal, sndio, alsa]
    tests: [tests/audio-device-linkage.sh]
  linux-x64-shared-9-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [openal, sndio, alsa]
    tests: [tests/audio-device-linkage.sh]
    link: { openal-soft: shared, sndio: shared, alsa-lib: shared }
  linux-x64-static-8-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '8'
