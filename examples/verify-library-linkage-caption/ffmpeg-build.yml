targets:
  linux-x64-shared-fonts-nonfree:
    platform: linux-x64
    license: nonfree
    ffmpeg: '9'
    with: [aribb24, aribcaption, zvbi, decklink]
    tests: [tests/caption-linkage.sh]
    link:
      {
        aribb24: shared,
        libaribcaption: shared,
        zvbi: shared,
        libklvanc: shared,
        freetype: shared,
        fontconfig: shared,
        libpng: shared,
        zlib: shared,
        libexpat: shared,
      }
  linux-x64-static-9-nonfree:
    platform: linux-x64
    license: nonfree
    ffmpeg: '9'
    with: [aribb24, aribcaption, zvbi, decklink]
    tests: [tests/caption-linkage.sh]
  linux-x64-shared-9-nonfree:
    platform: linux-x64
    license: nonfree
    ffmpeg: '9'
    with: [aribb24, aribcaption, zvbi, decklink]
    tests: [tests/caption-linkage.sh]
    link: { aribb24: shared, libaribcaption: shared, zvbi: shared, libklvanc: shared }
  linux-x64-static-8-nonfree:
    platform: linux-x64
    license: nonfree
    ffmpeg: '8'
    with: [aribb24, aribcaption, zvbi, decklink]
    tests: [tests/caption-linkage.sh]
  linux-x64-shared-8-nonfree:
    platform: linux-x64
    license: nonfree
    ffmpeg: '8'
    with: [aribb24, aribcaption, zvbi, decklink]
    tests: [tests/caption-linkage.sh]
    link: { aribb24: shared, libaribcaption: shared, zvbi: shared, libklvanc: shared }
