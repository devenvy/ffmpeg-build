targets:
  linux-x64-static-9-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [cdio]
    tests: [tests/cdio-linkage.sh]
  linux-x64-shared-9-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [cdio]
    tests: [tests/cdio-linkage.sh]
    link: { libcdio: shared, libcdio-paranoia: shared }
  linux-x64-static-8-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '8'
    with: [cdio]
    tests: [tests/cdio-linkage.sh]
  linux-x64-shared-8-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '8'
    with: [cdio]
    tests: [tests/cdio-linkage.sh]
    link: { libcdio: shared, libcdio-paranoia: shared }
  linux-x64-shared-paranoia-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [cdio]
    tests: [tests/cdio-linkage.sh]
    link: { libcdio-paranoia: shared }
  linux-x64-shared-cdio-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [cdio]
    tests: [tests/cdio-linkage.sh]
    link: { libcdio: shared }
