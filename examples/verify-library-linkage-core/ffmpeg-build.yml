targets:
  linux-x64-8-static-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '8'
    with: [zlib, lzma, aom, dav1d, soxr, bs2b]
    tests: [tests/core-linkage.sh]
  linux-x64-8-shared-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '8'
    with: [zlib, lzma, aom, dav1d, soxr, bs2b]
    link: { zlib: shared, xz: shared, aom: shared, dav1d: shared, soxr: shared, libbs2b: shared }
    tests: [tests/core-linkage.sh]
  linux-x64-9-static-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [zlib, lzma, aom, dav1d, soxr, bs2b]
    tests: [tests/core-linkage.sh]
  linux-x64-9-shared-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [zlib, lzma, aom, dav1d, soxr, bs2b]
    link: { zlib: shared, xz: shared, aom: shared, dav1d: shared, soxr: shared, libbs2b: shared }
    tests: [tests/core-linkage.sh]
