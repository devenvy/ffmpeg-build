targets:
  linux-x64-static-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [bzlib, xml2, zlib]
    tests: [tests/data-linkage.sh]
  linux-x64-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [bzlib, xml2, zlib]
    tests: [tests/data-linkage.sh]
    link: { bzip2: shared, libxml2: shared, zlib: shared }
  linux-x64-static-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [bzlib, xml2, zlib]
    tests: [tests/data-linkage.sh]
  linux-x64-shared-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [bzlib, xml2, zlib]
    tests: [tests/data-linkage.sh]
    link: { bzip2: shared, libxml2: shared, zlib: shared }
  linux-x64-shared-parent-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [bzlib, xml2, zlib]
    tests: [tests/data-linkage.sh]
    link: { bzip2: shared, libxml2: shared }
  linux-x64-shared-child-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [bzlib, xml2, zlib]
    tests: [tests/data-linkage.sh]
    link: { zlib: shared }
