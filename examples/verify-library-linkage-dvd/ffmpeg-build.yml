targets:
  linux-x64-static-9-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [dvdread, dvdnav]
    tests: [tests/dvd-linkage.sh]
  linux-x64-shared-9-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [dvdread, dvdnav]
    tests: [tests/dvd-linkage.sh]
    link: { libdvdread: shared, libdvdnav: shared }
  linux-x64-static-8-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '8'
    with: [dvdread, dvdnav]
    tests: [tests/dvd-linkage.sh]
  linux-x64-shared-8-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '8'
    with: [dvdread, dvdnav]
    tests: [tests/dvd-linkage.sh]
    link: { libdvdread: shared, libdvdnav: shared }
  linux-x64-shared-nav-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [dvdread, dvdnav]
    tests: [tests/dvd-linkage.sh]
    link: { libdvdnav: shared }
  linux-x64-shared-read-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [dvdread, dvdnav]
    tests: [tests/dvd-linkage.sh]
    link: { libdvdread: shared }
