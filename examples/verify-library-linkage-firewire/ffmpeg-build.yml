targets:
  linux-x64-static-9-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [dc1394, iec61883]
    tests: [tests/firewire-linkage.sh]
  linux-x64-shared-9-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [dc1394, iec61883]
    tests: [tests/firewire-linkage.sh]
    link: { libraw1394: shared, libavc1394: shared, libiec61883: shared, libdc1394: shared }
  linux-x64-static-8-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '8'
    with: [dc1394, iec61883]
    tests: [tests/firewire-linkage.sh]
  linux-x64-shared-8-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '8'
    with: [dc1394, iec61883]
    tests: [tests/firewire-linkage.sh]
    link: { libraw1394: shared, libavc1394: shared, libiec61883: shared, libdc1394: shared }
  linux-x64-shared-capture-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [dc1394, iec61883]
    tests: [tests/firewire-linkage.sh]
    link: { libiec61883: shared, libdc1394: shared }
  linux-x64-shared-deps-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [dc1394, iec61883]
    tests: [tests/firewire-linkage.sh]
    link: { libraw1394: shared, libavc1394: shared }
  linux-x64-shared-combined-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [dc1394, iec61883, alsa, pulse, jack, ass]
    tests: [tests/firewire-linkage.sh]
    link:
      {
        libraw1394: shared,
        libavc1394: shared,
        libiec61883: shared,
        libdc1394: shared,
        alsa-lib: shared,
        pulseaudio: shared,
        jack2: shared,
        libass: shared,
        freetype: shared,
        harfbuzz: shared,
        fribidi: shared,
        fontconfig: shared,
        libexpat: shared,
        libpng: shared,
        zlib: shared,
      }
