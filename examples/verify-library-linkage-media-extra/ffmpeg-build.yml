targets:
  linux-x64-static-9-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [lcms2, gsm, gme, flite, zlib]
    tests: [tests/media-linkage.sh]
  linux-x64-shared-9-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [lcms2, gsm, gme, flite, zlib]
    tests: [tests/media-linkage.sh]
    link: { lcms2: shared, libgsm: shared, libgme: shared, flite: shared }
  linux-x64-static-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [lcms2, gsm, gme, flite, zlib]
    tests: [tests/media-linkage.sh]
  linux-x64-shared-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [lcms2, gsm, gme, flite, zlib]
    tests: [tests/media-linkage.sh]
    link: { lcms2: shared, libgsm: shared, libgme: shared, flite: shared }
