targets:
  linux-x64-static-9-lgplv3:
    tests: [tests/network-extra.sh]
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [srt, rist, zmq, rabbitmq]
  linux-x64-shared-9-lgplv3:
    tests: [tests/network-extra.sh]
    platform: linux-x64
    license: lgplv3
