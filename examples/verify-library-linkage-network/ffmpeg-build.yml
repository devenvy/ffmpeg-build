targets:
  linux-x64-static-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [gnutls, ssh, rtmp]
    tests: [tests/network-linkage.sh]
  linux-x64-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [gnutls, ssh, rtmp]
    tests: [tests/network-linkage.sh]
    link: { libssh: shared, librtmp: shared }
  linux-x64-static-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [gnutls, ssh, rtmp]
    tests: [tests/network-linkage.sh]
  linux-x64-shared-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [gnutls, ssh, rtmp]
    tests: [tests/network-linkage.sh]
    link: { libssh: shared, librtmp: shared }
