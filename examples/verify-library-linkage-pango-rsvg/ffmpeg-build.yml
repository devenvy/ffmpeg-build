targets:
  linux-x64-shared-9-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [rsvg, cairo, harfbuzz]
    tests: [tests/pango-rsvg-linkage.sh]
    link:
      {
        librsvg: shared,
        pango: shared,
        cairo: shared,
        glib: shared,
        fontconfig: shared,
