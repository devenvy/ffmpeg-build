targets:
  linux-x64-static-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [theora, opencore-amrnb, opencore-amrwb, vo-amrwbenc, ilbc]
    tests: [tests.sh]
  linux-x64-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [theora, opencore-amrnb, opencore-amrwb, vo-amrwbenc, ilbc]
    tests: [tests.sh]
    link:
      {
        libogg: shared,
        libtheora: shared,
        opencore-amr: shared,
        vo-amrwbenc: shared,
        libilbc: shared,
      }
  linux-x64-static-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [theora, opencore-amrnb, opencore-amrwb, vo-amrwbenc, ilbc]
    tests: [tests.sh]
  linux-x64-shared-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [theora, opencore-amrnb, opencore-amrwb, vo-amrwbenc, ilbc]
    tests: [tests.sh]
    link:
      {
        libogg: shared,
        libtheora: shared,
        opencore-amr: shared,
        vo-amrwbenc: shared,
        libilbc: shared,
      }
  linux-x64-theora-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [theora, opencore-amrnb, opencore-amrwb, vo-amrwbenc, ilbc]
    tests: [tests.sh]
    link: { libtheora: shared }
  linux-x64-ogg-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [theora, opencore-amrnb, opencore-amrwb, vo-amrwbenc, ilbc]
    tests: [tests.sh]
    link: { libogg: shared }
