bases:
  common:
    with: [zlib, lzma, vorbis, opus, speex, ass, freetype, fribidi, harfbuzz, fontconfig]
  system:
    link:
      {
        zlib: system-shared,
        xz: system-shared,
        libogg: system-shared,
        libvorbis: system-shared,
        opus: system-shared,
        speex: system-shared,
        libexpat: system-shared,
      }
targets:
  linux-x64-system-9-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    base: [common, system]
    tests: [tests/system-core.sh]
  linux-x64-system-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    base: [common, system]
    tests: [tests/system-core.sh]
  linux-x64-system-ogg-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    base: [common]
    tests: [tests/system-core.sh]
    link: { libogg: system-shared, libvorbis: shared }
  linux-x64-system-vorbis-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    base: [common]
    tests: [tests/system-core.sh]
    link: { libogg: shared, libvorbis: system-shared }
