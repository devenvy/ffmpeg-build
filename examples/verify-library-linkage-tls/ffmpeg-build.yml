targets:
  linux-x64-static-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [gnutls]
    tests: [tests/tls-linkage.sh]
  linux-x64-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [gnutls]
    tests: [tests/tls-linkage.sh]
    link: { gmp: shared, nettle: shared, libtasn1: shared, gnutls: shared }
  linux-x64-static-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [gnutls]
    tests: [tests/tls-linkage.sh]
  linux-x64-shared-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [gnutls]
    tests: [tests/tls-linkage.sh]
    link: { gmp: shared, nettle: shared, libtasn1: shared, gnutls: shared }
  linux-x64-shared-parent-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [gnutls]
    tests: [tests/tls-linkage.sh]
    link: { gnutls: shared }
  linux-x64-shared-children-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [gnutls]
    tests: [tests/tls-linkage.sh]
    link: { gmp: shared, nettle: shared, libtasn1: shared }
  linux-x64-shared-nettle-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [gnutls]
    tests: [tests/tls-linkage.sh]
    link: { nettle: shared }
