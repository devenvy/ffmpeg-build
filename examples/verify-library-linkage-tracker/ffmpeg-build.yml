targets:
  linux-x64-static-9-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [modplug, openmpt, pulse]
    tests: [tests/tracker-linkage.sh, tests/pulse-linkage.sh]
  linux-x64-shared-9-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [modplug, openmpt, pulse]
    tests: [tests/tracker-linkage.sh]
    link: { libmodplug: shared, libopenmpt: shared, libsndfile: shared }
  linux-x64-static-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [modplug, openmpt, pulse]
    tests: [tests/tracker-linkage.sh]
  linux-x64-shared-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [modplug, openmpt, pulse]
    tests: [tests/tracker-linkage.sh]
    link: { libmodplug: shared, libopenmpt: shared, libsndfile: shared }
  linux-x64-shared-pulse-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [modplug, openmpt, pulse]
    tests: [tests/tracker-linkage.sh, tests/pulse-linkage.sh]
    link: { libmodplug: shared, libopenmpt: shared, libsndfile: shared, pulseaudio: shared }
