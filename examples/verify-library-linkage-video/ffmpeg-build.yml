targets:
  linux-x64-static-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [x264, openh264, xvid, x265, vvenc, svtav1, dav1d]
    tests: [tests/video-linkage.sh]
  linux-x64-shared-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [x264, openh264, xvid, x265, vvenc, svtav1, dav1d]
    tests: [tests/video-linkage.sh]
    link:
      {
        x264: shared,
        openh264: shared,
        xvidcore: shared,
        x265: shared,
        vvenc: shared,
        svtav1: shared,
      }
  linux-x64-static-8-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '8'
    with: [x264, openh264, xvid, x265, vvenc, svtav1, dav1d]
    tests: [tests/video-linkage.sh]
  linux-x64-shared-8-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '8'
    with: [x264, openh264, xvid, x265, vvenc, svtav1, dav1d]
    tests: [tests/video-linkage.sh]
    link:
      {
        x264: shared,
        openh264: shared,
        xvidcore: shared,
        x265: shared,
        vvenc: shared,
        svtav1: shared,
      }
