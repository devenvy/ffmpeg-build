targets:
  linux-x64-static-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [vulkan, placebo]
    tests: [tests/vulkan-linkage.sh]
  linux-x64-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [vulkan, placebo]
    tests: [tests/vulkan-linkage.sh]
    link: { vulkan-loader: shared }
  linux-x64-static-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [vulkan, placebo]
    tests: [tests/vulkan-linkage.sh]
  linux-x64-whisper-static-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [vulkan, placebo, whisper]
    tests: [tests/vulkan-linkage.sh]
  linux-x64-shared-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [vulkan, placebo]
    tests: [tests/vulkan-linkage.sh]
    link: { vulkan-loader: shared }
  linux-x64-whisper-shared-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [vulkan, placebo, whisper]
    tests: [tests/vulkan-linkage.sh]
    link: { vulkan-loader: shared }
  linux-x64-whisper-only-lgplv3:
    platform: linux-x64
