targets:
  linux-x64-static-9-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [xcb, xlib]
    tests: [tests/x11-linkage.sh]
  linux-x64-shared-9-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [xcb, xlib]
    tests: [tests/x11-linkage.sh]
    link: { libxau: shared, libxcb: shared, libx11: shared, libxext: shared, libxv: shared }
