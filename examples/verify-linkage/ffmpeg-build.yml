targets:
  linux-x64-9-static:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [gcrypt, libtls]
    tests: [tests/protocols.sh]
  linux-x64-9-shared:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [gcrypt, libtls]
    tests: [tests/protocols.sh]
    link: { libgcrypt: shared, libgpg-error: shared }
  linux-x64-9-gcrypt-shared:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [gcrypt, libtls]
    tests: [tests/protocols.sh]
    link: { libgcrypt: shared }
  linux-x64-9-error-shared:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [gcrypt, libtls]
    tests: [tests/protocols.sh]
    link: { libgpg-error: shared }
  linux-x64-8-static:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '8'
    with: [gcrypt, libtls]
    tests: [tests/protocols.sh]
