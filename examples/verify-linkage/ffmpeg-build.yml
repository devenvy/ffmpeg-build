    ffmpeg: '8'
    with: [gcrypt, libtls]
    tests: [tests/protocols.sh]
    link: { libgcrypt: shared, libgpg-error: shared }
  linux-x64-8-gcrypt-shared:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '8'
    with: [gcrypt, libtls]
    tests: [tests/protocols.sh]
