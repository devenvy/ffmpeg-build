targets:
  linux-x64-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [openvino]
    tests: [tests/openvino.sh]
  linux-x64-9-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [openvino]
    tests: [tests/openvino.sh]
  linux-x64-onnx-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [openvino, onnxruntime]
    tests: [tests/openvino.sh, tests/onnxruntime.sh]
