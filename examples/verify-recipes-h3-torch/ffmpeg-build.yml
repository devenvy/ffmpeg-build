targets:
  linux-x64-torch-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [torch]
    tests: [tests/torch.sh]
  linux-x64-torch-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [torch]
    tests: [tests/torch.sh]
  linux-x64-ml-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [torch, onnxruntime, openvino]
    tests: [tests/torch.sh, tests/onnxruntime.sh, tests/openvino.sh]
