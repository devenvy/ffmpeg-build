targets:
  linux-x64-tensorflow-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [tensorflow]
    tests: [tests/tensorflow.sh]
  linux-x64-tensorflow-8-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '8'
    with: [tensorflow]
    tests: [tests/tensorflow.sh]
  linux-x64-ml-lgplv3:
    platform: linux-x64
    license: lgplv3
    ffmpeg: '9'
    with: [tensorflow, torch, onnxruntime, openvino]
    tests: [tests/tensorflow.sh, tests/torch.sh, tests/onnxruntime.sh, tests/openvino.sh]
