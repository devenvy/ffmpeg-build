targets:
  linux-x64-8-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '8'
    with: [smbclient]
    tests: [tests/smbclient.mjs]
  linux-x64-9-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [smbclient]
    tests: [tests/smbclient.mjs]
  linux-x64-gnutls-gplv3:
    platform: linux-x64
    license: gplv3
    ffmpeg: '9'
    with: [smbclient, gnutls]
    tests: [tests/smbclient.mjs]
