targets:
  linux-x64-8-system-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '8'
    with: [gcrypt]
    link: { libgcrypt: system-shared, libgpg-error: system-shared }
    tests: [tests/system-shared.sh]
  linux-x64-9-system-lgplv2:
    platform: linux-x64
    license: lgplv2
    ffmpeg: '9'
    with: [gcrypt]
    link: { libgcrypt: system-shared, libgpg-error: system-shared }
    tests: [tests/system-shared.sh]
