# A consumer's pull-request check (copy into .github/workflows/): checks that ffmpeg-build.yml is valid, that
# ffmpeg.lock covers it and that every target can be planned, in a minute and without building anything (the release
# builds every target before it publishes, and keeps a release that fails a draft). It merges ffmpeg-build's own PRs
# (update-lock.yml or update-pin.yml with automerge: true) once the check passes.
#
# Repository setting: none for this workflow. (update-lock.yml needs "Allow GitHub Actions to create and approve pull
# requests" to open the PRs it checks.)
# Permissions: contents: read for the check; contents: write and pull-requests: write for the merge job only.
name: CI
on:
  pull_request:
  workflow_dispatch: # update-lock.yml and update-pin.yml start it on its PR's branch (GITHUB_TOKEN's pushes start nothing)

# a newer push to the same branch replaces the run under way
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job grants what it needs; nothing else writes. Pull requests from forks get a read-only token anyway.
permissions:
  contents: read

jobs:
  check:
    uses: devenvy/ffmpeg-build/.github/workflows/check.yml@v0
    permissions:
      contents: read
  # one check for a branch ruleset to require, whatever ran
  result:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: the check passed
        env:
          CHECK: ${{ needs.check.result }}
        run: test "${CHECK}" = success
  merge:
    needs: result
    uses: devenvy/ffmpeg-build/.github/workflows/automerge.yml@v0
    permissions:
      contents: write
      pull-requests: write
