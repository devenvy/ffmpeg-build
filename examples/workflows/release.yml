# A consumer's daily release train (copy into .github/workflows/): publishes every release whose builds changed since
# it was last published. Back-to-back merges cost one release; a failed day is retried the next.
#
# Repository setting: none.
# Permissions: contents: write (below), to create the GitHub releases.
name: Release
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: devenvy/ffmpeg-build/.github/workflows/build.yml@v0
    permissions:
      contents: write
    with:
      publish: changed-only
    # A target whose tests: need a secret lists it in test-env: (docs/building.md, "Tests that need a secret"); name
    # here only the repository secrets the tests may have, one NAME=value line each. Only the test steps get them.
    # secrets:
    #   test-env: |
    #     DECRYPT_KEY=${{ secrets.DECRYPT_KEY }}
