# A product's FFmpeg bumps (copy into .github/workflows/): moves ffmpeg.version to the newest build of the same FFmpeg
# major and opens a PR; the product's own CI tests it, dispatched on the PR's branch (ci-workflow: the file name of
# that workflow, which needs workflow_dispatch:) since GITHUB_TOKEN's pushes start none. With automerge: true (below)
# the PR is labelled and merged once that CI passes, if the product's CI ends with a job that calls automerge.yml (as
# examples/workflows/ci.yml does); without that job the label does nothing and the PR waits for you.
# FFMPEG_READ_TOKEN is optional: a token that can read a private release repository; its pushes start CI themselves.
#
# Repository setting: Settings, Actions, General, "Allow GitHub Actions to create and approve pull requests" (or the
# FFMPEG_READ_TOKEN secret, with pull-requests write), so the workflow can open the PR.
# Permissions: actions: write, contents: write and pull-requests: write (below).
name: Update pin
on:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    uses: devenvy/ffmpeg-build/.github/workflows/update-pin.yml@v0
    permissions:
      actions: write # to dispatch the PR's CI
      contents: write
      pull-requests: write
    with:
      pin-file: ffmpeg.version
      target: linux-x64-lgplv3
      automerge: true
      ci-workflow: ci.yml # the product's own CI workflow's file name; it needs workflow_dispatch:
    secrets:
      token: ${{ secrets.FFMPEG_READ_TOKEN }}
