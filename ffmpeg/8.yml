# The options the engine builds for this FFmpeg major. `releases:` is kept equal to FFmpeg's release tags by the nightly
# support check (.github/workflows/ffmpeg-support.yml), which also reports options a new release adds, removes or
# reclassifies; those, and the options below, are maintained by a person.
# Classes (ffmpeg-license) and minimums (min) are copied from FFmpeg 9.0.2's configure (8.x where it differs). Option names are FFmpeg's
# configure names without a leading `lib`, plus the friendly groupings nvenc (nv-codec), vaapi (libva), whisper.
# `ships:` is what a build with the option on must report, each name as configure spells it (as
# ffmpeg/components/<major>.yml lists it: libvpx_vp8, which `ffmpeg -encoders` calls libvpx), and under hwaccels: the
# device types `ffmpeg -hwaccels` lists. `ffmpeg-build test` checks it, so an option configure took but the build lost
# (FFmpeg 8.1.2's Vulkan builds had no Vulkan filters: the glslc was too old) fails the test. Name only what the option
# always adds, or say what else it needs with `{ name: { with: [option] } }`.
# `auto-components:` names the options whose components come with them: when a target lists a kind (`components:`),
# every component of that kind that needs one of them (the components file's needs:) is kept: libx264, h264_vaapi,
# scale_cuda. Support libraries (zlib, xml2, harfbuzz, the TLS options, ...) aren't in it: a target lists png, dash or
# https itself, and `check` says which option each needs.
major: 8
releases: [8.0, 8.0.1, 8.0.2, 8.0.3, 8.1, 8.1.1, 8.1.2, 8.1.3]
auto-components:
  - cuda-nvcc
  - decklink
  - smbclient
  - openvino
  - fdk-aac
  - mpeghdec
  - mediacodec
  - d3d11va
  - dxva2
  - mediafoundation
  - amf
  - v4l2-m2m
  - videotoolbox
  - audiotoolbox
  - nvenc
  - vaapi
  - cuda-llvm
  - opencl
  - d3d12va
  - vdpau
  - rkmpp
  - vpl
  - vulkan
  - placebo
  - whisper
  - x264
  - x265
  - openh264
  - kvazaar
  - dav1d
  - aom
  - svtav1
  - vpx
  - webp
  - openjpeg
  - jxl
  - zimg
  - vmaf
  - opus
  - vorbis
  - mp3lame
  - speex
  - gsm
  - opencore-amrnb
  - opencore-amrwb
  - vo-amrwbenc
  - chromaprint
  - freetype
  - ass
  - srt
  - rist
  - theora
  - xvid
  - vvenc
  - xavs
  - davs2
  - xavs2
  - uavs3d
  - xeve
  - xevd
  - oapv
  - svtjpegxs
  - lcevc-dec
  - twolame
  - shine
  - lc3
  - codec2
  - ilbc
  - gme
  - modplug
  - openmpt
  - rav1e
  - vidstab
  - mysofa
  - bs2b
  - qrencode
  - quirc
  - flite
  - zvbi
  - aribb24
  - aribcaption
  - rubberband
  - ladspa
  - lv2
  - frei0r
  - lensfun
  - opencolorio
  - cairo
  - rsvg
  - tesseract
  - opencv
  - zmq
  - rabbitmq
  - ssh
  - rtmp
  - bluray
  - dvdnav
  - dvdread
  - cdio
  - avisynth
  - vapoursynth
  - alsa
  - pulse
  - jack
  - sndio
  - openal
  - xcb
  - xlib
  - caca
  - dc1394
  - iec61883
  - avfoundation
  - coreimage
options:
  cuda-nvcc:
    {
      needs: cuda-nvcc,
      ffmpeg-license: nonfree,
      ships:
        {
          hwaccels: [cuda],
          filters: [scale_cuda, yadif_cuda, bwdif_cuda, overlay_cuda, thumbnail_cuda],
        },
    }
  decklink: { needs: decklink-headers, ffmpeg-license: nonfree, kind: device }
  smbclient: { needs: samba, ffmpeg-license: gplv3, ships: { protocols: [libsmbclient] } }
  libtls: { needs: libressl, ships: { protocols: [tls, https] } }
  gcrypt: { needs: libgcrypt, ships: { protocols: [rtmpe, rtmpte] } }
  openvino:
    { needs: openvino, ships: { filters: [dnn_processing, dnn_classify, dnn_detect, derain, sr] } }
  fdk-aac:
    {
      needs: fdk-aac,
      ffmpeg-license: nonfree,
      ships: { encoders: [libfdk_aac], decoders: [libfdk_aac] },
    }
  mpeghdec:
    { needs: mpeghdec, ffmpeg-license: nonfree, min: 4.0.1, ships: { decoders: [libmpeghdec] } }
  # built into FFmpeg: nothing to build
  # Android's hardware video (MediaCodec) and the Java bridge it needs (both built into FFmpeg; the OS provides them)
  jni: { builtin: true, kind: hwaccel, platforms: [android-*] }
  # the MediaCodec decoders; FFmpeg has no mediacodec hwaccels (upstream's --enable-hwaccel=h264_mediacodec and
  # hevc_mediacodec matched nothing)
  mediacodec:
    {
      builtin: true,
      kind: hwaccel,
      platforms: [android-*],
      configure:
        [--enable-mediacodec, --enable-decoder=h264_mediacodec, --enable-decoder=hevc_mediacodec],
      ships: { hwaccels: [mediacodec], decoders: [h264_mediacodec, hevc_mediacodec] },
    }
  # Windows hardware video and the media framework (built into FFmpeg; the OS provides them at run time)
  d3d11va: { builtin: true, kind: hwaccel, platforms: [win-*], ships: { hwaccels: [d3d11va] } }
  dxva2: { builtin: true, kind: hwaccel, platforms: [win-*], ships: { hwaccels: [dxva2] } }
  mediafoundation:
    { builtin: true, kind: hwaccel, platforms: [win-*], ships: { encoders: [h264_mf] } }
  amf: { needs: amf, platforms: [win-*, linux-*], ships: { encoders: [h264_amf, av1_amf] } }
  schannel:
    { builtin: true, kind: tls, platforms: [win-*], group: tls, ships: { protocols: [tls, https] } }
  securetransport:
    {
      builtin: true,
      kind: tls,
      platforms: [osx-*, ios-*],
      group: tls,
      ships: { protocols: [tls, https] },
    }
  v4l2-m2m:
    {
      builtin: true,
      kind: hwaccel,
      platforms: [linux-*, android-*],
      ships: { encoders: [h264_v4l2m2m] },
    }
  videotoolbox:
    {
      builtin: true,
      kind: hwaccel,
      platforms: [osx-*, ios-*, maccatalyst-*],
      ships: { hwaccels: [videotoolbox], encoders: [h264_videotoolbox, hevc_videotoolbox] },
    }
  audiotoolbox:
    {
      builtin: true,
      kind: hwaccel,
      platforms: [osx-*, ios-*, maccatalyst-*],
      ships: { encoders: [aac_at] },
    }
  # Apple's capture device (cameras and microphones; screens on macOS), and the macOS framework behind the coreimage
  # filters, which needs AppKit too (appkit turns nothing else on). (The input device isn't in ships:, which names
  # what `ffmpeg -<kind>` lists, and devices are -devices'.) metal waits on #62.
  avfoundation: { builtin: true, kind: device, platforms: [osx-*, ios-*, maccatalyst-*] }
  coreimage:
    {
      builtin: true,
      kind: framework,
      platforms: [osx-*],
      configure: [--enable-coreimage, --enable-appkit],
      ships: { filters: [coreimage, coreimagesrc] },
    }

  # TLS (one per build: group tls; the profile lists which, per platform and license)
  openssl: { needs: openssl, min: 3.0.0, ships: { protocols: [tls, https] } }
  gnutls: { needs: gnutls, ships: { protocols: [tls, https] } }
  # mbedTLS 3 (Apache-2.0 OR GPL-2.0-or-later; FFmpeg classes it version3), the one TLS library built on every platform
  mbedtls:
    {
      needs: mbedtls,
      group: tls,
      ffmpeg-license: version3,
      configure: [--enable-mbedtls],
      ships: { protocols: [tls, https] },
    }

  # hardware
  nvenc:
    {
      needs: nv-codec,
      platforms: [linux-*, win-*],
      ships:
        { hwaccels: [cuda], encoders: [h264_nvenc, hevc_nvenc, av1_nvenc], decoders: [av1_cuvid] },
    }
  vaapi:
    {
      needs: libva,
      platforms: [linux-*],
      ships:
        {
          hwaccels: [vaapi],
          encoders: [h264_vaapi, hevc_vaapi, av1_vaapi],
          filters: [transpose_vaapi],
        },
    }
  drm: { needs: libdrm, platforms: [linux-*] }
  # The CUDA filters, their kernels compiled to PTX by clang (the toolchain images have it; llvm-mingw's on Windows)
  # against nv-codec's headers; FFmpeg loads the CUDA driver at run time. Only the filters: NVENC, NVDEC and CUVID are
  # nvenc's. (NVIDIA's own compiler, cuda-nvcc, is nonfree.)
  cuda-llvm:
    {
      needs: nv-codec,
      platforms: [linux-*, win-*],
      configure: [--enable-ffnvcodec, --enable-cuda, --enable-cuda-llvm],
      ships:
        {
          hwaccels: [cuda],
          filters: [scale_cuda, yadif_cuda, bwdif_cuda, overlay_cuda, thumbnail_cuda],
        },
    }
  # The OpenCL filters and hwcontext: the Khronos ICD loader (static) on Linux and Windows, which finds the GPU
  # vendors' drivers at run time; macOS's own OpenCL framework (built in there).
  opencl:
    {
      builtin: true,
      needs: [{ opencl-icd-loader: { platforms: [linux-*, win-*] } }],
      platforms: [linux-*, win-*, osx-*],
      ships:
        {
          hwaccels: [opencl],
          filters: [avgblur_opencl, overlay_opencl, unsharp_opencl, program_opencl],
        },
    }
  # Direct3D 12 video (decode hwaccels and encoders; the OS provides it at run time). llvm-mingw (win-arm64) has the
  # headers; win-x64's mingw-w64 lacks d3d12video.h, so a newer mingw-w64's are copied in there.
  d3d12va:
    {
      builtin: true,
      kind: hwaccel,
      platforms: [win-*],
      needs: [{ d3d12-headers: { platforms: [win-x64] } }],
      ships: { hwaccels: [d3d12va], encoders: [hevc_d3d12va] },
    }
  # The VDPAU hwaccels (NVIDIA's legacy Unix video decode API): the headers alone. Without libvdpau's library FFmpeg
  # has no vdpau_x11, so it can't create a VDPAU device itself: an application passes its own (AVVDPAUDeviceContext).
  # Not even with xlib: libvdpau loads the system's driver (libvdpau_<driver>.so), which links the system's libX11
  # and libxcb, and would be handed the X connection of the build's static ones.
  vdpau: { needs: libvdpau, platforms: [linux-*], ships: { hwaccels: [vdpau] } }
  # Rockchip's video blocks (rockchip_mpp, with libdrm), on Rockchip's ARM SoCs (the encoders came in 8.1)
  rkmpp:
    {
      needs: rockchip-mpp,
      ffmpeg-license: version3,
      platforms: [linux-*],
      ships: { decoders: [h264_rkmpp, hevc_rkmpp] },
    }
  vpl: { needs: libvpl, min: 2.6.0, ships: { encoders: [h264_qsv, hevc_qsv, av1_qsv] } }
  # FFmpeg's Vulkan: the Khronos loader on glibc and musl Linux, and on macOS with MoltenVK beside it; on Windows,
  # linux-armhf and Android only the headers (FFmpeg loads the system's Vulkan library at run time); on iOS and Mac
  # Catalyst MoltenVK linked statically into the libav* frameworks (--enable-vulkan-static). Each library's recipe
  # gives the flags. android-api: 28 (vulkan, placebo) is policy, not a link requirement: the headers build for any
  # level, but Android's Vulkan is 1.1 from Android 9 (API 28) and FFmpeg's needs a 1.3 device, so an older floor
  # would ship a Vulkan no device at that level can run.
  vulkan: {
      needs:
        [
          { vulkan-loader: { platforms: [linux-x64, linux-arm64, linux-musl-*, osx-*] } },
          { vulkan-headers: { platforms: [win-*, linux-armhf, android-*] } },
          { moltenvk: { platforms: [ios-arm64, maccatalyst-*] } },
        ],
      min: 1.3.277,
      android-api: 28,
      # FFmpeg 8.x compiles its Vulkan filters' shaders only with libshaderc
      ships: { hwaccels: [vulkan], filters: [{ scale_vulkan: { with: [shaderc] } }] },
    }
  placebo:
    {
      needs: libplacebo,
      min: 5.229.0,
      android-api: 28,
      ships: { filters: [{ libplacebo: { with: [vulkan] } }] },
    }
  # FFmpeg 8.x only gets its Vulkan filters' shader compiler through libshaderc
  shaderc: { needs: shaderc, min: 2019.1 }
  whisper: { needs: whisper.cpp, min: 1.7.5, since: 8.0.0, ships: { filters: [whisper] } }

  # video
  x264: { needs: x264, ffmpeg-license: gpl, ships: { encoders: [libx264] } }
  x265: { needs: x265, ffmpeg-license: gpl, ships: { encoders: [libx265] } }
  openh264:
    { needs: openh264, min: 1.3.0, ships: { encoders: [libopenh264], decoders: [libopenh264] } }
  kvazaar: { needs: kvazaar, min: 2.0.0, ships: { encoders: [libkvazaar] } }
  dav1d: { needs: dav1d, min: 1.0.0, ships: { decoders: [libdav1d] } }
  aom: { needs: aom, min: 2.0.0, ships: { encoders: [libaom_av1] } }
  svtav1: { needs: svtav1, min: 0.9.0, ships: { encoders: [libsvtav1] } }
  rav1e: { needs: rav1e, min: 0.5.0, ships: { encoders: [librav1e] } }
  vpx: { needs: libvpx, min: 1.4.0, ships: { encoders: [libvpx_vp8, libvpx_vp9] } }
  webp: { needs: libwebp, min: 0.2.0, ships: { encoders: [libwebp] } }
  openjpeg: { needs: openjpeg, min: 2.1.0, ships: { encoders: [libopenjpeg] } }
  jxl: { needs: libjxl, min: 0.7.0, ships: { decoders: [libjxl] } }
  zimg: { needs: zimg, min: 2.7.0, ships: { filters: [zscale] } }
  vmaf: { needs: libvmaf, min: 2.0.0, ships: { filters: [libvmaf] } }
  lcms2: { needs: lcms2, min: 2.13 }
  theora: { needs: libtheora, ships: { encoders: [libtheora] } }
  xvid: { needs: xvidcore, ffmpeg-license: gpl, ships: { encoders: [libxvid] } }
  vvenc: { needs: vvenc, min: 1.6.1, ships: { encoders: [libvvenc] } }
  # AVS family (China's video standards): AVS1 encoder, AVS2 decoder and encoder (FFmpeg's class gpl), AVS3 decoder
  xavs: { needs: xavs, ffmpeg-license: gpl, ships: { encoders: [libxavs] } }
  davs2: { needs: davs2, ffmpeg-license: gpl, min: 1.6.0, ships: { decoders: [libdavs2] } }
  xavs2: { needs: xavs2, ffmpeg-license: gpl, min: 1.3.0, ships: { encoders: [libxavs2] } }
  uavs3d: { needs: uavs3d, min: 1.1.41, ships: { decoders: [libuavs3d] } }
  # MPEG-5 EVC (main profile; FFmpeg's xeveb/xevdb are the baseline-only builds of the same libraries)
  xeve: { needs: xeve, min: 0.5.1, ships: { encoders: [libxeve] } }
  # configure's libxevd decoder, which ffmpeg -decoders lists as evc (FFmpeg's own EVC parsing has no decoder)
  xevd: { needs: xevd, min: 0.4.1, ships: { decoders: [libxevd] } }
  oapv: { needs: oapv, min: 0.2.0.0, ships: { encoders: [liboapv] } }
  svtjpegxs:
    {
      needs: svt-jpegxs,
      min: 0.10.0,
      since: 8.1.0,
      ships: { encoders: [libsvtjpegxs], decoders: [libsvtjpegxs] },
    }
  # LCEVC enhancement layers (the lcevc filter), through V-Nova's decoder SDK
  lcevc-dec: { needs: lcevcdec, min: 4.0.0, ships: { filters: [lcevc] } }

  # audio
  opus: { needs: opus, ships: { encoders: [libopus] } }
  vorbis: { needs: libvorbis, ships: { encoders: [libvorbis] } }
  mp3lame: { needs: libmp3lame, ships: { encoders: [libmp3lame] } }
  speex: { needs: speex, ships: { decoders: [libspeex] } }
  gsm: { needs: libgsm, ships: { decoders: [libgsm] } }
  opencore-amrnb:
    {
      needs: opencore-amr,
      ffmpeg-license: version3,
      configure: [--enable-libopencore-amrnb],
      ships: { decoders: [libopencore_amrnb] },
    }
  opencore-amrwb:
    {
      needs: opencore-amr,
      ffmpeg-license: version3,
      configure: [--enable-libopencore-amrwb],
      ships: { decoders: [libopencore_amrwb] },
    }
  vo-amrwbenc:
    { needs: vo-amrwbenc, ffmpeg-license: version3, ships: { encoders: [libvo_amrwbenc] } }
  twolame: { needs: twolame, ships: { encoders: [libtwolame] } }
  shine: { needs: shine, ships: { encoders: [libshine] } }
  lc3: { needs: liblc3, min: 1.1.0, ships: { encoders: [liblc3], decoders: [liblc3] } }
  codec2: { needs: codec2, ships: { encoders: [libcodec2], decoders: [libcodec2] } }
  ilbc: { needs: libilbc, ships: { encoders: [libilbc], decoders: [libilbc] } }
  soxr: { needs: soxr, ships: { resamplers: [soxr] } }
  chromaprint: { needs: chromaprint, ships: { muxers: [chromaprint] } }
  # game and tracker module music (demuxers that decode as they read)
  gme: { needs: libgme, ships: { demuxers: [libgme] } }
  modplug: { needs: libmodplug, ships: { demuxers: [libmodplug] } }
  openmpt: { needs: libopenmpt, min: 0.2.6557, ships: { demuxers: [libopenmpt] } }

  # filters and processing
  vidstab:
    {
      needs: vid.stab,
      ffmpeg-license: gpl,
      min: 0.98,
      ships: { filters: [vidstabdetect, vidstabtransform] },
    }
  mysofa: { needs: libmysofa, ships: { filters: [sofalizer] } }
  bs2b: { needs: libbs2b, ships: { filters: [bs2b] } }
  qrencode: { needs: libqrencode, ships: { filters: [qrencode, qrencodesrc] } }
  quirc: { needs: quirc, ships: { filters: [quirc] } }
  # text to speech (an audio source), with Flite's US English voices
  flite: { needs: flite, ships: { filters: [flite] } }
  # DVB Teletext subtitles; zvbi's iconv is the C library's on Android, from API 28
  zvbi: { needs: zvbi, android-api: 28, ships: { decoders: [libzvbi_teletext] } }
  # ARIB STD-B24 captions (Japanese broadcasts): two decoders, one per library
  aribb24:
    { needs: aribb24, ffmpeg-license: version3, min: 1.0.4, ships: { decoders: [libaribb24] } }
  aribcaption: { needs: libaribcaption, min: 1.1.1, ships: { decoders: [libaribcaption] } }
  rubberband:
    { needs: rubberband, ffmpeg-license: gpl, min: 1.8.1, ships: { filters: [rubberband] } }
  # plugin hosts: the build has the host, and FFmpeg loads the plugins at run time (LADSPA_PATH, LV2_PATH,
  # FREI0R_PATH or the usual folders), so they come from the system or the application, never from the build
  ladspa: { needs: ladspa-sdk, ships: { filters: [ladspa] } }
  lv2: { needs: lilv, ships: { filters: [lv2] } }
  frei0r: { needs: frei0r, ffmpeg-license: gpl, ships: { filters: [frei0r, frei0r_src] } }
  # lens correction; the lens database is the user's (the filter's db_path)
  lensfun: { needs: lensfun, ffmpeg-license: version3, ships: { filters: [lensfun] } }
  # colour management; the OCIO config is the user's (the filter's config, or $OCIO)
  opencolorio: { needs: opencolorio, since: 8.1.0, ships: { filters: [ocio] } }
  # vector graphics drawn on video (the drawvg filter); one cairo for this and librsvg, so it brings GLib
  cairo: { needs: cairo, since: 8.1.0, ships: { filters: [drawvg] } }
  # SVG images decoded (rasterized) by librsvg, on cairo and Pango
  rsvg: { needs: librsvg, ships: { decoders: [librsvg] } }
  # OCR (the ocr filter); its trained language data is the user's (the filter's datapath, or TESSDATA_PREFIX)
  tesseract: { needs: tesseract, ships: { filters: [ocr] } }
  # OpenCV's image filters (the ocv filter), through its C API
  opencv: { needs: opencv, ships: { filters: [ocv] } }

  # text, subtitles, XML, compression
  freetype: { needs: freetype, ships: { filters: [{ drawtext: { with: [harfbuzz] } }] } }
  fribidi: { needs: fribidi }
  harfbuzz: { needs: harfbuzz }
  fontconfig: { needs: fontconfig }
  ass: { needs: libass, min: 0.11.0, ships: { filters: [ass, subtitles] } }
  xml2: { needs: libxml2, ships: { demuxers: [dash] } }
  zlib: { needs: zlib }
  bzlib: { needs: bzip2 }
  lzma: { needs: xz }
  # HAP's Snappy compression: FFmpeg's hap encoder needs it (the decoder has its own decompressor)
  snappy: { needs: snappy, ships: { encoders: [hap] } }
  # FFmpeg probes the C library's iconv even under --disable-autodetect, so glibc, musl and Android (API 28+) builds
  # have it whether or not a target lists it (listing it makes configure fail without it): built in there. Windows has
  # no iconv and Apple's is a library of its own: GNU libiconv is built and linked there. Bionic's iconv is API 28's:
  # an Android build for an older level (android-api:) has none, and can't list it.
  iconv:
    {
      builtin: true,
      needs: [{ libiconv: { platforms: [win-*, osx-*, ios-*, maccatalyst-*] } }],
      android-api: 28,
    }

  # network
  srt: { needs: srt, min: 1.3.0, ships: { protocols: [libsrt] } }
  rist: { needs: librist, min: 0.2.7, ships: { protocols: [librist] } }
  # ZeroMQ: the zmq protocol, and the zmq and azmq filters, which take filter commands over a socket
  zmq: { needs: libzmq, min: 4.2.1, ships: { protocols: [libzmq], filters: [zmq, azmq] } }
  # AMQP 0-9-1 (RabbitMQ): the amqp protocol, plain TCP
  rabbitmq: { needs: rabbitmq-c, min: 0.7.1, ships: { protocols: [libamqp] } }
  # SFTP (the sftp protocol), through libssh on mbedTLS
  ssh: { needs: libssh, min: 0.6.0, ships: { protocols: [libssh] } }
  # rtmpdump's librtmp: its rtmp protocols replace FFmpeg's own, under the same names; encrypted (rtmpe, rtmps) where
  # the build has GnuTLS
  rtmp: { needs: librtmp, ships: { protocols: [librtmp, librtmpe, librtmps, librtmpt, librtmpte] } }
  # GMP: the Diffie-Hellman of FFmpeg's own rtmpe and rtmpte (ffrtmpcrypt), without a TLS library that does it
  gmp: { needs: gmp, ffmpeg-license: version3, ships: { protocols: [rtmpe, rtmpte] } }

  # discs: Blu-ray (the bluray protocol), DVD-Video (the dvdvideo demuxer, which takes both dvdnav and dvdread) and
  # audio CDs (the libcdio input device), from a drive, a folder or an image
  bluray: { needs: libbluray, ships: { protocols: [bluray] } }
  dvdnav:
    {
      needs: libdvdnav,
      ffmpeg-license: gpl,
      min: 6.1.0,
      ships: { demuxers: [{ dvdvideo: { with: [dvdread] } }] },
    }
  dvdread:
    {
      needs: libdvdread,
      ffmpeg-license: gpl,
      min: 6.1.1,
      ships: { demuxers: [{ dvdvideo: { with: [dvdnav] } }] },
    }
  # (its libcdio input device isn't in ships:, which names what `ffmpeg -<kind>` lists, and devices are -devices')
  cdio: { needs: libcdio-paranoia, ffmpeg-license: gpl }

  # scripts: AviSynth+ (.avs) and VapourSynth (.vpy) as demuxers; the build has only their headers, and FFmpeg loads
  # the user's AviSynth+ or VapourSynth at run time
  avisynth: { needs: avisynth-headers, ffmpeg-license: gpl, ships: { demuxers: [avisynth] } }
  vapoursynth: { needs: vapoursynth-headers, ships: { demuxers: [vapoursynth] } }

  # audio devices (input and output devices, which `ffmpeg -devices` lists; devices aren't a ships: kind). ALSA's,
  # PulseAudio's and JACK's client libraries ship beside FFmpeg as shared libraries, under their system sonames: the
  # system's plugins (ALSA), or a substitute (PipeWire's libjack, through pw-jack), then find or replace them.
  alsa: { needs: alsa-lib, platforms: [linux-*] }
  pulse: { needs: pulseaudio, platforms: [linux-*] }
  jack: { needs: jack2, platforms: [linux-*] }
  # sndio's library, on ALSA on Linux (its sndiod server, or ALSA's devices directly)
  sndio: { needs: sndio, platforms: [linux-*] }
  # OpenAL Soft (capture: the openal input device), on the system's audio (on Linux it loads ALSA, PulseAudio or
  # PipeWire at run time)
  openal: { needs: openal-soft }
  # X11 and terminal devices (which `ffmpeg -devices` lists; devices aren't a ships: kind), all static: X11's
  # libraries speak the protocol to the X server, so a build needs only a display at run time, not the system's X11
  # libraries. xcb: x11grab, with its shm, shape and xfixes extensions (configure's four libxcb flags); xlib: the xv
  # output device (libX11, libXext, libXv); caca: video drawn in a terminal (libcaca on ncurses).
  xcb: { needs: libxcb, platforms: [linux-*] }
  xlib: { needs: libxv, platforms: [linux-*] }
  caca: { needs: libcaca, platforms: [linux-*] }
  # capture devices (which `ffmpeg -devices` lists; devices aren't a ships: kind), static, on Linux: libv4l2 for the
  # v4l2 input device (built in any case; with it, its use_libv4l2 option), and FireWire's IIDC cameras (libdc1394)
  # and DV/HDV camcorders (libiec61883)
  v4l2: { needs: v4l-utils, platforms: [linux-*] }
  dc1394: { needs: libdc1394, platforms: [linux-*] }
  iec61883: { needs: libiec61883, platforms: [linux-*] }
