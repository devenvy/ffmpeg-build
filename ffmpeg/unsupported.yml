# What FFmpeg's configure offers that the engine doesn't build, and why. Every external library and hardware option
# configure offers (ffmpeg/offered/<major>.yml, written by the nightly support check) is either turned on by an option
# of ffmpeg/<major>.yml or listed here; tests/ffmpeg-coverage.test.ts fails the pull request otherwise, and also when
# an entry here is stale (the option is supported now, or no FFmpeg major the engine knows offers it any more).
#
# Keys are configure's names (--enable-libfdk-aac is libfdk_aac). Each entry has:
#   reason   pending: wanted, not built yet; needs issue: (the open issue tracking it) and may have batch: (its
#              section of that issue, from batches:)
#            sdk-not-redistributable: its SDK's licence keeps it out of CI and out of anything shipped
#            needs-hardware-sdk: a vendor SDK or hardware that CI can't get
#            platform-not-built: only for a platform the engine doesn't build (platforms.yml)
#            deprecated-upstream: deprecated or removed by its makers or by FFmpeg (the note says where)
#            alternative-built: another option does the same job; needs instead: (that option)
#            shared-only: its library needs a shared dependency chain that has not been integrated and verified;
#              shared linking itself is supported (for example, Samba)
#   note    what it is, and anything a contributor should know
#   majors   optional: the FFmpeg majors the entry is for (default: every major that offers it)
#
# `node scripts/ffmpeg-coverage.ts` prints the counts and any problem; `--issue` prints the pending entries as issue
# #21's checklist.
batches:
  d: Filters / processing
  e: Protocols / IO
  f: Devices
  g: Nonfree (nonfree builds only)
  h: Large ML backends (last; where they build reasonably)
options:
  # g. Nonfree (nonfree builds only)

  # not planned
  libnpp:
    {
      reason: deprecated-upstream,
      note: 'NPP filters were deprecated in FFmpeg 8 and removed in FFmpeg 9; cuda-nvcc and cuda-llvm provide the maintained CUDA filters',
    }
  cuda_sdk:
    {
      reason: deprecated-upstream,
      note: "FFmpeg's configure: --enable-cuda-sdk is deprecated, use --enable-cuda-nvcc (the cuda-nvcc option)",
    }
  libmfx:
    {
      reason: deprecated-upstream,
      note: "Intel Media SDK, discontinued by Intel; FFmpeg's configure says to use libvpl, which the vpl option builds",
    }
  omx: { reason: deprecated-upstream, note: 'OpenMAX IL; FFmpeg 9 removed it' }
  omx_rpi:
    { reason: deprecated-upstream, note: 'OpenMAX IL for the Raspberry Pi; FFmpeg 9 removed it' }
  libcelt: { reason: deprecated-upstream, note: 'CELT, part of Opus now; FFmpeg 9 removed it' }
  opengl:
    {
      reason: deprecated-upstream,
      note: 'OpenGL, for the opengl output device, which FFmpeg 7.1 deprecated and 8.0 removed (libavdevice 62); configure still takes the flag, but nothing in FFmpeg 8 or 9 uses it',
    }
  sdl2:
    {
      reason: deprecated-upstream,
      note: 'SDL 2, for the sdl2 output device, which FFmpeg 7.1 deprecated and 8.0 removed (libavdevice 62); only ffplay uses it now, and no platform here builds ffplay (platforms.yml: --disable-ffplay, or no programs)',
    }
  mmal:
    {
      reason: deprecated-upstream,
      note: "the Raspberry Pi 0-3's VideoCore IV API, deprecated by Raspberry Pi (its userland repository is archived); v4l2-m2m replaces it",
    }
  ohcodec:
    {
      reason: platform-not-built,
      note: "OpenHarmony's codecs; the engine builds no OpenHarmony platform",
    }
  libglslang:
    {
      reason: alternative-built,
      instead: shaderc,
      note: "FFmpeg 8's Vulkan shader compiler is glslang or shaderc, and the shaderc option builds shaderc",
    }
  libxeveb:
    {
      reason: alternative-built,
      instead: xeve,
      note: "xeve's baseline-profile-only build; the xeve option's main-profile build encodes baseline too",
    }
  libxevdb:
    {
      reason: alternative-built,
      instead: xevd,
      note: "xevd's baseline-profile-only build; the xevd option's main-profile build decodes baseline too",
    }
  pocketsphinx:
    {
      reason: deprecated-upstream,
      note: "PocketSphinx (the asr filter): FFmpeg's filter is written against the pre-5.0 API (cmd_ln_parse_r, <pocketsphinx/pocketsphinx.h>, on SphinxBase), which PocketSphinx 5.0 (2022) removed; only the unmaintained 5prealpha snapshot (2015) and the archived SphinxBase have it",
    }
