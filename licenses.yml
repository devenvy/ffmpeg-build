# Which profile licenses may link a library under each SPDX licence. Reviewed policy carried over from
# devenvy/ffmpeg scripts/steps/04_select_license.sh -- not legal advice. `all` means every profile license.
# A recipe's expression is read with OR (either licence's builds) and AND (only builds both allow), and a library
# is allowed in a build only when it and everything it needs are.
licenses:
  MIT: all
  MIT-Modern-Variant: all
  BSD-2-Clause: all
  BSD-2-Clause-Patent: all
  BSD-3-Clause: all
  # PCRE2's: BSD-3-Clause, with an exception that waives the notice for binaries that only link it
  BSD-3-Clause WITH PCRE2-exception: all
  BSD-3-Clause-Clear: all
  ISC: all
  0BSD: all
  # a public-domain dedication with a permissive fallback (Rust crates offer it beside MIT)
  Unlicense: all
  bzip2-1.0.6: all
  Zlib: all
  libpng-2.0: all
  Libpng: all
  FTL: all
  HPND-sell-variant: all
  Unicode-DFS-2016: all
  Unicode-3.0: all
  WTFPL: all
  TU-Berlin-2.0: all
  LGPL-2.0-only: all
  LGPL-2.0-or-later: all
  LGPL-2.1-only: all
  LGPL-2.1-or-later: all
  MPL-2.0: all
  # MPL-1.1 is incompatible with the GPL (cairo, its one user, is LGPL-2.1-only OR MPL-1.1: GPL builds take it under
  # the LGPL)
  MPL-1.1: [lgplv2, lgplv3, nonfree]
  LGPL-3.0-or-later: [lgplv3, gplv3, nonfree]
  GPL-2.0-or-later: [gplv2, gplv3, nonfree]
  # version 2 only: not with GPLv3 (or the LGPLv3 a lgplv3 build is under)
  GPL-2.0-only: [gplv2, nonfree]
  GPL-3.0-or-later: [gplv3, nonfree]
  Apache-2.0: [lgplv3, gplv3, nonfree]
  # The LLVM exception lets Apache-2.0 code combine with GPLv2 (the NDK's libc++_shared.so, which Android archives ship).
  Apache-2.0 WITH LLVM-exception: all
  # libmodplug's COPYING: "ModPlug-XMMS and libmodplug are now in the public domain." (SPDX has no identifier for it)
  LicenseRef-libmodplug-public-domain: all
  # Flite's COPYING: CMU's BSD-like terms (keep the notice, mark modifications, don't use the authors' names), and the
  # same or as free for the few files other owners hold (SPDX has no identifier for it)
  LicenseRef-flite: all
  # PFFFT's terms, as OpenAL Soft's LICENSE-pffft has them (NCAR's): BSD-like (keep the notices and disclaimer in
  # source and binary forms, don't use the names to endorse) (SPDX has no identifier for it)
  LicenseRef-pffft: all
  # BSD-3-Clause-Clear plus COPYING's terms that the library never takes the licence of the work it is part of: not
  # GPL builds (whose licence covers the whole work)
  LicenseRef-LCEVCdec: [lgplv2, lgplv3, nonfree]
  FDK-AAC: [nonfree]
  proprietary: [nonfree]
