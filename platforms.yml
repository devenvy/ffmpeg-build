# The platforms ffmpeg-build can build, and what every build for one needs:
#   image      images/<image>/Dockerfile, the toolchain it builds in (or `macos`: natively on a macOS host)
#   setup      the toolchain definition in src/build/toolchain.ts (compilers, flags and cross files)
#   configure  FFmpeg configure flags every build for the platform passes
#   runner     the GitHub Actions runner its builds are made on (default ubuntu-24.04)
#   test-runner  the runner that runs its builds, when the one it builds on can't (default: runner). Most are run
#              on their build runner: natively, in a container (musl, armhf), in the iOS simulator, as a Mac
#              process (Catalyst), or on an Android emulator; Windows builds need Windows.
#   ships      what the toolchain puts into the archives besides FFmpeg and the recipes: a file they carry (Android's
#              libc++_shared.so) or a static archive linked into the libraries, with its SPDX licence and its notice
#              files (paths in the toolchain, ${VAR} a variable of its setup; or license-texts/<file>, the engine's
#              standard text, for a toolchain that ships none), for THIRD-PARTY-NOTICES.txt and the SBOM. An entry
#              with `linked:` is in a build only where FFmpeg's link shows one of them (src/build/linked.ts): a
#              static archive (libstdc++.a) that the configured link (ffbuild/config.mak) or the libraries its
#              linker driver adds itself (its -###) name, as -l:libstdc++.a, a path, or a -lstdc++ that ld finds as
#              that archive (in the -L folders, then the driver's; following a GNU ld script), or a compiler-driver
#              flag. Its version is the linking compiler's where the toolchain releases the runtime with it
#              (COMPILER_RUNTIMES, src/build/toolchain.ts). `compiler:` limits an entry to one compiler (a word of
#              configure's CC_IDENT).
# FFmpeg features a platform offers (vaapi, d3d11va, videotoolbox) are options in ffmpeg/<major>.yml that profiles
# list; they don't belong here.
platforms:
  linux-x64:
    image: linux-x64
    setup: linux
    runner: ubuntu-24.04
    configure:
      [
        --enable-ffmpeg,
        --enable-ffprobe,
        --disable-ffplay,
        --enable-pthreads,
        --enable-pic,
        '--extra-libs=-lpthread -ldl',
      ]
    # GCC's runtimes in gcc-toolset-14, linked statically where FFmpeg's link takes them (linked:): libgcc.a, which the
    # driver links into everything (beside the system's libgcc_s.so.1), and libstdc++_nonshared.a, what of GCC 14's
    # libstdc++ the system's libstdc++.so.6 lacks (gcc-toolset's libstdc++.so is a GNU ld script naming both), where a
    # C++ library brings -lstdc++. gcc-toolset's own licence texts aren't installed (the image keeps no docs): the
    # engine's copies of GCC's COPYING.RUNTIME and COPYING3, byte for byte the image's system gcc package's.
    ships:
      libgcc:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: [license-texts/GCC-exception-3.1.txt, license-texts/GPL-3.0-or-later.txt]
        linked: [libgcc.a, libgcc_eh.a]
      libstdc++_nonshared:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: [license-texts/GCC-exception-3.1.txt, license-texts/GPL-3.0-or-later.txt]
        linked: [libstdc++_nonshared.a]
  # musl gives a thread 128 KiB of stack by default, glibc 8 MiB. FFmpeg needs more than 128 KiB: the MPEG-TS demuxer
  # (pmt_cb's copy of a program is about 133 KB) in the ffmpeg program's demux thread, and the rav1e and XEVE encoders
  # in their threads. musl takes the largest PT_GNU_STACK size of the program and the libraries it starts with (at
  # most 8 MiB) as its threads' default: the programs and libav* ask for glibc's 8 MiB, which an application linking
  # them at start-up gets too (one that dlopens them later, or sets its threads' stack itself, doesn't).
  linux-musl-x64:
    image: linux-musl-x64
    setup: linux-musl
    runner: ubuntu-24.04
    configure:
      [
        --enable-ffmpeg,
        --enable-ffprobe,
        --disable-ffplay,
        --enable-pthreads,
        --enable-pic,
        '--extra-libs=-lpthread -ldl',
        --extra-ldflags=-static-libgcc,
        '--extra-ldflags=-Wl,-z,stack-size=8388608',
      ]
    # The runtimes linked statically into the libraries and programs, each where FFmpeg's link shows it (linked:):
    # GCC's libgcc (-static-libgcc, above: the driver links libgcc.a and libgcc_eh.a) and libstdc++ where a C++ library
    # brings it, and LLVM's libunwind (llvm-libunwind-static, the image's only libunwind) where a Rust library brings
    # it (rav1e, librsvg). src/build/toolchain.ts beforeFfmpeg makes each .pc name the archive (-l:libstdc++.a,
    # -l:libunwind.a), and puts a folder of the static runtime archives first on the link for configure's own
    # -lstdc++. Alpine's packages ship no licence text: the engine's copies of GCC's COPYING.RUNTIME and COPYING3, and
    # of LLVM 22.1.3's libunwind/LICENSE.TXT (the image's llvm-libunwind-static is 22.1.3).
    ships:
      libstdc++:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: [license-texts/GCC-exception-3.1.txt, license-texts/GPL-3.0-or-later.txt]
        linked: [libstdc++.a]
      libgcc:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: [license-texts/GCC-exception-3.1.txt, license-texts/GPL-3.0-or-later.txt]
        linked: [libgcc.a, libgcc_eh.a]
      libunwind:
        license: Apache-2.0 WITH LLVM-exception AND (NCSA OR MIT)
        notice: [license-texts/LLVM-libunwind.txt]
        linked: [libunwind.a]
  # 64-bit ARM: built natively in arm64 images, as upstream does on arm64 runners. An x64 host runs them under qemu
  # 8.1.5 (qemu 9.2 breaks the manylinux image's tar), registered with mirror.gcr.io/tonistiigi/binfmt:qemu-v8.1.5@sha256:
  # 2d2918e86e5327d0661f7083d67a95280b0f7be8f77ed79a8418f81d7d90ce6f: the README says how.
  linux-arm64:
    image: linux-arm64
    setup: linux
    runner: ubuntu-24.04-arm
    configure:
      [
        --enable-ffmpeg,
        --enable-ffprobe,
        --disable-ffplay,
        --enable-pthreads,
        --enable-pic,
        '--extra-libs=-lpthread -ldl',
      ]
    # (GCC's runtimes: as linux-x64)
    ships:
      libgcc:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: [license-texts/GCC-exception-3.1.txt, license-texts/GPL-3.0-or-later.txt]
        linked: [libgcc.a, libgcc_eh.a]
      libstdc++_nonshared:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: [license-texts/GCC-exception-3.1.txt, license-texts/GPL-3.0-or-later.txt]
        linked: [libstdc++_nonshared.a]
  # (8 MiB thread stacks: as linux-musl-x64)
  linux-musl-arm64:
    image: linux-musl-arm64
    setup: linux-musl
    runner: ubuntu-24.04-arm
    configure:
      [
        --enable-ffmpeg,
        --enable-ffprobe,
        --disable-ffplay,
        --enable-pthreads,
        --enable-pic,
        --extra-ldflags=-static-libgcc,
        '--extra-ldflags=-Wl,-z,stack-size=8388608',
      ]
    # (the static runtimes: as linux-musl-x64)
    ships:
      libstdc++:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: [license-texts/GCC-exception-3.1.txt, license-texts/GPL-3.0-or-later.txt]
        linked: [libstdc++.a]
      libgcc:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: [license-texts/GCC-exception-3.1.txt, license-texts/GPL-3.0-or-later.txt]
        linked: [libgcc.a, libgcc_eh.a]
      libunwind:
        license: Apache-2.0 WITH LLVM-exception AND (NCSA OR MIT)
        notice: [license-texts/LLVM-libunwind.txt]
        linked: [libunwind.a]
  osx-arm64:
    image: macos
    setup: apple-macos
    runner: macos-15
    configure:
      [
        --enable-ffmpeg,
        --enable-ffprobe,
        --disable-ffplay,
        --enable-pthreads,
        --enable-pic,
        --extra-cflags=-mmacosx-version-min=11.0,
        --extra-cxxflags=-mmacosx-version-min=11.0,
        --extra-ldflags=-mmacosx-version-min=11.0,
      ]
  # osx-x64 is cross-compiled on Apple silicon: FFmpeg and each build system are told the target.
  osx-x64:
    image: macos
    setup: apple-macos
    runner: macos-15
    configure:
      [
        --enable-ffmpeg,
        --enable-ffprobe,
        --disable-ffplay,
        --enable-pthreads,
        --enable-pic,
        --arch=x86_64,
        --enable-cross-compile,
        '--extra-cflags=-arch x86_64 -mmacosx-version-min=11.0',
        '--extra-cxxflags=-arch x86_64 -mmacosx-version-min=11.0',
        '--extra-ldflags=-arch x86_64 -mmacosx-version-min=11.0',
      ]
  # iOS and Mac Catalyst ship frameworks, not programs. The host-specific flags (--cc, --sysroot, the SDK's
  # -isysroot/-target in --extra-*flags) are added by the Apple toolchain before FFmpeg configure.
  ios-arm64:
    image: macos
    setup: apple-ios
    runner: macos-15
    configure:
      [
        --disable-programs,
        --enable-pthreads,
        --enable-pic,
        --enable-cross-compile,
        --target-os=darwin,
        --arch=aarch64,
        --enable-hwaccel=h264_videotoolbox,
        --enable-hwaccel=hevc_videotoolbox,
      ]
  maccatalyst-arm64:
    image: macos
    setup: apple-ios
    runner: macos-15
    configure:
      [
        --disable-programs,
        --enable-pthreads,
        --enable-pic,
        --enable-cross-compile,
        --target-os=darwin,
        --arch=aarch64,
        --disable-videotoolbox,
      ]
  maccatalyst-x64:
    image: macos
    setup: apple-ios
    runner: macos-15
    configure:
      [
        --disable-programs,
        --enable-pthreads,
        --enable-pic,
        --enable-cross-compile,
        --target-os=darwin,
        --arch=x86_64,
        --disable-videotoolbox,
      ]
  ios-sim-arm64:
    image: macos
    setup: apple-ios
    runner: macos-15
    configure:
      [
        --disable-programs,
        --enable-pthreads,
        --enable-pic,
        --enable-cross-compile,
        --target-os=darwin,
        --arch=aarch64,
        --enable-hwaccel=h264_videotoolbox,
        --enable-hwaccel=hevc_videotoolbox,
      ]
  # Windows: cross-compiled; the C/C++ runtimes are linked statically (no libgcc/libstdc++/libc++ DLLs to ship).
  # -DCHROMAPRINT_NODLL: chromaprint is linked statically, and its header otherwise declares dllimport.
  win-x64:
    image: cross-windows
    setup: windows
    runner: ubuntu-24.04
    test-runner: windows-2025
    # -g in --extra-cflags: DWARF for the debug symbols archive (symbols-<version>-<target>.tar.gz, src/targets.ts
    # shipsSymbols). --disable-debug stays, so FFmpeg's linker flags are unchanged; GCC's -g doesn't change the code it
    # makes; and `make install` strips what ships, as before (staging checks both)
    configure:
      [
        --enable-ffmpeg,
        --enable-ffprobe,
        --disable-ffplay,
        --enable-w32threads,
        --pkg-config=pkg-config,
        --target-os=mingw32,
        --enable-cross-compile,
        --arch=x86_64,
        --cross-prefix=x86_64-w64-mingw32-,
        --cc=x86_64-w64-mingw32-gcc-win32,
        --cxx=x86_64-w64-mingw32-g++-win32,
        '--extra-cflags=-static-libgcc -static-libstdc++ -O2 -pipe -g -DCHROMAPRINT_NODLL',
        '--extra-cxxflags=-static-libgcc -static-libstdc++ -O2 -pipe',
        '--extra-ldflags=-static-libgcc -static-libstdc++',
      ]
    # The runtimes linked statically into the DLLs, each where FFmpeg's link shows it (linked:; src/build/toolchain.ts
    # beforeFfmpeg makes the .pc files name the archives, and puts a folder of them first on the link):
    # - mingw-w64's winpthreads: where a library brings -lpthread (the image's win32-thread gcc adds none itself), or
    #   always in MSYS2, whose posix-thread gcc's specs add -lpthread to every link (-static: libpthread.a). Its notice:
    #   Ubuntu's mingw-w64 copyright file, which has winpthreads' terms (in MSYS2, its winpthreads package's licence)
    # - GCC's libgcc (the driver links libgcc.a and libgcc_eh.a: -static-libgcc) and libstdc++, where a C++ library
    #   brings it. Their notices: the copyright files of Ubuntu's packages that have the archives, with GCC's runtime
    #   library exception, and the GPLv3 they refer to (in MSYS2, its gcc package's COPYING.RUNTIME and COPYING3)
    # - in MSYS2's CLANG64: LLVM's compiler-rt builtins and libunwind, which clang links into everything, and libc++
    #   where a C++ library brings it, with the licences their packages install
    ships:
      libwinpthread:
        license: MIT
        notice: '${WINPTHREADS_NOTICE}'
        linked: [libwinpthread.a, libpthread.a]
      libstdc++:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: ['${LIBSTDCXX_NOTICE}', '${GCC_GPL3}']
        linked: [libstdc++.a]
      libgcc:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: ['${LIBGCC_NOTICE}', '${GCC_GPL3}']
        linked: [libgcc.a, libgcc_eh.a]
      libc++:
        license: Apache-2.0 WITH LLVM-exception AND (NCSA OR MIT)
        notice: '${LIBCXX_NOTICE}'
        linked: [libc++.a]
      libunwind:
        license: Apache-2.0 WITH LLVM-exception AND (NCSA OR MIT)
        notice: '${LIBUNWIND_NOTICE}'
        linked: [libunwind.a]
      compiler-rt-builtins:
        license: Apache-2.0 WITH LLVM-exception AND (NCSA OR MIT)
        notice: '${COMPILER_RT_NOTICE}'
        linked: [libclang_rt.builtins-x86_64.a]
  win-arm64:
    image: cross-windows
    setup: windows
    runner: ubuntu-24.04
    test-runner: windows-11-arm
    configure:
      [
        --enable-ffmpeg,
        --enable-ffprobe,
        --disable-ffplay,
        --enable-w32threads,
        --pkg-config=pkg-config,
        --target-os=mingw32,
        --enable-cross-compile,
        --arch=aarch64,
        --cross-prefix=aarch64-w64-mingw32-,
        --cc=aarch64-w64-mingw32-clang,
        --cxx=aarch64-w64-mingw32-clang++,
        '--extra-cflags=-static-libgcc -O2 -pipe -DCHROMAPRINT_NODLL',
        '--extra-cxxflags=-static-libgcc -static-libstdc++ -O2 -pipe -include system_error',
        '--extra-ldflags=-static-libgcc -static-libstdc++',
      ]
    # The runtimes linked statically into the DLLs, each where FFmpeg's link shows it (linked:): llvm-mingw's
    # winpthreads where a library brings -lpthread, with its notice from llvm-mingw; LLVM's compiler-rt builtins and
    # libunwind, which clang links into everything (-static-libgcc: -l:libunwind.a), and libc++ where a C++ library
    # brings it (src/build/toolchain.ts beforeFfmpeg: -l:libc++.a). Their notice: llvm-mingw's LLVM licence (in MSYS2,
    # the compiler-rt, libc++ and libunwind packages').
    ships:
      libwinpthread:
        license: MIT
        notice: '${WINPTHREADS_NOTICE}'
        linked: [libwinpthread.a, libpthread.a]
      libc++:
        license: Apache-2.0 WITH LLVM-exception AND (NCSA OR MIT)
        notice: '${LIBCXX_NOTICE}'
        linked: [libc++.a]
      libunwind:
        license: Apache-2.0 WITH LLVM-exception AND (NCSA OR MIT)
        notice: '${LIBUNWIND_NOTICE}'
        linked: [libunwind.a]
      compiler-rt-builtins:
        license: Apache-2.0 WITH LLVM-exception AND (NCSA OR MIT)
        notice: '${COMPILER_RT_NOTICE}'
        linked: [libclang_rt.builtins-aarch64.a]
  # 32-bit ARM (Raspberry Pi with a 32-bit OS), cross-compiled with Debian's gcc; glibc 2.36+.
  linux-armhf:
    image: cross-armhf
    setup: linux-armhf
    runner: ubuntu-24.04
    configure:
      [
        --enable-ffmpeg,
        --enable-ffprobe,
        --disable-ffplay,
        --enable-pthreads,
        --enable-pic,
        --arch=arm,
        --cpu=armv7-a+vfpv3,
        --cross-prefix=arm-linux-gnueabihf-,
        --pkg-config=pkg-config,
        --enable-cross-compile,
        --target-os=linux,
      ]
    # GCC's libgcc.a, which the driver links into everything (beside libgcc_s.so.1), where FFmpeg's link takes it
    # (linked:). Its notice: the engine's copies of GCC's COPYING.RUNTIME and COPYING3
    ships:
      libgcc:
        license: GPL-3.0-or-later WITH GCC-exception-3.1
        notice: [license-texts/GCC-exception-3.1.txt, license-texts/GPL-3.0-or-later.txt]
        linked: [libgcc.a, libgcc_eh.a]
  # Android: libraries only (apps load them), 16 KB pages, for API 28+ unless a target says `android-api:` (21-35; no
  # lower than its options and libraries support). The NDK's own paths (--cc for that level, --sysroot, ...) are added
  # by the Android toolchain before FFmpeg configure.
  android-arm64:
    image: cross-android
    setup: android
    runner: ubuntu-24.04
    configure:
      [
        --disable-programs,
        --enable-pthreads,
        --enable-pic,
        --enable-cross-compile,
        --target-os=android,
        --arch=aarch64,
        '--extra-ldflags=-Wl,-z,max-page-size=16384',
      ]
    # the NDK's C++ runtime (Android doesn't provide it) and the NDK's licence text for it (TOOLCHAIN: the Android toolchain)
    ships:
      {
        libc++_shared.so:
          { license: Apache-2.0 WITH LLVM-exception, notice: '${TOOLCHAIN}/NOTICE' },
      }
  android-x64:
    image: cross-android
    setup: android
    runner: ubuntu-24.04
    configure:
      [
        --disable-programs,
        --enable-pthreads,
        --enable-pic,
        --enable-cross-compile,
        --target-os=android,
        --arch=x86_64,
        '--extra-ldflags=-Wl,-z,max-page-size=16384',
      ]
    # the NDK's C++ runtime (Android doesn't provide it) and the NDK's licence text for it (TOOLCHAIN: the Android toolchain)
    ships:
      {
        libc++_shared.so:
          { license: Apache-2.0 WITH LLVM-exception, notice: '${TOOLCHAIN}/NOTICE' },
      }
