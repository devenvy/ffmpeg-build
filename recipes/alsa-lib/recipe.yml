name: alsa-lib
provides: alsa
license: LGPL-2.1-or-later
license-files: [COPYING]
configure: [--enable-alsa]
source: { url: 'https://www.alsa-project.org/files/pub/lib/alsa-lib-{version}.tar.bz2' }
versions:
  {
    listing: 'https://www.alsa-project.org/files/pub/lib/',
    files: '^alsa-lib-(\d+\.\d+\.\d+(?:\.\d+)?)\.tar\.bz2$',
  }
platforms: [linux-*]
# Static mode uses builtin plugins and direct devices. External desktop plugins require shared mode so they
# share one libasound instance with FFmpeg, rather than loading a second system ALSA into the process.
linkage:
  default: static
  modes:
    static: { runtime: [] }
    shared:
      vars: { shared-arg: --enable-shared, static-arg: --disable-static, libdl-arg: [] }
      runtime: ['lib/libasound.so*']
build:
  # alsa-lib: the ALSA library (LGPL-2.1-or-later), for FFmpeg's alsa input and output devices. It reads the
  # system's configuration (/usr/share/alsa: alsa.conf, the cards, UCM and the plugins' conf.d), and loads the
  # system's plugins: never the build's. Only the library, its headers and alsa.pc are installed. No Python mixer
  # modules, no topology library.
  #
  # Upstream supports one plugin directory, with the native ALSA_PLUGIN_DIR runtime override. Use Debian's
  # multiarch layout on glibc and Alpine's /usr/lib layout on musl. Other distributions can set that override.
  system: autotools
  vars:
    plugindir: '/usr/lib/alsa-lib'
    shared-arg: --disable-shared
    static-arg: --enable-static
    libdl-arg: --without-libdl
  # The toolchain's -fPIC permits static ALSA inside a shared consumer. Do not define the PIC preprocessor macro:
  # ALSA uses that macro to select dynamic instead of builtin plugin registration.
  platforms:
    'linux-x64': { vars: { plugindir: '/usr/lib/x86_64-linux-gnu/alsa-lib' } }
    # shipped on musl: it asks for glibc's 8 MiB thread stacks, as FFmpeg's own libraries do (platforms.yml)
    'linux-musl-*': { env: { LDFLAGS: '+= -Wl,-z,stack-size=8388608' } }
    'linux-arm64': { vars: { plugindir: '/usr/lib/aarch64-linux-gnu/alsa-lib' } }
    'linux-armhf': { vars: { plugindir: '/usr/lib/arm-linux-gnueabihf/alsa-lib' } }
  args:
    [
      '{shared-arg}',
      '{static-arg}',
      '{libdl-arg}',
      --disable-python,
      --disable-topology,
      --disable-aload,
      --with-configdir=/usr/share/alsa,
      '--with-plugindir={plugindir}',
    ]
    # ALSA_PLUGIN_DIR as a list: the first folder that has the plugin (or the last, for dlopen's error)
  make-targets: [-C, src]
  install-targets: [-C, src, install-libLTLIBRARIES]
  after:
    - [make, -C, include, install]
    - [make, -C, utils, install-pkgconfigDATA]
    - remove: { path: '{deps}/lib/pkgconfig/alsa-topology.pc' }
