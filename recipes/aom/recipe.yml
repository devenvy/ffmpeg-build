name: aom
provides: aom
license: BSD-2-Clause
license-files:
  [
    LICENSE,
    PATENTS,
    third_party/fastfeat/LICENSE,
    third_party/vector/LICENSE,
    third_party/x86inc/LICENSE,
  ]
configure: [--enable-libaom]
# AOMedia publishes aom on googlesource only, which answers 503 for minutes at a time; the mirror is the media-autobuild
# suite's copy on GitHub. A build takes from it only the commit ffmpeg.lock pins (checked after the clone).
source:
  {
    git: https://aomedia.googlesource.com/aom,
    ref: 'v{version}',
    mirror: https://github.com/m-ab-s/aom.git,
  }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-library-arg: '-DBUILD_SHARED_LIBS=ON' }
      runtime: ['lib/libaom.so*']
build:
  system: cmake
  vars: { shared-library-arg: [] }
  args:
    [
      '{shared-library-arg}',
      -DENABLE_APPS=OFF,
      -DENABLE_EXAMPLES=OFF,
      -DENABLE_TOOLS=OFF,
      -DENABLE_TESTS=OFF,
      -DENABLE_DOCS=OFF,
    ]
  platforms:
    linux-armhf: { args: [-DAOM_TARGET_CPU=arm] }
