# aribb24's original repository (github.com/nkoriyama/aribb24) last tagged v1.0.3, still GPL; its LGPL-3.0 relicensing
# was released as v1.0.4 by VideoLAN's maintained fork, which FFmpeg's configure asks for (above 1.0.3, or a GPL build).
name: aribb24
provides: aribb24
license: LGPL-3.0-or-later
license-files: [COPYING]
configure: [--enable-libaribb24]
needs: [libpng]
source: { git: https://code.videolan.org/jeeb/aribb24.git, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-arg: --enable-shared, static-arg: --disable-static, shared-mode: 'yes' }
      runtime: ['lib/libaribb24.so*']
build:
  # aribb24: ARIB STD-B24 caption decoding (Japanese broadcast captions; LGPL-3.0-or-later), static, for FFmpeg's
  # libaribb24 decoder (found through aribb24.pc); FFmpeg's class version3, so v3 builds only. Keep upstream's PNG
  # support for DRCS glyph export and its pkg-config dependency closure.
  system: autotools
  # the platform's CFLAGS take the place of configure's default -g -O2: optimized as upstream builds it
  env: { CFLAGS: '+= -O2', LIBS: '+= -lm' }
  vars: { shared-arg: --disable-shared, static-arg: --enable-static, shared-mode: '' }
  args: ['{shared-arg}', '{static-arg}', --with-pic]
  before:
    - [autoreconf, -fi]
  after:
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'aribb24', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
