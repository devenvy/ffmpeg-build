name: brotli
license: MIT
license-files: [LICENSE]
source: { git: https://github.com/google/brotli, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-args:
          - -DBUILD_SHARED_LIBS=ON
          - -DCMAKE_C_VISIBILITY_PRESET=hidden
          - '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,defs'
      runtime: ['lib/libbrotlicommon.so*', 'lib/libbrotlidec.so*', 'lib/libbrotlienc.so*']
build:
  system: cmake
  vars: { shared-args: [] }
  args:
    [
      '{shared-args}',
      -DBROTLI_DISABLE_TESTS=ON,
      -DBROTLI_BUNDLED_MODE=OFF,
      -DBROTLI_BUILD_TOOLS=OFF,
    ]
