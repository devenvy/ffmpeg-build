name: cairo
provides: cairo
# cairo's choice of licences: LGPL-2.1-only or MPL-1.1
license: LGPL-2.1-only OR MPL-1.1
license-files: [COPYING, COPYING-LGPL-2.1, COPYING-MPL-1.1]
configure: [--enable-cairo]
needs:
  - pixman
  - zlib
  - libpng
  - glib
  - { freetype: { platforms: [linux-*, android-*, ios-*, maccatalyst-*] } }
  - { fontconfig: { platforms: [linux-*, android-*] } }
source:
  {
    git: https://gitlab.freedesktop.org/cairo/cairo.git,
    ref: '{version}',
    mirror: https://github.com/freedesktop/cairo.git,
  }
# even minor versions are releases
versions: { git-tags: '^(1\.\d*[02468]\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      requires-link: { glib: [shared], fontconfig: [shared] }
      vars:
        shared-mode: 'yes'
        shared-args:
          [
            --default-library=shared,
            '-Dc_link_args=-Wl,-z,defs,--exclude-libs,libfreetype.a:libpixman-1.a:libpng16.a:libpng.a:libz.a',
          ]
      runtime:
        ['lib/libcairo.so*', 'lib/libcairo-gobject.so*', 'lib/libcairo-script-interpreter.so*']
build:
  # cairo: 2D vector graphics (LGPL-2.1-only OR MPL-1.1), static, for FFmpeg's drawvg filter (found through cairo.pc)
  # and under Pango and librsvg (FFmpeg's SVG decoder). A deps folder holds one cairo, so it is built as librsvg
  # needs it: the image, PNG, PDF, PostScript and SVG surfaces (zlib, libpng), cairo-gobject (on GLib: the cairo
  # option brings GLib too), and the platform's fonts: FreeType and Fontconfig on Linux and Android (Pango's font map
  # there needs cairo's Fontconfig support), FreeType on iOS and Mac Catalyst, DirectWrite on Windows, Quartz (Core
  # Text) on macOS. No X11/XCB, tests or BFD symbol lookup.
  system: meson
  vars: { shared-mode: '', shared-args: [] }
  before:
    # Optional preload development tools embed build paths and are not the rendering SDK.
    # Upstream has no dedicated option; retain the core, GObject and interpreter targets.
    - replace-in-file:
        path: util/meson.build
        from: "if conf.get('CAIRO_HAS_TRACE', 0) == 1\n"
        to: "if false # ffmpeg-build: omit optional preload instrumentation\n"
      when: { set: '{shared-mode}' }
  args:
    [
      '{shared-args}',
      -Dtests=disabled,
      -Dxlib=disabled,
      -Dxcb=disabled,
      -Dxlib-xcb=disabled,
      -Dzlib=enabled,
      -Dpng=enabled,
      -Dglib=enabled,
      -Dlzo=disabled,
      -Dspectre=disabled,
      -Dsymbol-lookup=disabled,
      -Dgtk2-utils=disabled,
      --wrap-mode=nofallback,
    ]
  platforms:
    'linux-*':
      { args: [-Dfreetype=enabled, -Dfontconfig=enabled, -Dquartz=disabled, -Ddwrite=disabled] }
    'android-*':
      { args: [-Dfreetype=enabled, -Dfontconfig=enabled, -Dquartz=disabled, -Ddwrite=disabled] }
    # on Windows cairo.h declares the API dllimport unless CAIRO_WIN32_STATIC_BUILD is defined, which its .pc doesn't
    # pass on; and its DirectWrite font backend is C++ on COM, whose runtime and ole32 a static link needs
    'win-*':
      args: [-Dfreetype=disabled, -Dfontconfig=disabled, -Dquartz=disabled, -Ddwrite=enabled]
      after:
        - edit-pkg-config:
            {
              path: '{deps}/lib/pkgconfig/cairo.pc',
              cflags: { append: -DCAIRO_WIN32_STATIC_BUILD },
              libs-private: { add: '-lole32 {cxx}' },
            }
    # the C++ runtime by its plain -l name (FFmpeg's link makes it static on Windows), which Rust's pkg-config
    # parsing also takes: librsvg's cairo-sys rejects -l:libc++.a
    win-x64: { vars: { cxx: -lstdc++ } }
    win-arm64: { vars: { cxx: -lc++ } }
    'osx-*':
      { args: [-Dfreetype=disabled, -Dfontconfig=disabled, -Dquartz=enabled, -Ddwrite=disabled] }
    # cairo's Quartz backend is macOS's: it takes ApplicationServices and Carbon, which iOS and Mac Catalyst haven't
    # got. FreeType there, as on Android.
    'ios-*':
      &freetype {
        args: [-Dfreetype=enabled, -Dfontconfig=disabled, -Dquartz=disabled, -Ddwrite=disabled],
      }
    'maccatalyst-*': *freetype
  after:
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'cairo', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
