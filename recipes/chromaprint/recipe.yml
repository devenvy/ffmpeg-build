name: chromaprint
provides: chromaprint
license: LGPL-2.1-or-later
license-files: [LICENSE.md]
configure: [--enable-chromaprint]
needs: [kissfft]
source: { git: https://github.com/acoustid/chromaprint, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        library-args:
          - -DBUILD_SHARED_LIBS=ON
          - '-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -shared-libgcc -Wl,--exclude-libs,libstdc++.a:libgcc.a -Wl,-z,defs -Wl,--version-script={src}/ffb-chromaprint.exports'
      runtime: ['lib/libchromaprint.so*']
build:
  system: cmake
  vars: { library-args: [], shared-mode: '' }
  before:
    # The public interface is C. Template instantiations from implementation
    # objects must stay private as well as symbols from compiler archives.
    - write-file:
        path: ffb-chromaprint.exports
        text: |
          {
            global: chromaprint_*;
            local: *;
          };
      when: { set: '{shared-mode}' }
  args:
    [
      '{library-args}',
      -DBUILD_TOOLS=OFF,
      -DBUILD_TESTS=OFF,
      -DFFT_LIB=kissfft,
      '-DKISSFFT_SOURCE_DIR={deps}/src/kissfft',
    ]
  after:
    # chromaprint is C++ and libchromaprint.pc declares no C++ runtime, so FFmpeg's static --enable-chromaprint link
    # needs it added. Upstream appended it to FFmpeg's EXTRA_LIBS (libstdc++ on GNU/mingw, libc++ on Apple/NDK,
    # -l:libstdc++.a on musl, -l:libc++.a on win-arm64); a recipe can't touch FFmpeg's link line, so it goes into the .pc,
    # which FFmpeg's configure tries first (check_pkg_config libchromaprint, then a plain -lchromaprint).
    # -lm as well (not upstream's): chromaprint's bundled FFmpeg resampler (resample2.c) calls sin() and the .pc declares
    # nothing. FFmpeg's own link carries -lm anyway, but a plain `pkg-config --static` link fails without it.
    #
    # On Windows/mingw, chromaprint.h decorates its API with __declspec(dllimport) unless
    # CHROMAPRINT_NODLL is defined -- but we build a STATIC libchromaprint.a, whose symbols are
    # undecorated. Without this define, FFmpeg's configure probe (and the chromaprint-muxer
    # compile) look for __imp_chromaprint_* and fail with "chromaprint not found". The macro is
    # guarded by _WIN32/_WIN64 in the header, so this define is an inert no-op on other platforms.
    # Upstream put it in FFmpeg's EXTRA_CFLAGS; here it goes into the .pc's Cflags, which FFmpeg adds for the probe and
    # the muxer.
    - edit-pkg-config:
        path: '{deps}/lib/pkgconfig/libchromaprint.pc'
        libs-private: { append: '{cxx-runtime} -lm' }
        cflags: { add: -DCHROMAPRINT_NODLL, missing: skip }
    # Compare exports with the pinned header rather than a fixed symbol list.
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.environ['RECIPES'] + '/chromaprint/check-exports.py', run_name='__main__')"
        - '{src}/src/chromaprint.h'
        - '{deps}/lib'
      when: { set: '{shared-mode}' }
