name: codec2
provides: codec2
# the sources say "version 2.1", with no "or any later version"
license: LGPL-2.1-only
license-files: [COPYING]
# FFmpeg finds it with a plain -lcodec2 probe, which a static library calling the maths library fails
# without libm on the link
configure: [--enable-libcodec2, --extra-libs=-lm]
source: { git: https://github.com/drowe67/codec2, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { library-arg: -DBUILD_SHARED_LIBS=ON }
      runtime: ['lib/libcodec2.so*']
build:
  # Codec 2: low-bitrate speech codec (LGPL-2.1), static, for FFmpeg's libcodec2 decoder and encoder (found with
  # `-lcodec2`, header codec2/codec2.h). Only the codec2 target: the ~40 demo and test programs aren't built.
  #
  # Its native ExternalProject builds the host codebook generator during cmake --build. Keep target configuration
  # intact, then clear target environment overrides while the cached target build and native child run.
  system: none
  vars: { library-arg: -DBUILD_SHARED_LIBS=OFF }
  steps:
    - - cmake
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -B
      - _build
      - -S
      - .
      - -DCMAKE_BUILD_TYPE=Release
      - '-DCMAKE_INSTALL_PREFIX={deps}'
      - -DCMAKE_INSTALL_LIBDIR=lib
      - '{library-arg}'
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DUNITTEST=OFF
      - -DLPCNET=OFF
      - '{cmake-cross-args}'
    - run: [cmake, --build, _build, --target, codec2, '-j{jobs}']
      unset:
        [
          AR,
          CC,
          CFLAGS,
          CMAKE_FIND_ROOT_PATH,
          CMAKE_PREFIX_PATH,
          CMAKE_TOOLCHAIN_FILE,
          CPPFLAGS,
          CXX,
          CXXFLAGS,
          LDFLAGS,
          PKG_CONFIG_LIBDIR,
          PKG_CONFIG_PATH,
          RANLIB,
          SDKROOT,
        ]
    - run: [cmake, --install, _build]
      when: { platforms: [linux-*, osx-*, ios-*, maccatalyst-*, android-*] }
    # Native components omit the inapplicable Windows DLL dependency script.
    - run: [cmake, --install, _build, --component, lib]
      when: { platforms: [win-*] }
    - run: [cmake, --install, _build, --component, dev]
      when: { platforms: [win-*] }
    - run: [cmake, --install, _build, --component, codec2_devel]
      when: { platforms: [win-*] }
    # Preserve the native install-tree CMake SDK metadata; never copy the build-tree export.
    - copy:
        {
          from: '_build/src/CMakeFiles/Export/*/codec2-config.cmake',
          into: '{deps}/lib/cmake/codec2',
        }
      when: { platforms: [win-*] }
    - copy:
        {
          from: '_build/src/CMakeFiles/Export/*/codec2-config-release.cmake',
          into: '{deps}/lib/cmake/codec2',
        }
      when: { platforms: [win-*] }
