name: cpu-features
license: Apache-2.0
license-files: [LICENSE]
source: { git: https://github.com/google/cpu_features, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
# Tesseract's Android build detects NEON through its NDK compatibility layer
platforms: [android-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [android-x64]
      vars:
        shared-args:
          [-DBUILD_SHARED_LIBS=ON, '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384']
      runtime: ['lib/libcpu_features.so', 'lib/libndk_compat.so']
build:
  # cpu_features: CPU feature detection (Apache-2.0), static, with its ndk_compat library (the NDK's old cpufeatures
  # API), which Tesseract uses on Android. No list_cpu_features program or tests.
  system: cmake
  vars: { shared-args: [] }
  args: ['{shared-args}', -DBUILD_TESTING=OFF, -DBUILD_EXECUTABLE=OFF, -DENABLE_INSTALL=ON]
