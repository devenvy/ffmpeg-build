name: dav1d
provides: dav1d
license: BSD-2-Clause
license-files: [COPYING]
configure: [--enable-libdav1d]
source:
  {
    git: https://code.videolan.org/videolan/dav1d.git,
    ref: '{version}',
    mirror: https://github.com/videolan/dav1d.git,
  }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { library-mode-arg: '--default-library=shared' }
      runtime: ['lib/libdav1d.so*']
build:
  system: meson
  vars: { library-mode-arg: [] }
  args: ['{library-mode-arg}', -Denable_tools=false, -Denable_tests=false]
