name: davs2
provides: davs2
license: GPL-2.0-or-later
license-files: [COPYING]
configure: [--enable-libdavs2]
# The genuine tag archive uses upstream's no-.git revision fallback without editing version.sh.
source: { url: 'https://github.com/pkuvcl/davs2/archive/refs/tags/{version}.tar.gz' }
versions: { git-tags: '^(\d+\.\d+)$', repo: https://github.com/pkuvcl/davs2 }
platforms:
  [linux-x64, linux-musl-x64, win-x64, linux-arm64, linux-musl-arm64, android-arm64, android-x64]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        library-args:
          - --enable-shared
          - --disable-static
          - '--extra-ldflags=-static-libstdc++ -shared-libgcc -Wl,--exclude-libs,libstdc++.a:libgcc.a -Wl,-z,defs'
        library-target: lib-shared
        install-target: install-lib-shared
      runtime: ['lib/libdavs2.so*']
build:
  # davs2: AVS2 (IEEE 1857.4) video decoder from Peking University (GPL-2.0-or-later), static, for FFmpeg's libdavs2
  # decoder; GPL builds only. Found through davs2.pc (1.6.0 or later). x264's configure, in build/linux; the library
  # alone (no CLI). Its sources are C++ (.cc), but davs2.pc names no C++ runtime: it gains one.
  #
  # Use the native source-archive version fallback and preserve the compiler's actual endianness probe.
  system: none
  vars:
    cross: []
    library-args: []
    library-target: lib-static
    install-target: install-lib-static
  # its configure compiles with $CC, the C++ compiler by default (g++), and passes it -std=gnu++11: where the
  # platform sets CC to a C compiler, the platform's C++ compiler instead (clang refuses C++ flags for C)
  env: { CC: '{CXX|g++}' }
  platforms:
    win-x64:
      vars: { cross: ['--cross-prefix={CROSS_PREFIX}-', --host=x86_64-w64-mingw32] }
      args: [--extra-cflags=-mincoming-stack-boundary=4]
    # Accept the platform's 16-byte incoming stacks while native configure may
    # prefer 32-byte outgoing alignment for AVX locals and internal calls.
    linux-x64: { args: [--extra-cflags=-mincoming-stack-boundary=4] }
    # its ARM assembly is listed in the Makefile but isn't in the repository: plain C++ on ARM
    linux-arm64: { args: [--disable-asm] }
    linux-musl-arm64: { args: [--disable-asm] }
    # its x86-64 assembly crashes on musl as xavs2's does (alignment it assumes musl's threads don't give): plain C++
    linux-musl-x64: { args: [--disable-asm, --extra-cflags=-mincoming-stack-boundary=4] }
    android-arm64:
      {
        vars: { cross: [--host=aarch64-linux-android, '--sysroot={TOOLCHAIN}/sysroot'] },
        args: [--disable-asm],
      }
    # the NDK's x86-64 assembly would need text relocations
    android-x64:
      {
        vars: { cross: [--host=x86_64-linux-android, '--sysroot={TOOLCHAIN}/sysroot'] },
        args: [--disable-asm],
      }
  steps:
    - run:
        [
          ./configure,
          '--prefix={deps}',
          --disable-cli,
          --enable-pic,
          '{library-args}',
          '{cross}',
          '{args}',
        ]
      cwd: build/linux
    - run: [make, '-j{jobs}', '{library-target}']
      cwd: build/linux
    - run: [make, '{install-target}']
      cwd: build/linux
    - edit-pkg-config:
        {
          path: '{deps}/lib/pkgconfig/davs2.pc',
          libs-private: { add: '{cxx-runtime}', missing: after-libs },
        }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'davs2', 'check-stack-abi.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-stack-abi'
      when: { platforms: [linux-x64], exists: '{deps}/lib/libdavs2.a' }
