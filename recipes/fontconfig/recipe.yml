name: fontconfig
provides: fontconfig
license: HPND-sell-variant AND MIT-Modern-Variant AND MIT AND Unicode-DFS-2016
license-files: [COPYING]
configure: [--enable-libfontconfig]
needs: [freetype, libexpat]
# gitlab.freedesktop.org returned 502/503/504 on every clone for hours on 2026-09-30/10-01. fontconfig's GitHub repo
# is a read-only mirror carrying every freedesktop tag at identical commits (upstream devenvy #45).
source:
  {
    git: https://gitlab.freedesktop.org/fontconfig/fontconfig.git,
    ref: '{version}',
    mirror: https://github.com/fontconfig/fontconfig.git,
  }
# x.y.9x tags are development snapshots for the next minor.
versions: { git-tags: '^(\d+\.\d+\.(?:\d|[0-8]\d))$' }
# Not on Windows (needs a runtime fonts.conf for no real gain: libass uses DirectWrite, drawtext uses fontfile=), iOS
# or Mac Catalyst. On Android only for Pango (librsvg's text), which requires it there; Android has no fonts.conf of
# its own, so an application names its fonts with FONTCONFIG_FILE.
platforms: [linux-*, osx-*, android-*]
build:
  # fontconfig: system font discovery so drawtext can pick fonts by name (HPND-sell-variant), static. Ported from
  # devenvy/ffmpeg scripts/deps/fontconfig.sh.
  #
  # M6: fontconfig compiles its sysconfdir/cachedir/templatedir INTO the library, so building
  # with --prefix={deps} baked the build machine's path into every shipped artifact:
  #   /home/runner/work/ffmpeg/ffmpeg/.build/<rid>/deps/etc/fonts
  # a directory that exists on no consumer machine. The first attempt at this simply pinned the
  # prefix to /etc and /var and was REVERTED in 72f3c53, because the same options also decide
  # where `meson install` WRITES -- so the install tried to create /var/cache and failed with
  # permission denied on two platforms.
  #
  # DESTDIR staging separates the two concerns, which is what BtbN does. Configure with the
  # RUNTIME prefix (/usr) so the compiled-in lookup paths are the ones a real system has, then install
  # under DESTDIR so nothing is written outside the build tree, then relocate the staged tree
  # into the deps folder for build-time linking and rewrite the .pc prefix so pkg-config still resolves
  # against it rather than the runtime prefix.
  #
  # NLS off: fontconfig does dependency('intl') and, when it resolves, links libintl into
  # everything downstream. On the Intel macOS runner that resolves to HOMEBREW's
  # /usr/local/opt/gettext/lib/libintl.8.dylib -- a library present on that runner and on no
  # consumer machine, which we do not bundle. arm64 was unaffected only because its Homebrew
  # prefix differs, so the leak was silently Intel-only. Translated fontconfig messages are
  # meaningless for a library statically embedded in FFmpeg.
  #
  # fontconfig also installs /etc/fonts/fonts.conf and conf.d, outside the prefix. Those are
  # deliberately NOT relocated: staging takes libraries, binaries, headers and pkg-config
  # files, so anything copied into the deps folder's etc/ never reaches the artifact and would
  # be dead weight. The library's compiled-in sysconfdir is /etc, so at runtime it reads the
  # HOST's font configuration, which is the correct behaviour on a real system and the reason
  # for configuring with the runtime prefix in the first place. With no host configuration
  # present, fontconfig falls back to its built-in defaults rather than failing.
  system: none
  steps:
    - remove: { path: '{src}/_stage', recursive: true }
    - - meson
      - setup
      - _build
      - --prefix=/usr
      - --libdir=/usr/lib
      - --sysconfdir=/etc
      - --localstatedir=/var
      - --default-library=static
      - --buildtype=release
      - -Ddoc=disabled
      - -Dtests=disabled
      - -Dtools=disabled
      - -Dcache-build=disabled
      - -Dnls=disabled
      - '{meson-cross-args}'
    - [meson, compile, -C, _build, -j, '{jobs}']
    - run: [meson, install, -C, _build]
      env: { DESTDIR: '{src}/_stage' }
    - check:
        {
          exists: '{src}/_stage/usr',
          message: 'fontconfig DESTDIR install produced no /usr tree under {src}/_stage',
        }
    - copy: { from: '{src}/_stage/usr', to: '{deps}', recursive: true, preserve: true }
    - replace-in-file:
        {
          path: '{deps}/lib/pkgconfig/fontconfig.pc',
          from: '^prefix=.*',
          to: 'prefix={deps}',
          regex: true,
        }
    - replace-in-file:
        {
          path: '{deps}/lib/pkgconfig/fontconfig.pc',
          from: '^libdir=.*',
          to: 'libdir={deps}/lib',
          regex: true,
        }
    - replace-in-file:
        {
          path: '{deps}/lib/pkgconfig/fontconfig.pc',
          from: '^includedir=.*',
          to: 'includedir={deps}/include',
          regex: true,
        }
    - check:
        {
          file: '{deps}/lib/pkgconfig/fontconfig.pc',
          line: 'prefix={deps}',
          message: failed to repoint fontconfig.pc at the deps folder,
        }
# sweep: every edit on every platform (not to merge)
