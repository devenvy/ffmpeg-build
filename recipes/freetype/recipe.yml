name: freetype
provides: freetype
license: FTL OR GPL-2.0-or-later
license-files: [LICENSE.TXT, docs/FTL.TXT]
configure: [--enable-libfreetype]
needs: [zlib, libpng]
# gitlab.freedesktop.org returned 502/503/504 on every clone for hours on 2026-09-30/10-01. FreeType's GitHub repo
# is its official mirror and carries every freedesktop tag at identical commits (upstream devenvy #45).
source:
  {
    git: https://gitlab.freedesktop.org/freetype/freetype.git,
    ref: 'VER-{version-}',
    mirror: https://github.com/freetype/freetype.git,
  }
versions: { git-tags: '^VER-(\d+-\d+-\d+)$' }
platforms: all
build:
  system: cmake
  # FreeType 2.15 builds an HVF (Apple Hierarchical Variable Font) driver whenever it finds the hvf headers and
  # library, which recent Apple SDKs have; a static libfreetype then needs symbols nothing links. Off, as before 2.15.
  args:
    [-DFT_DISABLE_HARFBUZZ=ON, -DFT_DISABLE_BZIP2=ON, -DFT_DISABLE_BROTLI=ON, -DFT_DISABLE_HVF=ON]
