name: fribidi
provides: fribidi
license: LGPL-2.1-or-later
license-files: [COPYING]
configure: [--enable-libfribidi]
source: { git: https://github.com/fribidi/fribidi, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-library-arg: '--default-library=shared'
      runtime: ['lib/libfribidi*.so*']
build:
  vars: { shared-library-arg: [] }
  system: meson
  args: ['{shared-library-arg}', -Dtests=false, -Ddocs=false, -Dbin=false]
