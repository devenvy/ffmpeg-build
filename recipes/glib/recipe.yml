name: glib
license: LGPL-2.1-or-later
license-files: [COPYING]
needs:
  - zlib
  - pcre2
  - libffi
  - { proxy-libintl: { platforms: [linux-musl-*, win-*, osx-*, ios-*, maccatalyst-*, android-*] } }
  - { libiconv: { platforms: [osx-*, ios-*, maccatalyst-*] } }
source:
  {
    git: https://gitlab.gnome.org/GNOME/glib.git,
    ref: '{version}',
    mirror: https://github.com/GNOME/glib.git,
  }
# 2.86, the last stable series before GIO's Windows package parser took WinRT headers (windows.storage.h,
# windows.applicationmodel.core.h) that win-x64's mingw-w64 (Ubuntu's 11.0.1) hasn't got. Move on when it has them.
versions: { git-tags: '^(2\.86\.\d+)$' }
platforms: all
# Android: its iconv is the C library's, which bionic has from API 28 (Android 9): an android-api: below that can't
# build it (meson finds no iconv)
android-api: 28
build:
  # GLib, GObject and GIO (LGPL-2.1-or-later), static, for what builds on them here (lensfun, cairo-gobject). The
  # libraries alone: no tools' man pages, docs, tests, introspection, translations or system integrations (SELinux,
  # libmount, xattr, sysprof, dtrace). Every dependency it would otherwise fetch as a subproject is a recipe in deps
  # (--wrap-mode=nofallback keeps it that way): PCRE2, libffi, zlib, and gettext's API from proxy-libintl where the
  # C library has none. iconv is the C library's on Linux and Android (API 28), GNU libiconv on Apple (which the
  # engine builds there for FFmpeg's iconv too), and GLib's own on Windows.
  system: meson
  args:
    [
      --wrap-mode=nofallback,
      -Dtests=false,
      -Dinstalled_tests=false,
      -Ddocumentation=false,
      -Dman-pages=disabled,
      -Dintrospection=disabled,
      -Dnls=disabled,
      -Dselinux=disabled,
      -Dlibmount=disabled,
      -Dxattr=false,
      -Dsysprof=disabled,
      -Ddtrace=disabled,
      -Dsystemtap=disabled,
      -Dlibelf=disabled,
      -Dglib_debug=disabled,
      -Dcharsetalias_dir=/usr/lib,
    ]
  # It compiles in where translations and charset.alias are, its install prefix's folders: here deps, a build folder
  # (the staged-binary check refuses it; seen on Apple). The system's instead, where a system's GLib has them
  # (translations aren't built: nls is off). Windows finds them relative to the library and ignores both.
  before:
    - replace-in-file:
        {
          path: meson.build,
          from: "glib_localedir = join_paths(glib_prefix, get_option('localedir'))",
          to: "glib_localedir = '/usr/share/locale'",
        }
  platforms:
    # a native build has no cross file to name deps' folders, and libintl has no .pc: meson's search for it (the
    # header, then -lintl) is told where they are
    'linux-musl-*': &native
      env: { CPPFLAGS: '-I{deps}/include {CPPFLAGS|}', LDFLAGS: '-L{deps}/lib {LDFLAGS|}' }
    osx-arm64: *native
    # On Apple GIO has Objective-C sources, and a cross build's machine file names no Objective-C compiler: a second
    # cross file names the platform's clang for it, with the C flags the engine's gives C (and for linking, which on
    # macOS goes through it: GLib itself has Objective-C there).
    osx-x64:
      args: ['--cross-file={src}/objc-cross.ini']
      before:
        - write-file:
            path: objc-cross.ini
            text: "[binaries]\nobjc = '{CC}'\n[built-in options]\nobjc_args = ['-arch', 'x86_64', '-isysroot', '{SDKROOT}', '-mmacosx-version-min=11.0', '-I{deps}/include']\nobjc_link_args = ['-arch', 'x86_64', '-isysroot', '{SDKROOT}', '-mmacosx-version-min=11.0', '-L{deps}/lib']\n"
    'ios-*':
      args: ['--cross-file={src}/objc-cross.ini']
      before:
        - write-file:
            path: objc-cross.ini
            text: "[binaries]\nobjc = '{CC}'\n[built-in options]\nobjc_args = ['-arch', 'arm64', '-isysroot', '{SDK_PATH}', '{IOS_MINVER}', '-I{deps}/include']\nobjc_link_args = ['-arch', 'arm64', '-isysroot', '{SDK_PATH}', '{IOS_MINVER}', '-L{deps}/lib']\n"
    'maccatalyst-*':
      args: ['--cross-file={src}/objc-cross.ini']
      before:
        - write-file:
            path: objc-cross.ini
            text: "[binaries]\nobjc = '{CC}'\n[built-in options]\nobjc_args = ['-target', '{MCAT_TARGET}', '-isysroot', '{MCAT_SYSROOT}', '-I{deps}/include']\nobjc_link_args = ['-target', '{MCAT_TARGET}', '-isysroot', '{MCAT_SYSROOT}', '-L{deps}/lib']\n"
