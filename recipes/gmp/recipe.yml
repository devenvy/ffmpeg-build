name: gmp
provides: gmp
license: LGPL-3.0-or-later OR GPL-2.0-or-later
license-files: [COPYING, COPYING.LESSERv3, COPYINGv2, COPYINGv3]
# FFmpeg's gmp option: the big-number arithmetic of rtmpe/rtmpte's Diffie-Hellman handshake (ffrtmpcrypt), where no
# TLS library does it (FFmpeg classes it version3). gnutls builds against it too, through nettle.
configure: [--enable-gmp]
source:
  url: 'https://mirrors.kernel.org/gnu/gmp/gmp-{version}.tar.xz'
  mirrors: ['https://ftp.gnu.org/gnu/gmp/gmp-{version}.tar.xz']
versions: { listing: 'https://ftp.gnu.org/gnu/gmp/', files: '^gmp-(\d+\.\d+(?:\.\d+)?)\.tar\.xz$' }
platforms: all
build:
  system: autotools
  args: ['--libdir={deps}/lib', --disable-shared, --enable-static, --with-pic, --enable-cxx=no]
  env: { CFLAGS: '{CFLAGS|} -std=gnu17' }
