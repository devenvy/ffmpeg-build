name: harfbuzz
provides: harfbuzz
license: MIT-Modern-Variant
license-files: [COPYING, src/ms-use/COPYING]
configure: [--enable-libharfbuzz]
needs: [freetype]
source: { git: https://github.com/harfbuzz/harfbuzz, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        shared-library-arg: '--default-library=shared'
        runtime-link-flags: '-static-libstdc++ -static-libgcc -Wl,--exclude-libs,libstdc++.a:libgcc.a:libgcc_eh.a -Wl,--push-state,--no-as-needed,-lm,-lz,--pop-state'
      runtime: ['lib/libharfbuzz*.so*']
build:
  vars: { shared-library-arg: [], runtime-link-flags: '', shared-mode: '' }
  env: { LDFLAGS: '+= {runtime-link-flags?}' }
  system: meson
  args:
    [
      '{shared-library-arg}',
      --wrap-mode=nofallback,
      -Dtests=disabled,
      -Ddocs=disabled,
      -Dutilities=disabled,
      -Dfreetype=enabled,
      -Dglib=disabled,
      -Dgobject=disabled,
      -Dcairo=disabled,
      -Dicu=disabled,
      -Dchafa=disabled,
    ]
