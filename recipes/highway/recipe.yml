name: highway
license: Apache-2.0 OR BSD-3-Clause
license-files: [LICENSE]
source: { git: https://github.com/google/highway, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-args:
          - -DBUILD_SHARED_LIBS=ON
          - -DHWY_FORCE_STATIC_LIBS=OFF
          - '-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -shared-libgcc -Wl,--exclude-libs,libstdc++.a:libgcc.a -Wl,-z,defs'
      runtime: ['lib/libhwy.so*']
build:
  system: cmake
  vars: { shared-args: [] }
  args:
    ['{shared-args}', -DHWY_ENABLE_TESTS=OFF, -DHWY_ENABLE_EXAMPLES=OFF, -DHWY_ENABLE_CONTRIB=OFF]
