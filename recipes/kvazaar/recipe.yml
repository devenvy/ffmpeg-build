name: kvazaar
provides: kvazaar
license: BSD-3-Clause
license-files: [LICENSE]
configure: [--enable-libkvazaar]
source: { git: https://github.com/ultravideo/kvazaar.git, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { library-args: [--enable-shared, --disable-static] }
      runtime: ['lib/libkvazaar.so*']
build:
  system: autotools
  bootstrap: autogen
  vars: { library-args: [--disable-shared, --enable-static] }
  args: ['--libdir={deps}/lib', '{library-args}', --with-pic]
  make-targets: [-C, src, libkvazaar.la]
  install-targets: [-C, src, install-libLTLIBRARIES, install-includeHEADERS]
  # Install pkg-config, dropping -lrt from Libs.private: clock_gettime is in libc on
  # every target we build (modern glibc/musl/bionic/darwin), and librt is absent on
  # Android — so -lrt would break FFmpeg's static pkg-config link there. configure.ac
  # adds -lrt for linux* hosts only (Android's triple is one); Apple and Windows have none.
  after:
    - copy: { from: src/kvazaar.pc, to: '{deps}/lib/pkgconfig/kvazaar.pc' }
    - replace-in-file: { path: '{deps}/lib/pkgconfig/kvazaar.pc', from: -lrt, to: '' }
      when: { platforms: [linux-*, android-*] }
  platforms:
    # On Windows, kvazaar.h declares its API __declspec(dllimport) by default, so a
    # consumer emits a reference to the DLL import stub (__imp_kvz_api_get) and fails
    # to link the STATIC libkvazaar.a, which exports the plain symbol. FFmpeg surfaces
    # this as "kvazaar >= 2.0.0 not found using pkg-config" (its configure link test
    # fails, not the version check). Advertise KVZ_STATIC_LIB via the .pc Cflags so
    # both that test and the FFmpeg compile (which uses pkg-config --cflags kvazaar)
    # see the static declarations. Windows-only: the dllimport path is _WIN32-gated,
    # which is why only the win-x64 build hit this.
    'win-*':
      after:
        - edit-pkg-config:
            {
              path: '{deps}/lib/pkgconfig/kvazaar.pc',
              cflags: { append: -DKVZ_STATIC_LIB, missing: skip },
            }
