name: libaribcaption
provides: aribcaption
# MIT; Android's build compiles in TinyXML-2 (Zlib) to read the system's font list
license: MIT AND Zlib
license-files: [LICENSE]
configure: [--enable-libaribcaption]
needs: [{ freetype: { platforms: [linux-*, android-*] } }, { fontconfig: { platforms: [linux-*] } }]
source: { git: https://github.com/xqq/libaribcaption, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      # Native CMake find modules do not supply a static font dependency closure.
      requires-link: { freetype: [shared], fontconfig: [shared] }
      vars:
        shared-mode: 'yes'
        library-arg: -DARIBCC_SHARED_LIBRARY=ON
        shared-link-arg: '-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -shared-libgcc -Wl,-z,defs'
      runtime: ['lib/libaribcaption.so*']
build:
  # libaribcaption: ARIB STD-B24 caption decoding and rendering (MIT), static, for FFmpeg's libaribcaption decoder
  # (found through libaribcaption.pc, 1.1.1 or later). C++. With its renderer, so the decoder's sub_type=bitmap works
  # as well as ass and text, on each platform's own text backend as upstream picks it: FreeType and Fontconfig on
  # Linux, FreeType and the system font list on Android, DirectWrite on Windows, CoreText on Apple.
  #
  # Keep the upstream minimum CMake version; the ARM cross image supplies a compatible native build tool.
  system: cmake
  vars: { library-arg: -DARIBCC_SHARED_LIBRARY=OFF, shared-link-arg: [], shared-mode: '' }
  args: [-DARIBCC_BUILD_TESTS=OFF, '{library-arg}', '{shared-link-arg}']
  platforms:
    linux-x64:
      after:
        - run:
            - python3
            - -c
            - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'libaribcaption', 'check-public-api.py'), run_name='__main__')"
            - '{deps}'
            - '{src}/ffb-sdk'
            - '{CC|gcc}'
            - '{CXX|g++}'
          when: { set: '{shared-mode}' }
    # Android's renderer uses FreeType, which its .pc doesn't name (Linux's comes through Fontconfig's): without it
    # FFmpeg's shared libavcodec was left with FreeType's symbols unresolved, and failed to load on the device
    'android-*':
      after:
        - edit-pkg-config:
            { path: '{deps}/lib/pkgconfig/libaribcaption.pc', requires-private: { add: freetype2 } }
