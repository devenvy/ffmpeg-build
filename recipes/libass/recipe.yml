name: libass
provides: ass
license: ISC
license-files: [COPYING]
configure: [--enable-libass]
needs: [freetype, fribidi, harfbuzz, { fontconfig: { platforms: [linux-*, osx-*] } }]
source: { git: https://github.com/libass/libass, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
# fontconfig on linux-* and osx-* only; elsewhere libass builds with -Dfontconfig=disabled (DirectWrite on Windows,
# CoreText on Apple, no system font provider on Android), as upstream. More platforms join as their slices land.
platforms: [linux-*, osx-*, win-*, ios-*, maccatalyst-*, android-*]
build:
  system: meson
  args: [-Dtest=disabled]
  platforms:
    linux-x64: { args: [-Dfontconfig=enabled, -Dasm=enabled] }
    linux-arm64: { args: [-Dfontconfig=enabled, -Dasm=enabled] }
    'linux-musl-*': { args: [-Dfontconfig=enabled, -Dasm=enabled] }
    linux-armhf: { args: [-Dfontconfig=enabled] }
    'osx-*': { args: [-Dfontconfig=enabled, -Dasm=enabled] }
    'win-*': { args: [-Dfontconfig=disabled, -Dasm=enabled] }
    'ios-*': { args: [-Dfontconfig=disabled, -Dasm=enabled] }
    'maccatalyst-*': { args: [-Dfontconfig=disabled, -Dasm=enabled] }
    android-arm64:
      { args: [-Dfontconfig=disabled, -Drequire-system-font-provider=false, -Dasm=enabled] }
    android-x64:
      { args: [-Dfontconfig=disabled, -Drequire-system-font-provider=false, -Dasm=disabled] }
