name: libavc1394
license: LGPL-2.1-or-later
license-files: [COPYING]
needs: [libraw1394]
# SourceForge tarballs, with Debian's byte-identical .orig.tar.gz as the mirror; versions from Debian's pool (the
# SourceForge listing's links all end in /download)
source:
  url: 'https://downloads.sourceforge.net/project/libavc1394/libavc1394/libavc1394-{version}.tar.gz'
  mirrors:
    ['https://deb.debian.org/debian/pool/main/liba/libavc1394/libavc1394_{version}.orig.tar.gz']
versions:
  {
    listing: 'https://deb.debian.org/debian/pool/main/liba/libavc1394/',
    files: '^libavc1394_(\d+\.\d+\.\d+)\.orig\.tar\.gz$',
  }
# where libiec61883 builds
platforms: [linux-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      # FFmpeg executes a trivial compiler probe with iec61883's extra-libs.
      # Drop unused DSOs there; strong device references retain them later.
      configure: ['--extra-ldflags=-Wl,--as-needed']
      vars:
        shared-mode: 'yes'
        shared-arg: --enable-shared
        static-arg: --disable-static
        shared-ldflags: '-Wl,-z,defs,--exclude-libs,libraw1394.a:libavc1394.a:librom1394.a'
      runtime: ['lib/libavc1394.so*', 'lib/librom1394.so*']
build:
  # libavc1394 and its librom1394: AV/C device control and the FireWire configuration ROM (LGPL-2.1-or-later), static.
  # FFmpeg's iec61883 input device uses both, beside libiec61883. The libraries alone: its test programs don't build
  # on musl (and aren't wanted).
  # Its config.guess and config.sub (2010) know neither 64-bit ARM nor musl: autoreconf brings the image's.
  system: autotools
  vars:
    {
      shared-arg: --disable-shared,
      static-arg: --enable-static,
      shared-ldflags: '',
      shared-mode: '',
    }
  bootstrap: autoreconf
  env: { LDFLAGS: '+= {shared-ldflags?}' }
  args: ['{shared-arg}', '{static-arg}', --with-pic]
  make-targets: [-C, common]
  install-targets: [-C, libavc1394, install]
  after:
    - [make, -C, librom1394, install]
    - [make, install-pkgconfigDATA]
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'libavc1394', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
