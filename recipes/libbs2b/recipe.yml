# libbs2b's last release (3.1.0, 2009) is a SourceForge tarball; the listing is the project's libbs2b folder (one
# folder per release).
name: libbs2b
provides: bs2b
license: MIT
license-files: [COPYING]
configure: [--enable-libbs2b]
needs: [libsndfile]
source:
  url: 'https://downloads.sourceforge.net/project/bs2b/libbs2b/{version}/libbs2b-{version}.tar.gz'
  mirrors: ['https://deb.debian.org/debian/pool/main/libb/libbs2b/libbs2b_{version}.orig.tar.gz']
versions:
  { listing: 'https://sourceforge.net/projects/bs2b/files/libbs2b/', files: '^(\d+\.\d+\.\d+)$' }
# The untouched release's config scripts accept these toolchains. Its obsolete
# Automake inputs cannot be regenerated by the current preparation toolchain.
platforms: [linux-x64, linux-armhf]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-arg: --enable-shared
        static-arg: --disable-static
        runtime-link-flags: '-Wl,--as-needed -Wl,--exclude-libs,ALL'
        runtime-libs: '-l:libstdc++.a -l:libgcc.a -l:libgcc_eh.a'
      runtime: ['lib/libbs2b.so*']
build:
  # libbs2b: Bauer stereophonic-to-binaural crossfeed (MIT), static, for FFmpeg's bs2b filter (found through
  # libbs2b.pc). Use the release's generated configure and Makefiles unchanged, including the real libsndfile
  # configure dependency. Build/install only the library, headers and package metadata, without its programs.
  system: autotools
  vars:
    {
      shared-arg: --disable-shared,
      static-arg: --enable-static,
      runtime-link-flags: '',
      runtime-libs: '',
    }
  # the platform's CFLAGS take the place of configure's default -g -O2: optimized as upstream builds it
  env:
    CFLAGS: '+= -O2'
    # Bundle the compiler runtime into the selected shared library as private symbols.
    LDFLAGS: '+= {runtime-link-flags?}'
    LIBS: '+= {runtime-libs?}'
  # AC_FUNC_MALLOC assumes a cross build's malloc(0) returns NULL and calls an rpl_malloc nobody defines (Android's
  # link failed): every C library this builds for returns a pointer
  args: ['{shared-arg}', '{static-arg}', --with-pic, ac_cv_func_malloc_0_nonnull=yes]
  make-targets: [-C, src, libbs2b.la]
  install-targets: [-C, src, install-libLTLIBRARIES, install-bs2bHEADERS]
  after:
    - [make, install-pkgconfigDATA]
