name: libcdio-paranoia
provides: cdio
license: GPL-3.0-or-later
license-files: [COPYING]
configure: [--enable-libcdio]
needs: [libcdio]
# released as cdparanoia's 10.2 plus libcdio-paranoia's own version (10.2+2.0.2): the version here is the second part
source:
  url: 'https://github.com/libcdio/libcdio-paranoia/releases/download/release-10.2+{version}/libcdio-paranoia-10.2+{version}.tar.bz2'
versions:
  {
    git-tags: '^release-10\.2\+(\d+\.\d+\.\d+)$',
    repo: https://github.com/libcdio/libcdio-paranoia,
  }
platforms: [linux-*, win-*, osx-*]
build:
  # libcdio-paranoia: cdparanoia's error-correcting audio CD reader on libcdio (GPL-3.0-or-later), static, for FFmpeg's
  # libcdio input device (found through libcdio_paranoia.pc). FFmpeg classes it gpl; its licence keeps it to gplv3
  # builds. The libraries alone (lib and include: no cd-paranoia program, docs, examples, C++ bindings or tests).
  system: autotools
  args:
    [
      --disable-shared,
      --enable-static,
      --with-pic,
      --disable-cxx,
      --disable-cpp-progs,
      --disable-example-progs,
    ]
  make-targets: [-C, lib]
  install-targets: [-C, lib, install]
  after:
    - [make, -C, include, install]
    - [make, install-pkgconfigDATA]
