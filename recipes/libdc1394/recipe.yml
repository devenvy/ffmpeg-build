name: libdc1394
provides: dc1394
license: LGPL-2.1-or-later
license-files: [COPYING]
configure: [--enable-libdc1394]
needs: [libraw1394]
source:
  url: 'https://downloads.sourceforge.net/project/libdc1394/libdc1394-2/{version}/libdc1394-{version}.tar.gz'
versions:
  {
    listing: 'https://sourceforge.net/projects/libdc1394/files/libdc1394-2/',
    files: '^(\d+\.\d+\.\d+)$',
  }
# Linux (its FireWire stack): macOS 26 removed FireWire, and its Windows driver (CMU's 1394camera) is a separate SDK
platforms: [linux-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      # FFmpeg executes a trivial compiler probe with iec61883's extra-libs.
      # Drop unused DSOs there; strong device references retain them later.
      configure: ['--extra-ldflags=-Wl,--as-needed']
      vars:
        shared-mode: 'yes'
        shared-libs: '-lraw1394 -lm'
        shared-arg: --enable-shared
        static-arg: --disable-static
        shared-ldflags: '+= -L{deps}/lib -Wl,-z,defs,--exclude-libs,libraw1394.a:libavc1394.a:librom1394.a'
      runtime: ['lib/libdc1394.so*']
build:
  # libdc1394: IIDC (DCAM) FireWire camera control and capture (LGPL-2.1-or-later), static, for FFmpeg's libdc1394
  # input device. Through Linux's firewire-core (juju) and libraw1394; no USB cameras (libusb), no examples. Its
  # configure looks for libraw1394 without pkg-config: it is shown the deps folder. Its .pc names no private
  # libraries: libraw1394's and libm are added.
  system: autotools
  vars:
    {
      shared-arg: --disable-shared,
      static-arg: --enable-static,
      shared-ldflags: '+= -L{deps}/lib',
      shared-mode: '',
      shared-libs: '',
    }
  # Native Automake puts LIBS after its convenience archives, where their raw1394 and math references resolve.
  env: { CPPFLAGS: '+= -I{deps}/include', LDFLAGS: '{shared-ldflags}', LIBS: '+= {shared-libs?}' }
  args: ['{shared-arg}', '{static-arg}', --with-pic, --disable-examples, --disable-sdltest]
  after:
    - edit-pkg-config:
        {
          path: '{deps}/lib/pkgconfig/libdc1394-2.pc',
          requires-private: { set: libraw1394 },
          libs-private: { add: -lm },
        }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'libdc1394', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
