name: libdvdread
provides: dvdread
license: GPL-2.0-or-later
license-files: [COPYING]
configure:
  - --enable-libdvdread
  - '--extra-cflags=-D_LARGEFILE64_SOURCE': { platforms: [linux-musl-*] }
# the release tarballs (VideoLAN's download site and two of its mirrors): code.videolan.org's git often stalls
source:
  url: 'https://download.videolan.org/pub/videolan/libdvdread/{version}/libdvdread-{version}.tar.xz'
  mirrors:
    - 'https://ftp.osuosl.org/pub/videolan/libdvdread/{version}/libdvdread-{version}.tar.xz'
    - 'https://www.mirrorservice.org/sites/videolan.org/libdvdread/{version}/libdvdread-{version}.tar.xz'
versions:
  { listing: 'https://download.videolan.org/pub/videolan/libdvdread/', files: '^(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        shared-args: [--default-library=shared]
        shared-ldflags: '-Wl,-z,defs'
      runtime: ['lib/libdvdread.so*']
build:
  # libdvdread: DVD-Video reading (GPL-2.0-or-later; FFmpeg's class gpl), static, for FFmpeg's dvdvideo demuxer (with
  # libdvdnav; found through dvdread.pc, 6.1.1 or later): a VIDEO_TS folder, a mounted disc or an .iso image. Not
  # linked to libdvdcss: a CSS-encrypted disc needs the system's libdvdcss, which it loads at run time when there is
  # one. No docs.
  system: meson
  vars: { shared-mode: '', shared-args: [], shared-ldflags: '' }
  env: { LDFLAGS: '+= {shared-ldflags?}' }
  args: [-Denable_docs=false, -Dlibdvdcss=disabled, '{shared-args}']
  after:
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'libdvdread', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
  platforms:
    # musl exposes its native off64_t alias when this feature-test macro precedes the first system header.
    # Propagate it to installed SDK consumers as well as the library build; no upstream header edits.
    'linux-musl-*':
      env: { CPPFLAGS: '+= -D_LARGEFILE64_SOURCE' }
      after:
        - edit-pkg-config:
            { path: '{deps}/lib/pkgconfig/dvdread.pc', cflags: { add: -D_LARGEFILE64_SOURCE } }
