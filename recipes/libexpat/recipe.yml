name: libexpat
license: MIT
license-files: [COPYING, expat/COPYING]
source: { git: https://github.com/libexpat/libexpat, ref: 'R_{version_}' }
versions: { git-tags: '^R_(\d+_\d+_\d+)$' }
# fontconfig (Linux and macOS) and OpenColorIO (everywhere) build against it
platforms: all
build:
  system: cmake
  source-dir: expat
  args:
    [
      -DEXPAT_BUILD_EXAMPLES=OFF,
      -DEXPAT_BUILD_TESTS=OFF,
      -DEXPAT_BUILD_TOOLS=OFF,
      -DEXPAT_BUILD_DOCS=OFF,
    ]
