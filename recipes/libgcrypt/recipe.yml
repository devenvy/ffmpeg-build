name: libgcrypt
provides: gcrypt
license: LGPL-2.1-or-later
license-files: [COPYING.LIB, LICENSES]
needs: [libgpg-error]
linkage:
  default: static
  modes:
    static: {}
    shared:
      vars: { static-arg: --disable-static, shared-arg: --enable-shared }
      runtime: ['lib/libgcrypt.so*']
    system-shared:
      vars: { static-arg: --disable-static, shared-arg: --enable-shared }
      runtime: ['lib/libgcrypt.so*']
      packages: { debian: [libgcrypt20], ubuntu: [libgcrypt20], fedora: [libgcrypt] }
# The static fallback in FFmpeg's configure does not add libgpg-error itself.
configure: [--enable-gcrypt, '--extra-libs=-lgpg-error']
source: { url: 'https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-{version}.tar.bz2' }
versions:
  listing: https://gnupg.org/ftp/gcrypt/libgcrypt/
  files: '^libgcrypt-(1\.12\.\d+)\.tar\.bz2$'
platforms: [linux-x64]
build:
  system: autotools
  vars: { static-arg: --enable-static, shared-arg: --disable-shared }
  args:
    - '{shared-arg}'
    - '{static-arg}'
    - --with-pic
    - --disable-doc
    # Native optional-collector selection avoids its generic SHA3 symbol collision
    # with LibreSSL. The normal OS-backed random generator remains enabled.
    - --disable-jent-support
    - '--with-libgpg-error-prefix={deps}'
  after:
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'libgcrypt', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
