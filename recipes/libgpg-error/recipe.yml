name: libgpg-error
license: LGPL-2.1-or-later
license-files: [COPYING.LIB, AUTHORS]
source: { url: 'https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-{version}.tar.bz2' }
versions:
  listing: https://gnupg.org/ftp/gcrypt/libgpg-error/
  files: '^libgpg-error-(\d+\.\d+)\.tar\.bz2$'
platforms: [linux-x64]
linkage:
  default: static
  modes:
    static: {}
    shared:
      vars: { static-arg: --disable-static, shared-arg: --enable-shared }
      runtime: ['lib/libgpg-error.so*']
    system-shared:
      vars: { static-arg: --disable-static, shared-arg: --enable-shared }
      runtime: ['lib/libgpg-error.so*']
      packages: { debian: [libgpg-error0], ubuntu: [libgpg-error0], fedora: [libgpg-error] }
build:
  system: autotools
  vars: { static-arg: --enable-static, shared-arg: --disable-shared }
  args:
    - '{shared-arg}'
    - '{static-arg}'
    - --with-pic
    - --disable-nls
    - --disable-languages
    - --disable-doc
    - --disable-tests
  make-targets: [-C, src]
  install-targets: [-C, src, install]
