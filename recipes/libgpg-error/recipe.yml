name: libgpg-error
license: LGPL-2.1-or-later
license-files: [COPYING.LIB, AUTHORS]
source: { url: 'https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-{version}.tar.bz2' }
versions:
  listing: https://gnupg.org/ftp/gcrypt/libgpg-error/
  files: '^libgpg-error-(\d+\.\d+)\.tar\.bz2$'
platforms: [linux-x64]
build:
  system: autotools
  args:
    - --disable-shared
    - --enable-static
    - --with-pic
    - --disable-nls
    - --disable-languages
    - --disable-doc
    - --disable-tests
  make-targets: [-C, src]
  install-targets: [-C, src, install]
