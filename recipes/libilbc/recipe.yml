name: libilbc
provides: ilbc
# WebRTC's code (BSD-3-Clause, with its patent grant) and abseil-cpp's (Apache-2.0): the abseil headers it includes
# (string_view, type traits) are compiled into the library, so their licence counts too, and keeps it out of v2 builds
license: BSD-3-Clause AND Apache-2.0
license-files: [COPYING, PATENTS, abseil-cpp/LICENSE]
# FFmpeg finds it with `-lilbc` alone (no pkg-config), but the library is partly C++ (WebRTC's rtc_base/checks.cc,
# live in release builds): the C++ runtime goes on FFmpeg's link, or the ffmpeg program fails to link even though
# configure's probe (a C symbol) passed. The runtime per platform, as {cxx-runtime} names it for recipes.
configure:
  - --enable-libilbc
  - '--extra-libs=-lstdc++': { platforms: [linux-x64, linux-arm64, linux-armhf, win-x64] }
  - '--extra-libs=-l:libstdc++.a': { platforms: [linux-musl-*] }
  - '--extra-libs=-l:libc++.a': { platforms: [win-arm64] }
  - '--extra-libs=-lc++': { platforms: [osx-*, ios-*, maccatalyst-*, android-*] }
source: { git: https://github.com/TimothyGu/libilbc, ref: 'v{version}', submodules: true }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-library-arg: -DBUILD_SHARED_LIBS=ON
        library-files: '_build/libilbc.so*'
        runtime-link-arg: '-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -shared-libgcc -Wl,--exclude-libs,libstdc++.a:libgcc.a'
      runtime: ['lib/libilbc.so*']
build:
  # libilbc: WebRTC's Internet Low Bitrate Codec as a standalone library (BSD-3-Clause, with WebRTC's patent grant),
  # static, for FFmpeg's libilbc decoder and encoder. It compiles against abseil-cpp's headers (a submodule; nothing of
  # abseil is linked).
  #
  # Upstream overwrites global and Release compiler flags. Its standard RelWithDebInfo configuration accepts
  # target flags without edits. Build only the native library target, and package its full native SDK outputs.
  system: none
  vars:
    {
      shared-library-arg: -DBUILD_SHARED_LIBS=OFF,
      runtime-link-arg: [],
      library-files: _build/libilbc.a,
    }
  steps:
    - [
        cmake,
        -B,
        _build,
        -S,
        .,
        -DCMAKE_BUILD_TYPE=RelWithDebInfo,
        '-DCMAKE_INSTALL_PREFIX={deps}',
        -DCMAKE_INSTALL_LIBDIR=lib,
        -DCMAKE_INSTALL_INCLUDEDIR=include,
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON,
        -DCMAKE_MACOSX_BUNDLE=OFF,
        '-DCMAKE_C_FLAGS_RELWITHDEBINFO={CFLAGS|} -O2 -DNDEBUG',
        '-DCMAKE_CXX_FLAGS_RELWITHDEBINFO={CXXFLAGS|} -O2 -DNDEBUG',
        '{shared-library-arg}',
        '{runtime-link-arg}',
        '{cmake-cross-args}',
      ]
    - [cmake, --build, _build, --target, ilbc, '-j{jobs}']
    - copy: { from: '{library-files}', into: '{deps}/lib', preserve: true }
    - copy: { from: ilbc.h, into: '{deps}/include' }
    - copy: { from: _build/ilbc_export.h, into: '{deps}/include' }
    - copy: { from: _build/libilbc.pc, into: '{deps}/lib/pkgconfig' }
  after:
    - edit-pkg-config:
        {
          path: '{deps}/lib/pkgconfig/libilbc.pc',
          libs-private: { add: '{cxx-runtime}', missing: after-libs },
        }
