# Ogg bitstream container; a build dependency of libvorbis (FFmpeg has no option of its own for it here).
name: libogg
license: BSD-3-Clause
license-files: [COPYING]
source: { git: https://github.com/xiph/ogg, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+(?:\.\d+)?)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-arg: --enable-shared, static-arg: --disable-static }
      runtime: ['lib/libogg.so*']
build:
  system: autotools
  vars: { shared-arg: --disable-shared, static-arg: --enable-static }
  args: ['{shared-arg}', '{static-arg}', --with-pic]
  before: [[./autogen.sh]]
