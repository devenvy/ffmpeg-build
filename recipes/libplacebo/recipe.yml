name: libplacebo
provides: placebo
license: LGPL-2.1-or-later
license-files:
  [
    LICENSE,
    3rdparty/glad/LICENSE,
    3rdparty/fast_float/LICENSE-MIT,
    3rdparty/fast_float/LICENSE-APACHE,
    3rdparty/fast_float/LICENSE-BOOST,
  ]
configure: [--enable-libplacebo]
# What it builds against: the Vulkan headers + vk.xml registry, shaderc (-Dshaderc=enabled) and lcms2
# (-Dlcms=enabled). Not the loader: -Dvk-proc-addr=disabled, FFmpeg's vf_libplacebo supplies vkGetInstanceProcAddr.
needs: [vulkan-headers, shaderc, lcms2]
# libplacebo builds from vendored submodules: glad (Vulkan loader), jinja + markupsafe
# (build-time templating), and fast_float (float parsing -- required where the C++ stdlib
# lacks floating-point std::from_chars, e.g. the Android NDK / older libc++). Fetch just
# those (skip demos/nuklear and the bundled Vulkan-Headers -- we supply our own).
source:
  git: https://github.com/haasn/libplacebo
  ref: 'v{version}'
  submodules:
    { depth: 1, paths: [3rdparty/glad, 3rdparty/jinja, 3rdparty/markupsafe, 3rdparty/fast_float] }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
# Upstream: BUILD_LIBPLACEBO = BUILD_VULKAN, minus the lean ios-sim-arm64 slice (FFmpeg's libplacebo filter needs
# Vulkan, which Apple gets from MoltenVK).
platforms: [linux-*, win-*, android-*, osx-*, ios-arm64, maccatalyst-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        library-arg: --default-library=shared
        shared-link-arg: "-Dcpp_link_args=['-static-libstdc++', '-shared-libgcc', '-Wl,-z,defs', '-Wl,--version-script={src}/ffb-public-api.map']"
      runtime: ['lib/libplacebo.so*']
build:
  # libplacebo: GPU-accelerated video processing (HDR tone-mapping, high-quality scaling, colorspace conversion) built
  # on Vulkan (LGPL-2.1-or-later), static. Ported from devenvy/ffmpeg scripts/deps/libplacebo.sh.
  # Enables FFmpeg's libplacebo filter. Needs the Vulkan headers and a SPIR-V compiler (shaderc). Its vendored
  # submodules are fetched with the source (source.submodules).
  #
  # -Dvk-proc-addr=disabled: don't link vkGetInstanceProcAddr ourselves -- FFmpeg's vf_libplacebo supplies
  # the Vulkan loader/proc-addr at runtime. Linking it needs a Vulkan import lib the
  # mingw/win deps don't provide (undefined vkGetInstanceProcAddr at FFmpeg link).
  system: meson
  vars: { shared-mode: '', library-arg: [], shared-link-arg: [] }
  before:
    - run:
        - python3
        - -c
        - "import os, shutil; shutil.copyfile(os.path.join(os.environ['RECIPES'], 'libplacebo', 'exports.map'), 'ffb-public-api.map')"
      when: { set: '{shared-mode}' }
  args:
    - '{library-arg}'
    - '{shared-link-arg}'
    - -Dvulkan=enabled
    - -Dshaderc=enabled
    - -Dglslang=disabled
    - -Dopengl=disabled
    - -Ddemos=false
    - -Dtests=false
    - -Dlcms=enabled
    - -Dd3d11=disabled
    - -Dvk-proc-addr=disabled
  after:
    # libplacebo and the static shaderc it pulls are C++ (std::to_chars / std::from_chars),
    # but their pkg-config files declare no C++ runtime. Upstream added it to FFmpeg's link through EXTRA_LIBS;
    # a recipe never touches FFmpeg's flags, so it goes into libplacebo.pc's Libs.private instead, which FFmpeg's
    # static --enable-libplacebo probe and final link read through pkg-config --static.
    - edit-pkg-config:
        {
          path: '{deps}/lib/pkgconfig/libplacebo.pc',
          libs-private: { append: '{cxx-runtime}', missing: after-libs },
        }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'libplacebo', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
