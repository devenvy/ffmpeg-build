name: libressl
provides: libtls
license: OpenSSL AND ISC
license-files: [COPYING]
group: tls
configure: [--enable-libtls]
source: { url: 'https://cdn.openbsd.org/pub/OpenBSD/LibreSSL/libressl-{version}.tar.gz' }
versions:
  listing: https://cdn.openbsd.org/pub/OpenBSD/LibreSSL/
  files: '^libressl-(4\.3\.\d+)\.tar\.gz$'
platforms: [linux-x64]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        {
          library-arg: -DBUILD_SHARED_LIBS=ON,
          shared-link-arg: '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,defs',
        }
      runtime: ['lib/libtls.so*', 'lib/libssl.so*', 'lib/libcrypto.so*']
build:
  system: cmake
  vars: { library-arg: -DBUILD_SHARED_LIBS=OFF, shared-link-arg: [] }
  args:
    - '{library-arg}'
    - '{shared-link-arg}'
    - -DLIBRESSL_APPS=OFF
    - -DLIBRESSL_TESTS=OFF
    - -DENABLE_NC=OFF
    - -DOPENSSLDIR=/etc/ssl
    - -DTLS_DEFAULT_CA_FILE=/etc/ssl/cert.pem
