name: librtmp
provides: rtmp
# librtmp's own licence (rtmpdump's programs, not built here, are GPL-2.0)
license: LGPL-2.1-or-later
license-files: [librtmp/COPYING]
configure: [--enable-librtmp]
needs: [zlib]
# Native OpenSSL encryption where its platform/licence permits; otherwise upstream's plain RTMP/RTMPT mode.
# The native GnuTLS backend requires compatibility fixes, so it is not selected.
uses: [openssl]
source: { git: https://git.ffmpeg.org/rtmpdump.git, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static:
      conflicts-link: &native-ssl-provider
        libressl:
          modes: [static, shared]
          platforms: [linux-x64]
          reason: 'This librtmp route selects OpenSSL; LibreSSL-backed librtmp is not verified. Omit rtmp or libtls from this target.'
    shared:
      conflicts-link: *native-ssl-provider
      platforms: [linux-x64]
      vars:
        shared: yes
        shared-mode: yes
        library-targets: [librtmp.a, librtmp.so.1, librtmp.pc]
        install-targets: [install_base, install_so]
        shared-link-arg: 'XLDFLAGS=-L{deps}/lib {LDFLAGS|} -Wl,--exclude-libs,libssl.a:libcrypto.a:libz.a:libatomic.a -Wl,-z,defs'
      runtime: ['lib/librtmp.so*']
build:
  # librtmp (rtmpdump's library), static, for FFmpeg's librtmp protocols (found through librtmp.pc). With it on, they
  # replace FFmpeg's own rtmp, rtmpe, rtmps, rtmpt and rtmpte under the same names (configure turns FFmpeg's off).
  # rtmpdump has a hand-written Makefile and no configure: its library target and .pc are built with the platform's
  # compiler, archiver and flags on the command line (as libgsm's and bzip2's), static only, and installed without
  # the man page. SYS picks the system libraries its .pc names (Winsock on Windows).
  system: none
  vars:
    tools: ''
    crypto: ''
    sys: posix
    shared: no
    shared-mode: ''
    library-targets: [librtmp.a, librtmp.pc]
    install-targets: [install_base]
    shared-link-arg: []
    crypto-link-arg: []
  platforms:
    'win-*': { vars: { sys: mingw } }
    'osx-*': { vars: { sys: darwin } }
    'ios-*': { vars: { sys: darwin } }
    'maccatalyst-*': { vars: { sys: darwin } }
  steps:
    - vars: { tools: '{host}-' }
      when: { set: '{host}' }
    - find:
        var: ssl-library
        glob: ['{deps}/lib/libssl.a', '{deps}/lib/libssl.so*']
    - check:
        file: '{deps}/lib/pkgconfig/openssl.pc'
        line: 'Name: OpenSSL'
        message: 'librtmp requires the resolved OpenSSL provider; this prefix contains different or incomplete SSL metadata'
      when: { set: '{ssl-library}' }
    - vars: { crypto: OPENSSL }
      when: { set: '{ssl-library}' }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'librtmp', 'crypto-link-flags.py'), run_name='__main__')"
        - '{src}/_ffb-rtmp-crypto.txt'
      when: { set: '{shared-mode}', exists: '{deps}/lib/pkgconfig/openssl.pc' }
    - read:
        file: '{src}/_ffb-rtmp-crypto.txt'
        pattern: '^(.+)$'
        var: crypto-libs
        message: 'OpenSSL did not provide a static dependency closure for shared librtmp'
      when: { set: '{shared-mode}', exists: '{deps}/lib/pkgconfig/openssl.pc' }
    - vars: { crypto-link-arg: 'LIB_OPENSSL={crypto-libs}' }
      when: { set: '{shared-mode}', exists: '{deps}/lib/pkgconfig/openssl.pc' }
    - vars:
        make-args:
          [
            'CC={CC|{tools}gcc}',
            'AR={AR|{tools}ar}',
            'SYS={sys}',
            'CRYPTO={crypto}',
            'SHARED={shared}',
            'prefix={deps}',
            'XCFLAGS=-fPIC {CFLAGS|} -I{deps}/include',
            '{shared-link-arg}',
            '{crypto-link-arg}',
          ]
    - [make, -C, librtmp, '-j{jobs}', '{library-targets}', '{make-args}']
    - [make, -C, librtmp, '{install-targets}', '{make-args}']
    - remove: { path: '{deps}/man', recursive: true }
