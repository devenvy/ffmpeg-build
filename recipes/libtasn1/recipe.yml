name: libtasn1
license: LGPL-2.1-or-later
license-files: [COPYING, COPYING.LESSERv2]
source:
  url: 'https://mirrors.kernel.org/gnu/libtasn1/libtasn1-{version}.tar.gz'
  mirrors: ['https://ftp.gnu.org/gnu/libtasn1/libtasn1-{version}.tar.gz']
versions:
  {
    listing: 'https://ftp.gnu.org/gnu/libtasn1/',
    files: '^libtasn1-(\d+\.\d+(?:\.\d+)?)\.tar\.gz$',
  }
# only gnutls builds against it, and only where gnutls builds
platforms: [linux-*, android-*, maccatalyst-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-arg: --enable-shared, static-arg: --disable-static }
      runtime: ['lib/libtasn1.so*']
build:
  system: autotools
  vars: { shared-arg: --disable-shared, static-arg: --enable-static }
  args: ['--libdir={deps}/lib', '{shared-arg}', '{static-arg}', --with-pic, --disable-doc]
