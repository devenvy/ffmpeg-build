name: libtheora
provides: theora
license: BSD-3-Clause
license-files: [COPYING]
configure: [--enable-libtheora]
needs: [libogg]
source: { git: https://github.com/xiph/theora, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
build:
  # libtheora: Xiph's Theora video codec (BSD-3-Clause), static, for FFmpeg's libtheora encoder (FFmpeg decodes Theora
  # itself). FFmpeg 9 finds it through theoraenc.pc (which requires theoradec and ogg); 8.x with
  # `-ltheoraenc -ltheoradec -logg`. The git tree has no generated configure: autogen.sh is `autoreconf -isf`. Only
  # the libraries and headers: no examples (they want SDL and libvorbis), no spec or Doxygen docs, and none of the
  # configure-time test programs that link libogg/libvorbis (a cross build can't run them).
  system: autotools
  bootstrap: autogen
  args:
    [
      --disable-shared,
      --enable-static,
      --with-pic,
      --disable-examples,
      --disable-doc,
      --disable-spec,
      --disable-oggtest,
      --disable-vorbistest,
      --disable-sdltest,
      '--with-ogg={deps}',
    ]
  platforms:
    # its x86-64 assembly built by mingw makes corrupt Theora (FFmpeg's decoder rejects the encoder's output), as
    # BtbN's builds found: plain C there
    win-x64: { args: [--disable-asm] }
