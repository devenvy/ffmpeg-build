name: libva
provides: vaapi
license: MIT
license-files: [COPYING]
configure: [--enable-vaapi]
needs: [libdrm]
source: { git: https://github.com/intel/libva, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
platforms: [linux-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        {
          shared-arg: --enable-shared,
          static-arg: --disable-static,
          shared-mode: 'yes',
          shared-ldflags: '-Wl,-z,defs,--exclude-libs,libdrm.a',
        }
      runtime: ['lib/libva.so*', 'lib/libva-drm.so*']
build:
  # The native Autotools build supports static archives; Meson's targets are unconditionally shared.
  system: autotools
  bootstrap: autoreconf
  vars:
    {
      shared-arg: --disable-shared,
      static-arg: --enable-static,
      shared-mode: '',
      shared-ldflags: '',
      drivers-dir: /usr/lib/dri,
    }
  env: { LDFLAGS: '+= {shared-ldflags?}' }
  args:
    [
      '{shared-arg}',
      '{static-arg}',
      --with-pic,
      --enable-drm,
      --disable-x11,
      --disable-glx,
      --disable-wayland,
      --disable-docs,
      --sysconfdir=/etc,
      '--with-drivers-path={drivers-dir}',
    ]
  platforms:
    linux-x64: { vars: { drivers-dir: /usr/lib/x86_64-linux-gnu/dri } }
    linux-arm64: { vars: { drivers-dir: /usr/lib/aarch64-linux-gnu/dri } }
    linux-armhf: { vars: { drivers-dir: /usr/lib/arm-linux-gnueabihf/dri } }
  # Static libva dlopens the VA driver at runtime, so its consumers need -ldl; libva-drm
  # also pulls in libva + libdrm. Make sure pkg-config --static exposes these for FFmpeg.
  after:
    - edit-pkg-config:
        {
          path: '{deps}/lib/pkgconfig/libva.pc',
          optional: true,
          libs-private: { set: -ldl, missing: after-libs },
        }
    - edit-pkg-config:
        {
          path: '{deps}/lib/pkgconfig/libva-drm.pc',
          optional: true,
          libs-private: { set: -ldl, missing: after-libs },
          requires-private: { add: libdrm, missing: end },
        }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'libva', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
