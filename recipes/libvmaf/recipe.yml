name: libvmaf
provides: vmaf
license: BSD-2-Clause-Patent
license-files: [LICENSE]
configure: [--enable-libvmaf]
source: { git: https://github.com/Netflix/vmaf, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
# llvm-mingw's libc++ exposes an upstream libsvm swap ambiguity on Windows ARM64. No source rename is carried.
platforms: [linux-*, win-x64, osx-*, ios-*, maccatalyst-*, android-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        library-arg: --default-library=shared
        shared-link-arg: "-Dcpp_link_args=['-static-libstdc++', '-shared-libgcc', '-Wl,-z,defs', '-Wl,--exclude-libs,libstdc++.a:libsupc++.a', '-Wl,--version-script={src}/ffb-public-api.map']"
      runtime: ['lib/libvmaf.so*']
build:
  # libvmaf: Netflix VMAF perceptual video-quality metric (BSD-2-Clause-Patent), static. Ported from devenvy/ffmpeg
  # scripts/deps/libvmaf.sh. Enables FFmpeg's vmaf filter. The meson project lives in the libvmaf/ subdirectory of the
  # repo. Default prediction models are compiled into the library (no runtime model files).
  system: meson
  vars: { shared-mode: '', library-arg: [], shared-link-arg: [] }
  source-dir: libvmaf
  args:
    [
      '{library-arg}',
      '{shared-link-arg}',
      -Denable_tests=false,
      -Denable_docs=false,
      -Dbuilt_in_models=true,
      -Denable_float=true,
    ]
  before:
    - run:
        - python3
        - -c
        - "import os, shutil; shutil.copyfile(os.path.join(os.environ['RECIPES'], 'libvmaf', 'exports.map'), 'ffb-public-api.map')"
      when: { set: '{shared-mode}' }
    # -Dbuilt_in_models=true is a REQUEST, not a guarantee: libvmaf's meson treats xxd as
    # `required: false` and emits the model sources only inside `if xxd.found()`, with no failure
    # branch. Without xxd the library builds cleanly, the FFmpeg filter still registers, and every
    # model lookup returns -EINVAL -- so the default `version=vmaf_v0.6.1` silently cannot load.
    # That shipped on the manylinux RIDs, which had no xxd. Assert the tool is actually there so a
    # missing model set fails the build instead of the user's first vmaf invocation.
    - check:
        command: xxd
        message: >-
          xxd not found; libvmaf would build with NO built-in models. The filter would register and then fail on its
          default version=vmaf_v0.6.1. Package providing xxd: vim-common on RPM hosts; xxd on Alpine and on Debian 11+ /
          Ubuntu 22.04+ (it was split out of vim-common there); vim-common on older Debian.
    # VMAF hard-fails below NASM 2.13.02 but only WARNS below 2.14, silently dropping its AVX-512
    # kernels -- the same required:false shape as the xxd problem above, one level down. The package
    # lists do not pin a NASM version, so assert the floor on the x86-64 RIDs that actually use it.
    - check:
        output: [nasm, -v]
        cwd: libvmaf
        matches: '^NASM version ([0-9]+\.[0-9]+(\.[0-9]+)?)'
        min-version: '2.14'
        message: >-
          nasm on {platform} is missing, unparseable or older than 2.14; libvmaf needs >= 2.14 for its AVX-512 kernels
          (it only warns below that and builds without them). Install a newer nasm.
      when:
        { platforms: [linux-x64, linux-musl-x64, win-x64, osx-x64, maccatalyst-x64, android-x64] }
  # libvmaf is C++; its pkg-config declares no C++ runtime. Upstream appended it to FFmpeg's EXTRA_LIBS for the static
  # --enable-libvmaf link (libstdc++ on GNU/Linux + mingw, libc++ on Apple/NDK, -l:libstdc++.a on musl, -l:libc++.a on
  # win-arm64); a recipe can't touch FFmpeg's link line, so it goes into libvmaf.pc instead.
  after:
    - edit-pkg-config:
        { path: '{deps}/lib/pkgconfig/libvmaf.pc', libs-private: { append: '{cxx-runtime}' } }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'libvmaf', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
