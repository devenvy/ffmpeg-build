name: libvorbis
provides: vorbis
license: BSD-3-Clause
license-files: [COPYING]
configure: [--enable-libvorbis]
needs: [libogg]
source: { git: https://github.com/xiph/vorbis, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+(?:\.\d+)?)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-arg: --enable-shared, static-arg: --disable-static }
      runtime: ['lib/libvorbis.so*', 'lib/libvorbisenc.so*', 'lib/libvorbisfile.so*']
build:
  system: autotools
  vars: { shared-arg: --disable-shared, static-arg: --enable-static }
  args: ['{shared-arg}', '{static-arg}', '--with-ogg={deps}', --with-pic]
  before: [[./autogen.sh]]
  make-targets: [-C, lib, libvorbis.la, libvorbisenc.la, libvorbisfile.la]
  install-targets: []
  after:
    - [make, -C, lib, install-libLTLIBRARIES]
    - [make, -C, include, install]
    - [make, install-pkgconfigDATA]
