name: libvpl
provides: vpl
license: MIT
license-files: [LICENSE]
configure: [--enable-libvpl]
source: { git: https://github.com/intel/libvpl, ref: 'v{version}' }
# 2.x only: the repo still carries the old oneVPL tags (v2022.x, v2023.x), which would read as newer
versions: { git-tags: '^v(2\.\d+\.\d+)$' }
platforms: [linux-x64, linux-musl-x64, win-x64]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        library-arg: -DBUILD_SHARED_LIBS=ON
        shared-mode: 'yes'
        system-libs: -ldl
        c-flags: -DCMAKE_C_FLAGS=-shared-libgcc -O2
        cxx-flags: -DCMAKE_CXX_FLAGS=-shared-libgcc -static-libstdc++ -O2
        shared-args: ['-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,defs']
      runtime: ['lib/libvpl.so*']
build:
  # libvpl (oneVPL): Intel Video Processing Library dispatcher (MIT) for Quick Sync Video (QSV) hardware transcode,
  # static. Ported from devenvy/ffmpeg scripts/deps/libvpl.sh.
  # Upstream's own cmake line (not the standard one): no CMAKE_BUILD_TYPE, and its explicit C/CXX flags.
  system: none
  steps:
    - - cmake
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -G
      - Ninja
      - -B
      - _build
      - '{cmake-cross-args}'
      - '-DCMAKE_INSTALL_PREFIX={deps}'
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_DISPATCHER=ON
      - -DBUILD_DEV=ON
      - -DBUILD_PREVIEW=OFF
      - -DBUILD_TOOLS=OFF
      - -DBUILD_TOOLS_ONEVPL_EXPERIMENTAL=OFF
      - -DINSTALL_EXAMPLE_CODE=OFF
      - '{library-arg}'
      - -DBUILD_TESTS=OFF
      - '{c-flags}'
      - '{cxx-flags}'
      - '{shared-args}'
    - [cmake, --build, _build, '-j{jobs}']
    - [cmake, --install, _build]
    # Windows needs the COM/GDI system libs; Linux's dispatcher just needs libdl
    # (it dlopens the QSV runtime) and libstdc++ (it is C++).
    - pkg-config:
        file: vpl
        name: libvpl
        description: Intel Video Processing Library (oneVPL)
        version: '{version}'
        libs: '-lvpl {system-libs}'
        cflags: '-I${includedir}/vpl'
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'libvpl', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
  vars:
    system-libs: -lstdc++ -ldl
    library-arg: -DBUILD_SHARED_LIBS=OFF
    shared-mode: ''
    shared-args: []
    c-flags: -DCMAKE_C_FLAGS=-static-libgcc -O2
    cxx-flags: -DCMAKE_CXX_FLAGS=-static-libgcc -static-libstdc++ -O2
  platforms:
    'win-*':
      vars:
        system-libs: -lole32 -lgdi32 -luuid -lstdc++
        # Parse the real SDK before the dispatcher's legacy CRT macros. New MinGW
        # stralign.h uses wcscpy_s in an expression; upstream's macro is a statement.
        # This is a compiler preinclude, with no SDK or dispatcher source changes.
        cxx-flags: -DCMAKE_CXX_FLAGS=-static-libgcc -static-libstdc++ -O2 -DNOMINMAX -include windows.h
