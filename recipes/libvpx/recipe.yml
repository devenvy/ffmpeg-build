name: libvpx
provides: vpx
license: BSD-3-Clause
license-files: [LICENSE, PATENTS, third_party/x86inc/LICENSE]
configure: [--enable-libvpx]
source:
  {
    git: https://chromium.googlesource.com/webm/libvpx.git,
    ref: 'v{version}',
    mirror: https://github.com/webmproject/libvpx.git,
  }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-arg: --enable-shared, static-arg: --disable-static }
      runtime: ['lib/libvpx.so*']
build:
  # libvpx: VP8 / VP9 video encoder + decoder (BSD-3-Clause), the WebM reference codec, static. Ported from
  # devenvy/ffmpeg scripts/deps/libvpx.sh. Its own configure: the platform names the --target, and cross toolchains
  # reach it through CROSS (configure, make and make install all see it).
  system: none
  vars: { shared-arg: --disable-shared, static-arg: --enable-static, tool-prefix: '' }
  before:
    - vars: { tool-prefix: '' }
      when: { platforms: [win-*], set: '{MSYSTEM?}' }
  steps:
    - run:
        - ./configure
        - --prefix=/opt/ffmpeg-build/deps
        - '{shared-arg}'
        - '{static-arg}'
        - --enable-vp8
        - --enable-vp9
        - --enable-vp9-highbitdepth
        - --disable-examples
        - --disable-tools
        - --disable-docs
        - --disable-unit-tests
        - --enable-pic
        - '{args}'
      env: { CROSS: '{tool-prefix}' }
    - run: [make, '-j{jobs}']
      env: { CROSS: '{tool-prefix}' }
    # Native DIST_DIR controls the installation root independently of the compiled configure prefix.
    - run: [make, install, 'DIST_DIR={deps}']
      env: { CROSS: '{tool-prefix}' }
    - edit-pkg-config: { path: '{deps}/lib/pkgconfig/vpx.pc', variables: { prefix: '{deps}' } }
  platforms:
    linux-armhf:
      {
        args: [--target=armv7-linux-gcc, --extra-cflags=-mfpu=neon],
        vars: { tool-prefix: arm-linux-gnueabihf- },
      }
    win-x64:
      {
        args: [--target=x86_64-win64-gcc, --extra-cflags=-static-libgcc],
        vars: { tool-prefix: '{CROSS_PREFIX}-' },
      }
    # libvpx's arm64-win64-gcc target covers any GCC-style driver, llvm-mingw's clang
    # included. This builds a static .a, so the runtime-linkage flags that matter live on
    # FFmpeg's own link.
    win-arm64: { args: [--target=arm64-win64-gcc], vars: { tool-prefix: '{CROSS_PREFIX}-' } }
    android-arm64: { args: [--target=arm64-android-gcc, --extra-cflags=-fPIC] }
    android-x64: { args: [--target=x86_64-android-gcc, --extra-cflags=-fPIC] }
    # NOT arm64-darwin-gcc: libvpx treats arm*-darwin-* as iOS and injects
    #   -miphoneos-version-min + the iPhoneOS SDK
    # which clang rejects next to our macabi -target and macOS sysroot:
    #   Requested extra CFLAGS ... not supported by compiler
    # The darwin2x targets are the macOS flavour, and libvpx stops adding
    # -mmacosx-version-min at darwin19 -- so darwin20+ contributes the macOS SDK and NO
    # deployment-target flag to collide with the macabi triple. That keeps the asm enabled,
    # unlike generic-gnu which would silently cost VP8/VP9 SIMD.
    maccatalyst-arm64:
      {
        args:
          [
            --target=arm64-darwin20-gcc,
            '--extra-cflags=-target {MCAT_TARGET} -isysroot {MCAT_SYSROOT}',
          ],
      }
    maccatalyst-x64:
      {
        args:
          [
            --target=x86_64-darwin20-gcc,
            '--extra-cflags=-target {MCAT_TARGET} -isysroot {MCAT_SYSROOT}',
          ],
      }
    # cross-compiled on Apple silicon: name the target, or libvpx detects the arm64 host
    osx-x64: { args: [--target=x86_64-darwin20-gcc, --extra-cflags=-arch x86_64] }
    # Device only — libvpx's arm64-darwin-gcc target is iOS-device-specific.
    # The simulator slice is built lean (no libvpx) so it never reaches here.
    ios-arm64:
      {
        args:
          [
            --target=arm64-darwin-gcc,
            '--extra-cflags=-arch arm64 {IOS_MINVER} -isysroot {IOS_SYSROOT}',
          ],
      }
