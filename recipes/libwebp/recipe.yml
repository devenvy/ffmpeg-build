name: libwebp
provides: webp
license: BSD-3-Clause
license-files: [COPYING, PATENTS]
configure: [--enable-libwebp]
source:
  {
    git: https://chromium.googlesource.com/webm/libwebp.git,
    ref: 'v{version}',
    mirror: https://github.com/webmproject/libwebp.git,
  }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
# Not android-* / ios-* / maccatalyst-*: upstream drops it there (image-only codec, not needed for mobile decode).
platforms: [linux-*, osx-*, win-*]
build:
  system: cmake
  args:
    [
      -DWEBP_BUILD_CWEBP=OFF,
      -DWEBP_BUILD_DWEBP=OFF,
      -DWEBP_BUILD_GIF2WEBP=OFF,
      -DWEBP_BUILD_IMG2WEBP=OFF,
      -DWEBP_BUILD_VWEBP=OFF,
      -DWEBP_BUILD_WEBPINFO=OFF,
      -DWEBP_BUILD_WEBPMUX=OFF,
      -DWEBP_BUILD_EXTRAS=OFF,
      -DWEBP_BUILD_ANIM_UTILS=OFF,
    ]
