name: libxau
license: MIT-open-group
license-files: [COPYING]
needs: [xorgproto]
source:
  url: 'https://xorg.freedesktop.org/releases/individual/lib/libXau-{version}.tar.xz'
  mirrors: ['https://www.x.org/releases/individual/lib/libXau-{version}.tar.xz']
versions:
  {
    listing: 'https://xorg.freedesktop.org/releases/individual/lib/',
    files: '^libXau-(\d+\.\d+\.\d+)\.tar\.xz$',
  }
# where libxcb builds
platforms: [linux-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        { shared-arg: --enable-shared, static-arg: --disable-static, shared-ldflags: '-Wl,-z,defs' }
      runtime: ['lib/libXau.so*']
build:
  # libXau: X authorization (the X server's cookie, from $XAUTHORITY), static, under libxcb
  system: autotools
  vars: { shared-arg: --disable-shared, static-arg: --enable-static, shared-ldflags: '' }
  env: { LDFLAGS: '+= {shared-ldflags?}' }
  args: ['{shared-arg}', '{static-arg}', --with-pic]
