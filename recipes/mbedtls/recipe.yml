name: mbedtls
license: Apache-2.0 OR GPL-2.0-or-later
license-files: [LICENSE]
source:
  {
    url: 'https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-{version}/mbedtls-{version}.tar.bz2',
  }
versions: { git-tags: '^v(3\.\d+\.\d+)$', repo: https://github.com/Mbed-TLS/mbedtls }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        library-args: [-DUSE_SHARED_MBEDTLS_LIBRARY=ON, -DUSE_STATIC_MBEDTLS_LIBRARY=OFF]
        shared-link-arg: [-DLINK_WITH_PTHREAD=ON, '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,defs']
      runtime: ['lib/libmbedtls.so*', 'lib/libmbedx509.so*', 'lib/libmbedcrypto.so*']
build:
  # mbedTLS: TLS and crypto (Apache-2.0 OR GPL-2.0-or-later), static: srt's and librist's encryption, libssh's crypto,
  # and FFmpeg's mbedtls TLS option. Thread-safe where the C library has pthreads (every platform but Windows):
  # MBEDTLS_THREADING_C with its pthread mutexes, which libssh requires (its global random generator is locked through
  # them, and ssh_init fails without). Windows keeps the default configuration: mbedTLS's only other threading is
  # MBEDTLS_THREADING_ALT, whose locks fail until the application installs its own, and pthreads there would be
  # winpthreads on every mbedTLS link.
  system: cmake
  vars:
    library-args: [-DUSE_SHARED_MBEDTLS_LIBRARY=OFF, -DUSE_STATIC_MBEDTLS_LIBRARY=ON]
    shared-link-arg: []
  args: ['{library-args}', '{shared-link-arg}', -DENABLE_TESTING=OFF, -DENABLE_PROGRAMS=OFF]
  platforms:
    'linux-*': &threads
      before:
        # Upstream's supported configuration tool; no engine-owned header edits.
        # https://github.com/Mbed-TLS/mbedtls-docs/blob/main/kb/compiling-and-building/how-do-i-configure-mbedtls.md
        - [python3, scripts/config.py, set, MBEDTLS_THREADING_C]
        - [python3, scripts/config.py, set, MBEDTLS_THREADING_PTHREAD]
    # its .pc files don't name the Windows libraries its static libraries call: bcrypt (entropy) and ws2_32
    # (x509's inet_pton), on the crypto library every other one requires (srt and librist name their own)
    'win-*':
      after:
        - edit-pkg-config:
            {
              path: '{deps}/lib/pkgconfig/mbedcrypto.pc',
              libs-private: { add: -lbcrypt -lws2_32, missing: after-libs },
            }
    'android-*': *threads
    'osx-*': *threads
    'ios-*': *threads
    'maccatalyst-*': *threads
