name: minizip-ng
license: Zlib
license-files: [LICENSE]
needs: [zlib]
source: { git: https://github.com/zlib-ng/minizip-ng, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
# only OpenColorIO builds against it, where it builds
platforms: [linux-*, win-*, android-*]
build:
  # minizip-ng: zip archives (Zlib), static, for OpenColorIO's .ocioz config archives. Deflate through zlib only, as
  # OpenColorIO's own build of it: no bzip2, LZMA, PPMd (4.2's bundled PPMd is a library of its own, which the .pc
  # doesn't name), zstd, encryption, signing, iconv, compatibility API or tests, and nothing fetched.
  system: cmake
  args:
    [
      -DMZ_OPENSSL=OFF,
      -DMZ_LIBBSD=OFF,
      -DMZ_BUILD_TESTS=OFF,
      -DMZ_COMPAT=OFF,
      -DMZ_BZIP2=OFF,
      -DMZ_LZMA=OFF,
      -DMZ_PPMD=OFF,
      -DMZ_LIBCOMP=OFF,
      -DMZ_ZSTD=OFF,
      -DMZ_PKCRYPT=OFF,
      -DMZ_WZAES=OFF,
      -DMZ_SIGNING=OFF,
      -DMZ_ZLIB=ON,
      -DMZ_ICONV=OFF,
      -DMZ_FETCH_LIBS=OFF,
      -DMZ_FORCE_FETCH_LIBS=OFF,
    ]
