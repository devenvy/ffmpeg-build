name: mpeghdec
provides: mpeghdec
license: FDK-MPEG-H
license-files: [LICENSE.txt, { recipe: BUILD-NOTICE.txt }]
configure: [--enable-libmpeghdec]
source: { git: https://github.com/Fraunhofer-IIS/mpeghdec.git, ref: 'r{version}' }
# r4.0.1 isolates the internal symbols shared with static fdk-aac.
versions: { git-tags: '^r(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        consumer-flags: ''
        shared-args:
          [
            -DBUILD_SHARED_LIBS=ON,
            '-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -shared-libgcc -Wl,-z,defs -Wl,--exclude-libs,libstdc++.a:libsupc++.a -Wl,--version-script={src}/ffb-public-api.map',
          ]
      runtime: ['lib/libmpeghdec.so*']
build:
  system: cmake
  args:
    [
      '{shared-args}',
      -Dmpeghdec_BUILD_BINARIES=OFF,
      -Dmpeghdec_BUILD_DOC=OFF,
      -Dmpeghdec_SYMBOL_PREFIX=ON,
    ]
  before:
    - run:
        - python3
        - -c
        - "import os, shutil; shutil.copyfile(os.path.join(os.environ['RECIPES'], 'mpeghdec', 'exports.map'), 'ffb-public-api.map')"
      when: { set: '{shared-mode}' }
  after:
    # Upstream installs this under share/pkgconfig; the engine searches lib/pkgconfig.
    # C consumers need the C++ runtime, and Windows consumers need the static export macro.
    - pkg-config:
        name: mpeghdec
        description: Fraunhofer MPEG-H decoder
        version: '{version}'
        cflags: '{consumer-flags}'
        libs: -lmpeghdec
        libs-private: '-lm {cxx-runtime}'
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'mpeghdec', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
  vars:
    { cxx-runtime: -lstdc++, consumer-flags: -DMPEGHDEC_STATIC=1, shared-args: [], shared-mode: '' }
  platforms:
    linux-armhf:
      # Upstream's generated prefix header misses this C++ symbol on 32-bit ARM (long differs from x64).
      env: { CXXFLAGS: '+= -Dschur_div=_mpeghdec_schur_div' }
    'osx-*': &apple-runtime
      vars: { cxx-runtime: -lc++ }
    'ios-*': *apple-runtime
    'maccatalyst-*': *apple-runtime
    win-arm64:
      vars: { cxx-runtime: '-l:libc++.a' }
    'linux-musl-*':
      vars: { cxx-runtime: '-l:libstdc++.a' }
