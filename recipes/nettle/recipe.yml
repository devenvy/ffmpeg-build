name: nettle
license: LGPL-3.0-or-later OR GPL-2.0-or-later
license-files: [COPYING.LESSERv3, COPYINGv2, COPYINGv3]
needs: [gmp]
source:
  url: 'https://mirrors.kernel.org/gnu/nettle/nettle-{version}.tar.gz'
  mirrors: ['https://ftp.gnu.org/gnu/nettle/nettle-{version}.tar.gz']
versions:
  { listing: 'https://ftp.gnu.org/gnu/nettle/', files: '^nettle-(\d+\.\d+(?:\.\d+)?)\.tar\.gz$' }
# only gnutls builds against it, and only where gnutls builds
platforms: [linux-*, android-*, maccatalyst-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-arg: --enable-shared
        static-arg: --disable-static
        shared-link-arg: 'LDFLAGS=-L{deps}/lib {LDFLAGS|} -Wl,--exclude-libs,libgmp.a -Wl,-z,defs'
      runtime: ['lib/libnettle.so*', 'lib/libhogweed.so*']
build:
  system: autotools
  vars: { shared-arg: --disable-shared, static-arg: --enable-static, shared-link-arg: [] }
  args:
    [
      '--libdir={deps}/lib',
      '{shared-arg}',
      '{static-arg}',
      --disable-documentation,
      '{shared-link-arg}',
    ]
  env:
    {
      CFLAGS: '{CFLAGS|} -std=gnu17',
      CPPFLAGS: '-I{deps}/include {CPPFLAGS|}',
      LDFLAGS: '-L{deps}/lib {LDFLAGS|}',
    }
