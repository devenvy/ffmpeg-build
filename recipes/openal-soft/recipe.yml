name: openal-soft
provides: openal
# OpenAL Soft (LGPL-2.0-or-later), with code under the BSD 3-Clause licence (its BSD-3Clause), its modified PFFFT
# (LICENSE-pffft: BSD-like terms of NCAR's; SPDX has no identifier for it) and the {fmt} it bundles (MIT; the text is kept
# here, since its folder is named by fmt's version)
license: LGPL-2.0-or-later AND BSD-3-Clause AND LicenseRef-pffft AND MIT
license-files: [COPYING, BSD-3Clause, LICENSE-pffft, { recipe: fmt-LICENSE }]
configure: [--enable-openal]
# On Linux, link the selected ALSA recipe instead of silently loading the system's libasound.so.2.
needs: [{ alsa-lib: { platforms: [linux-*] } }]
source: { git: https://github.com/kcat/openal-soft.git, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
# where its capture reaches the system's audio and is checked: Linux, Windows and macOS. Not linux-armhf: its CMake
# (Debian's 3.25) lacks the BUILD_LOCAL_INTERFACE (3.26) OpenAL Soft's CMakeLists.txt links its {fmt} with.
platforms: [linux-x64, linux-arm64, linux-musl-*, win-*, osx-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        library-type: -DLIBTYPE=SHARED
        shared-args:
          [
            -DALSOFT_STATIC_STDCXX=ON,
            '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,defs,--exclude-libs,libasound.a',
          ]
        shared-mode: 'yes'
      runtime: ['lib/libopenal.so*']
build:
  # OpenAL Soft, static, for FFmpeg's openal input device (capture). No utilities, examples, tests, sample
  # configuration, HRTF data or presets, and no C++20 modules. Backends: linked ALSA (and OSS) on Linux;
  # WASAPI, DirectSound and WinMM on Windows; Core Audio on macOS. A C++ library: its .pc gets the
  # C++ runtime a static link needs.
  system: cmake
  vars: { library-type: -DLIBTYPE=STATIC, shared-args: [], shared-mode: '' }
  args:
    [
      '{library-type}',
      '{shared-args}',
      -DALSOFT_UTILS=OFF,
      -DALSOFT_EXAMPLES=OFF,
      -DALSOFT_TESTS=OFF,
      -DALSOFT_INSTALL_CONFIG=OFF,
      -DALSOFT_INSTALL_HRTF_DATA=OFF,
      -DALSOFT_INSTALL_AMBDEC_PRESETS=OFF,
      -DALSOFT_INSTALL_EXAMPLES=OFF,
      -DALSOFT_INSTALL_UTILS=OFF,
      -DALSOFT_UPDATE_BUILD_VERSION=OFF,
      -DALSOFT_ENABLE_MODULES=OFF,
      -DALSOFT_BACKEND_PIPEWIRE=OFF,
      -DALSOFT_BACKEND_PULSEAUDIO=OFF,
      -DALSOFT_BACKEND_JACK=OFF,
      -DALSOFT_BACKEND_SNDIO=OFF,
      -DALSOFT_BACKEND_PORTAUDIO=OFF,
      -DALSOFT_BACKEND_SDL2=OFF,
      -DALSOFT_BACKEND_SDL3=OFF,
    ]
  platforms:
    'linux-*':
      args: [-DALSOFT_REQUIRE_ALSA=ON, -DALSOFT_DLOPEN=OFF]
      after:
        - edit-pkg-config:
            { path: '{deps}/lib/pkgconfig/openal.pc', requires-private: { add: alsa } }
    # its .pc leaves out the Windows libraries a static link needs: COM's (ole32), the known folders' (shell32, uuid)
    'win-*':
      after:
        - edit-pkg-config:
            {
              path: '{deps}/lib/pkgconfig/openal.pc',
              libs-private: { add: -lole32 -lshell32 -luuid },
            }
  before:
    # alc.cpp passes &EffectSlotCluster::operator* (a std::unique_ptr's) to views::transform, which a newer libc++
    # (llvm-mingw's, win-arm64) can't deduce: a lambda dereferences the same
    - replace-in-file:
        {
          path: alc/alc.cpp,
          from: 'std::views::transform(&ContextBase::EffectSlotCluster::operator*)',
          to: 'std::views::transform([](auto &cluster) -> auto& { return *cluster; })',
        }
  after:
    - edit-pkg-config:
        { path: '{deps}/lib/pkgconfig/openal.pc', libs-private: { append: '{cxx-runtime}' } }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'openal-soft', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
