name: openh264
provides: openh264
license: BSD-2-Clause
license-files: [LICENSE]
configure: [--enable-libopenh264]
source: { git: https://github.com/cisco/openh264.git, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-arg: --default-library=shared
        runtime-link-arg: "-Dcpp_link_args=['-static-libstdc++','-shared-libgcc','-Wl,--exclude-libs,libstdc++.a:libgcc.a']"
      runtime: ['lib/libopenh264.so*']
build:
  system: meson
  vars: { shared-arg: [], runtime-link-arg: [] }
  args: [-Dtests=disabled, '{shared-arg}', '{runtime-link-arg}']
  after:
    # openh264's meson build doesn't reliably install a pkg-config file FFmpeg finds;
    # write one (FFmpeg's configure requires openh264 >= 1.3.0). pkg-config Version:
    # is conventionally bare (no leading 'v'), as {version} is (the tag's number).
    - pkg-config:
        name: openh264
        description: OpenH264 — Cisco H.264 codec
        version: '{version}'
        libs: -lopenh264
        libs-private: -lstdc++ -lm
