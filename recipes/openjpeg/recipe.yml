name: openjpeg
provides: openjpeg
license: BSD-2-Clause
license-files: [LICENSE]
configure: [--enable-libopenjpeg]
source: { git: https://github.com/uclouvain/openjpeg.git, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-library-arg: -DBUILD_SHARED_LIBS=ON, shared-mode: 'yes' }
      runtime: ['lib/libopenjp2.so*']
build:
  system: cmake
  vars: { shared-library-arg: [], shared-mode: '' }
  args: ['{shared-library-arg}', -DBUILD_CODEC=OFF, -DBUILD_TESTING=OFF]
  after:
    - edit-pkg-config:
        path: '{deps}/lib/pkgconfig/libopenjp2.pc'
        optional: true
        libs-private:
          tokens: { '-l-lpthread': -lpthread, '-l-pthread': -pthread }
    # OpenJPEG 2.5.x emits a malformed Libs.private in libopenjp2.pc — its CMake prepends -l to an
    # already-complete thread flag, giving "-l-lpthread" (glibc, thread lib = -lpthread) or
    # "-l-pthread" (NDK/others, thread flag = -pthread). FFmpeg's static pkg-config link test then
    # looks for a library literally named "-lpthread"/"-pthread" and fails ("libopenjp2 not found").
    # Repair both forms in place (a no-op where the token isn't emitted).
    # pkgconf --static also adds Cflags.private for a shared consumer. OPJ_STATIC
    # declares those imported functions hidden on ELF, so their DSO cannot satisfy
    # the link. Keep it for static builds and remove it only in shared mode.
    - edit-pkg-config:
        path: '{deps}/lib/pkgconfig/libopenjp2.pc'
        cflags-private: { remove: -DOPJ_STATIC }
      when: { set: '{shared-mode}' }
