name: opus
provides: opus
license: BSD-3-Clause
license-files: [COPYING, LICENSE_PLEASE_READ.txt]
configure: [--enable-libopus]
source: { git: https://github.com/xiph/opus, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+(?:\.\d+)?)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-library-arg: '-DBUILD_SHARED_LIBS=ON' }
      runtime: ['lib/libopus.so*']
    system-shared:
      platforms: [linux-x64]
      vars: { shared-library-arg: '-DBUILD_SHARED_LIBS=ON' }
      runtime: ['lib/libopus.so*']
      packages: { debian: [libopus0], ubuntu: [libopus0], fedora: [opus] }
build:
  system: cmake
  vars: { shared-library-arg: [] }
  args: ['{shared-library-arg}', -DOPUS_BUILD_TESTING=OFF, -DOPUS_BUILD_PROGRAMS=OFF]
  platforms:
    win-arm64: { args: [-DOPUS_DISABLE_INTRINSICS=ON] }
