name: pango
license: LGPL-2.0-or-later
license-files: [COPYING]
needs:
  - glib
  - fribidi
  - harfbuzz
  - cairo
  - { freetype: { platforms: [linux-*, android-*] } }
  - { fontconfig: { platforms: [linux-*, android-*] } }
source:
  {
    git: https://gitlab.gnome.org/GNOME/pango.git,
    ref: '{version}',
    mirror: https://github.com/GNOME/pango.git,
  }
# 1.56: 1.58 needs GLib 2.88, and GLib stays at 2.86 for win-x64's mingw-w64 (recipes/glib); move on with it
versions: { git-tags: '^(1\.56\.\d+)$' }
# only librsvg builds against it. Not on Apple: on macOS Pango's Core Text backend needs HarfBuzz built with Core
# Text, which the shared harfbuzz recipe isn't (changing it would change every shipped macOS build's libass); on iOS
# and Mac Catalyst it links ApplicationServices, which they haven't got.
platforms: [linux-*, win-*, android-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      requires-link: { glib: [shared], cairo: [shared], fontconfig: [shared], harfbuzz: [shared] }
      vars:
        shared-mode: 'yes'
        shared-args:
          [--default-library=shared, '-Dc_link_args=-Wl,-z,defs,--exclude-libs,libfribidi.a -lm']
      runtime: ['lib/libpango-1.0.so*', 'lib/libpangoft2-1.0.so*', 'lib/libpangocairo-1.0.so*']
build:
  # Pango: text layout (LGPL-2.0-or-later), static, for librsvg's text. On cairo, with HarfBuzz and FriBidi, and the
  # platform's fonts: FreeType and Fontconfig (pangoft2) on Linux and Android, where Pango requires them; Windows'
  # and Windows' own (DirectWrite) there. No introspection, docs, tests, examples, libthai, Xft or sysprof.
  system: meson
  vars: { shared-mode: '', shared-args: [] }
  args:
    [
      '{shared-args}',
      --wrap-mode=nofallback,
      -Dintrospection=disabled,
      -Ddocumentation=false,
      -Dman-pages=false,
      -Dbuild-testsuite=false,
      -Dbuild-examples=false,
      -Dsysprof=disabled,
      -Dlibthai=disabled,
      -Dxft=disabled,
      -Dcairo=enabled,
    ]
  # Its enum sources come from GLib's glib-mkenums, a program for the build machine: a cross build finds the Python
  # script GLib installed in deps (else Meson would fall back to building GLib again, as a subproject).
  env: { PATH: '{deps}/bin:{PATH}' }
  # LLVM's unused-but-set-global warning also covers GLib's generated parent-class
  # variable. Keep that diagnostic visible without promoting it to an error.
  platforms:
    'linux-*': { args: [-Dfontconfig=enabled, -Dfreetype=enabled] }
    'android-*': { args: [-Dfontconfig=enabled, -Dfreetype=enabled] }
    'win-*': { args: [-Dfontconfig=disabled, -Dfreetype=disabled] }
    win-arm64: { args: ['-Dc_args=-Wno-error=unused-but-set-global'] }
