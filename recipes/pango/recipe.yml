name: pango
license: LGPL-2.0-or-later
license-files: [COPYING]
needs:
  - glib
  - fribidi
  - harfbuzz
  - cairo
  - { freetype: { platforms: [linux-*, android-*] } }
  - { fontconfig: { platforms: [linux-*, android-*] } }
source:
  {
    git: https://gitlab.gnome.org/GNOME/pango.git,
    ref: '{version}',
    mirror: https://github.com/GNOME/pango.git,
  }
# 1.56: 1.58 needs GLib 2.88, and GLib stays at 2.86 for win-x64's mingw-w64 (recipes/glib); move on with it
versions: { git-tags: '^(1\.56\.\d+)$' }
# only librsvg builds against it. Not iOS or Mac Catalyst: Pango's Apple backend links ApplicationServices, which
# they haven't got, and its Fontconfig backend there would need cairo's (cairo's Quartz is macOS-only).
platforms: [linux-*, win-*, osx-*, android-*]
build:
  # Pango: text layout (LGPL-2.0-or-later), static, for librsvg's text. On cairo, with HarfBuzz and FriBidi, and the
  # platform's fonts: FreeType and Fontconfig (pangoft2) on Linux and Android, where Pango requires them; Windows'
  # and Core Text's own elsewhere. No introspection, docs, tests, examples, libthai, Xft or sysprof.
  system: meson
  args:
    [
      --wrap-mode=nofallback,
      -Dintrospection=disabled,
      -Ddocumentation=false,
      -Dman-pages=false,
      -Dbuild-testsuite=false,
      -Dbuild-examples=false,
      -Dsysprof=disabled,
      -Dlibthai=disabled,
      -Dxft=disabled,
      -Dcairo=enabled,
    ]
  # Its enum sources come from GLib's glib-mkenums, a program for the build machine: a cross build finds the Python
  # script GLib installed in deps (else Meson would fall back to building GLib again, as a subproject).
  env: { PATH: '{deps}/bin:{PATH}' }
  # Its Fontconfig font map calls FcFreeTypeQueryAll, declared in fontconfig/fcfreetype.h, which 1.56 doesn't include
  # (older Fontconfig headers brought it in by the way): included.
  before:
    - replace-in-file:
        {
          path: pango/pangofc-fontmap.c,
          from: "#include <hb-ft.h>\n",
          to: "#include <hb-ft.h>\n#include <fontconfig/fcfreetype.h>\n",
          optional: true,
        }
    # newer clangs (llvm-mingw's) put -Wunused-but-set-global under -Wunused-but-set-variable, and GObject's type
    # macros trip it; Pango makes that warning an error: a warning again
    - replace-in-file:
        {
          path: meson.build,
          from: "'-Werror=unused-but-set-variable',",
          to: "'-Wunused-but-set-variable',",
        }
  platforms:
    'linux-*': { args: [-Dfontconfig=enabled, -Dfreetype=enabled] }
    'android-*': { args: [-Dfontconfig=enabled, -Dfreetype=enabled] }
    'win-*': { args: [-Dfontconfig=disabled, -Dfreetype=disabled] }
    'osx-*': { args: [-Dfontconfig=disabled, -Dfreetype=disabled] }
