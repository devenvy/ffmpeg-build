name: quirc
provides: quirc
license: ISC
license-files: [LICENSE]
# FFmpeg finds it with a plain -lquirc probe (no pkg-config); the library calls the maths library (sqrt)
configure: [--enable-libquirc, --extra-libs=-lm]
source: { git: https://github.com/dlbeer/quirc, ref: 'v{version}' }
# The native object list below is reviewed against this release's LIB_OBJ.
versions: { git-tags: '^v(1\.2)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        static-mode: ''
        shared-mode: yes
        library-file: 'libquirc.so.{version}'
      runtime: ['lib/libquirc.so*']
build:
  # Native Makefile object rules; its archive rule hardcodes host tools, so execute the same native
  # archive sequence with the selected cross AR/RANLIB. No source edits or substitute build description.
  system: none
  vars:
    tools: ''
    static-mode: yes
    shared-mode: ''
    library-file: libquirc.a
    objects: [lib/decode.o, lib/identify.o, lib/quirc.o, lib/version_db.o]
  before:
    - vars: { tools: '{host}-' }
      when: { set: '{host}' }
    - vars:
        make-args:
          ['CC={CC|{tools}gcc}', 'CFLAGS=-O2 -fPIC {CFLAGS|}', 'SDL_CFLAGS=', 'OPENCV_CFLAGS=']
  steps:
    - [make, '-j{jobs}', '{make-args}', '{objects}']
    - remove: { path: libquirc.a }
      when: { set: '{static-mode}' }
    - run: ['{AR|{tools}ar}', cru, libquirc.a, '{objects}']
      when: { set: '{static-mode}' }
    - run: ['{RANLIB|{tools}ranlib}', libquirc.a]
      when: { set: '{static-mode}' }
    # Upstream's shared target honors LDFLAGS but sets no SONAME. Use the complete release version as
    # the packaging ABI name through its native linker flags, without changing its Makefile.
    - run:
        [
          make,
          libquirc.so,
          '{make-args}',
          'LDFLAGS={LDFLAGS|} -Wl,-soname,libquirc.so.{version} -Wl,-z,defs',
        ]
      when: { set: '{shared-mode}' }
    - copy: { from: '{library-file}', into: '{deps}/lib' }
    - copy: { from: '{library-file}', to: '{deps}/lib/libquirc.so' }
      when: { set: '{shared-mode}' }
    - copy: { from: lib/quirc.h, into: '{deps}/include' }
