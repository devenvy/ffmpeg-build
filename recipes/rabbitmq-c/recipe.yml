name: rabbitmq-c
provides: rabbitmq
license: MIT
license-files: [LICENSE]
configure: [--enable-librabbitmq]
source: { git: https://github.com/alanxz/rabbitmq-c, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
build:
  # rabbitmq-c: an AMQP 0-9-1 client (MIT), static, for FFmpeg's amqp protocol (libamqp; found through librabbitmq.pc,
  # 0.7.1 or later). Without SSL: FFmpeg's protocol opens plain TCP sockets only (amqp_tcp_socket_new). The library
  # alone: no tools, examples, docs or tests.
  system: cmake
  args:
    [
      -DBUILD_STATIC_LIBS=ON,
      -DINSTALL_STATIC_LIBS=ON,
      -DENABLE_SSL_SUPPORT=OFF,
      -DBUILD_EXAMPLES=OFF,
      -DBUILD_TOOLS=OFF,
      -DBUILD_API_DOCS=OFF,
      -DBUILD_TESTING=OFF,
    ]
  after:
    # its headers export through AMQP_STATIC (dllimport on Windows without it), which the static library's CMake
    # target carries but librabbitmq.pc doesn't
    - edit-pkg-config:
        { path: '{deps}/lib/pkgconfig/librabbitmq.pc', cflags: { add: -DAMQP_STATIC } }
