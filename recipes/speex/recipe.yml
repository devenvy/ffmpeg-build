name: speex
provides: speex
license: BSD-3-Clause
license-files: [COPYING]
configure: [--enable-libspeex]
source: { git: https://github.com/xiph/speex, ref: 'Speex-{version}' }
versions: { git-tags: '^Speex-(\d+\.\d+(?:\.\d+)*)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-arg: --enable-shared, static-arg: --disable-static }
      runtime: ['lib/libspeex.so*']
build:
  system: autotools
  vars: { shared-arg: --disable-shared, static-arg: --enable-static }
  args: ['{shared-arg}', '{static-arg}', --with-pic, --disable-binaries]
  # The git tree ships no generated configure — regenerate it (autoconf/automake/libtool are in
  # the build env). Xiph's autogen.sh runs autoreconf; run it quietly, and autoreconf -fi if it fails.
  bootstrap: [autogen, autoreconf]
