name: spirv-headers
license: MIT
license-files: [LICENSE, LICENSES/MIT.txt]
source: { git: https://github.com/KhronosGroup/SPIRV-Headers, ref: 'vulkan-sdk-{version}' }
versions: { git-tags: '^vulkan-sdk-(\d+\.\d+\.\d+\.\d+)$' }
# released together as one Vulkan SDK: the lock gives all three one SDK version (devenvy/ffmpeg's Renovate rule did too)
version-group: vulkan-sdk
# Upstream: WHISPER_BACKEND == vulkan or BUILD_VULKAN. whisper needs it only for its Vulkan backend (linux, Windows,
# Android); Apple whisper uses Metal. The Apple entries are for FFmpeg's Vulkan (MoltenVK).
platforms: [linux-*, win-*, osx-*, ios-arm64, maccatalyst-*, android-*]
build:
  # Header-only, but the standard install also provides SPIRV-HeadersConfig.cmake for ggml-vulkan.
  system: cmake
