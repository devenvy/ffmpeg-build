name: sratom
license: ISC
license-files: [COPYING]
needs: [serd, sord, lv2]
source: { git: https://github.com/lv2/sratom, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
# only lilv builds against it
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        shared-args:
          - --default-library=shared
          - '-Dc_link_args=-Wl,-z,defs,--exclude-libs,libserd-0.a:libsord-0.a:libsratom-0.a:libzix-0.a'
      runtime: ['lib/libsratom-0.so*']
build:
  # Sratom: LV2 atoms to and from RDF (ISC), static, for lilv (FFmpeg's lv2 filter). The library alone: no docs or
  # tests.
  system: meson
  vars: { shared-args: [], shared-mode: '' }
  args: ['{shared-args}', -Ddocs=disabled, -Dtests=disabled]
  after:
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'sratom', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
