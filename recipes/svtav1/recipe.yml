name: svtav1
provides: svtav1
license: BSD-3-Clause-Clear
license-files:
  [
    LICENSE.md,
    LICENSE-BSD2.md,
    PATENTS.md,
    third_party/fastfeat/LICENSE,
    third_party/safestringlib/LICENSE,
  ]
configure: [--enable-libsvtav1]
source:
  {
    git: https://gitlab.com/AOMediaCodec/SVT-AV1.git,
    ref: 'v{version}',
    mirror: https://github.com/AOMediaCodec/SVT-AV1.git,
  }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
# Not linux-armhf (SVT-AV1 requires 64-bit), win-arm64 (x86-only asm), android-* / ios-* / maccatalyst-* (its
# static-archive step fails cross-compiling); AV1 encode is covered by libaom there.
platforms: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-*, win-x64]
build:
  system: cmake
  args: [-DBUILD_APPS=OFF, -DBUILD_DEC=OFF, -DBUILD_TESTING=OFF]
  platforms:
    win-x64:
      args:
        [
          '-DCMAKE_C_FLAGS=-static-libgcc -O2',
          '-DCMAKE_CXX_FLAGS=-static-libgcc -static-libstdc++ -O2',
        ]
