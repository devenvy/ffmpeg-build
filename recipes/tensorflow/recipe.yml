name: tensorflow
provides: tensorflow
license: >-
  Apache-2.0 AND OpenSSL AND ISC AND MIT AND BSD-2-Clause AND BSD-3-Clause
  AND MPL-2.0 AND (Apache-2.0 WITH LLVM-exception) AND NCSA AND CC0-1.0
  AND Unicode-DFS-2016 AND ICU AND IJG AND Zlib AND libpng-2.0 AND curl
  AND LicenseRef-Ooura-FFT AND LicenseRef-SQLite-public-domain
  AND (GPL-3.0-or-later WITH GCC-exception-3.1)
license-files:
  - LICENSE
  - _ffb-notices/runtime.txt
  - _ffb-notices/tool-inputs.txt
  - { recipe: BUILD-NOTICE.txt }
configure: [--enable-libtensorflow]
source: { git: https://github.com/tensorflow/tensorflow.git, ref: 'v{version}' }
# Review inputs.json, the actual static owner closure and its notices together.
versions: { git-tags: '^v(2\.21\.0)$' }
platforms: [linux-x64]
linkage:
  default: static
  modes:
    static:
      configure: ['--extra-libs=@{deps}/lib/ffb-tensorflow-static.rsp']
      conflicts-link:
        onnxruntime:
          modes: [static]
          platforms: [linux-x64]
          reason: 'These libraries retain incompatible native Protobuf runtimes. Select shared for either owner.'
    shared:
      platforms: [linux-x64]
      vars: { build-mode: shared }
      runtime: ['lib/libtensorflow.so*']
build:
  system: none
  vars: { build-mode: static }
  source-inventory: ffb-source-inputs.json
  steps:
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'tensorflow', 'build.py'), run_name='__main__')"
        - '{build-mode}'
