name: tesseract
provides: tesseract
license: Apache-2.0
license-files: [LICENSE]
configure: [--enable-libtesseract]
needs: [leptonica, { cpu-features: { platforms: [android-*] } }]
source: { git: https://github.com/tesseract-ocr/tesseract, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      requires-link: { leptonica: [shared] }
      vars:
        shared-mode: 'yes'
        shared-args:
          [
            -DBUILD_SHARED_LIBS=ON,
            '-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -shared-libgcc -Wl,-z,defs',
          ]
      runtime: ['lib/libtesseract.so*']
build:
  # Tesseract: OCR (Apache-2.0, so v3 builds only), static, for FFmpeg's ocr filter (found through tesseract.pc, by
  # its C API). C++, on Leptonica. The library alone: no training tools, tests, ScrollView graphics, OpenMP, curl
  # (URLs as input), libarchive or TIFF, and without its language data: the filter reads trained data (tessdata,
  # downloaded apart) from its datapath option or TESSDATA_PREFIX. Its SIMD paths are chosen at run time, so no -march
  # for the build machine (ENABLE_NATIVE off).
  #
  # Its .pc names no Leptonica, C++ runtime or libm, which a static link needs.
  system: cmake
  # Supply standard library headers through the compiler's native preinclude option; no authored compatibility code.
  env: { CXXFLAGS: '+= -include string -include cstdlib' }
  vars: { shared-mode: '', shared-args: [] }
  args:
    [
      '{shared-args}',
      -DBUILD_TRAINING_TOOLS=OFF,
      -DBUILD_TESTS=OFF,
      -DGRAPHICS_DISABLED=ON,
      -DOPENMP_BUILD=OFF,
      -DDISABLE_CURL=ON,
      -DDISABLE_ARCHIVE=ON,
      -DDISABLE_TIFF=ON,
      -DENABLE_NATIVE=OFF,
      -DINSTALL_CONFIGS=OFF,
      -DENABLE_CCACHE=OFF,
      -DENABLE_PRECOMPILED_HEADERS=OFF,
    ]
  # Its check whether Leptonica has TIFF runs a program (try_run), which a cross build can't (and armhf's CMake 3.25
  # crashed on): without TIFF here anyway, the check goes.
  #
  # On Windows it links Winsock as "Ws2_32", which only a case-insensitive file system finds (mingw's is libws2_32.a).
  before:
    - replace-in-file: { path: CMakeLists.txt, from: "check_leptonica_tiff_support()\n", to: '' }
    - replace-in-file:
        { path: CMakeLists.txt, from: set(LIB_Ws2_32 Ws2_32), to: set(LIB_Ws2_32 ws2_32) }
    # its NEON code is chosen by CMAKE_SYSTEM_PROCESSOR, matched case-sensitively: win-arm64's toolchain file says
    # ARM64, so the NEON sources weren't compiled though simddetect.cpp (by __aarch64__) calls them
    - replace-in-file:
        {
          path: CMakeLists.txt,
          from: 'MATCHES "arm64|aarch64.*|AARCH64.*"',
          to: 'MATCHES "arm64|ARM64|aarch64.*|AARCH64.*"',
        }
  platforms:
    # the NDK's toolchain file finds packages only under its root paths: Leptonica's and cpu_features' CMake configs
    # are in deps
    'android-*': { args: ['-DCMAKE_FIND_ROOT_PATH={deps}'] }
    'win-*':
      after:
        - edit-pkg-config:
            { path: '{deps}/lib/pkgconfig/tesseract.pc', libs-private: { add: -lws2_32 } }
  after:
    - edit-pkg-config:
        {
          path: '{deps}/lib/pkgconfig/tesseract.pc',
          requires-private: { add: lept },
          libs-private: { set: '{cxx-runtime} -lm', missing: after-libs },
        }
    # Static SDK consumers need the thread runtime that FFmpeg itself already links.
    - edit-pkg-config:
        { path: '{deps}/lib/pkgconfig/tesseract.pc', libs-private: { add: -pthread } }
      when: { platforms: [linux-*] }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'tesseract', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CXX|g++}'
      when: { set: '{shared-mode}' }
