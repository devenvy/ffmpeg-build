name: tesseract
provides: tesseract
license: Apache-2.0
license-files: [LICENSE]
configure: [--enable-libtesseract]
needs: [leptonica]
source: { git: https://github.com/tesseract-ocr/tesseract, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      requires-link: { leptonica: [shared] }
      vars:
        shared-mode: 'yes'
        shared-arg: --enable-shared
        static-arg: --disable-static
        link-args: ['LDFLAGS={LDFLAGS|} -static-libstdc++ -shared-libgcc -Wl,-z,defs']
      runtime: ['lib/libtesseract.so*']
build:
  # Tesseract: OCR (Apache-2.0, so v3 builds only), static, for FFmpeg's ocr filter (found through tesseract.pc, by
  # its C API). C++, on Leptonica. The library alone: no training tools, tests, ScrollView graphics, OpenMP, curl
  # (URLs as input), libarchive or TIFF, and without its language data: the filter reads trained data (tessdata,
  # downloaded apart) from its datapath option or TESSDATA_PREFIX. Its SIMD paths are chosen at run time, so no -march
  # for the build machine.
  #
  # Use its native Autotools ARM/MinGW detection and library-only install targets. No CMake try_run or source edits.
  system: autotools
  # Supply standard library headers through the compiler's native preinclude option; no authored compatibility code.
  env: { CXXFLAGS: '+= -include string -include cstdlib' }
  vars:
    { shared-mode: '', shared-arg: --disable-shared, static-arg: --enable-static, link-args: [] }
  args:
    [
      '{shared-arg}',
      '{static-arg}',
      --with-pic,
      --disable-graphics,
      --disable-doc,
      --without-archive,
      --without-curl,
      --disable-openmp,
      '{link-args}',
    ]
  before:
    - [sh, autogen.sh]
  make-targets: [libtesseract.la]
  install-targets: [install-libLTLIBRARIES, install-pkgincludeHEADERS, install-pkgconfigDATA]
  platforms:
    'osx-*': &accelerate
      after:
        - edit-pkg-config:
            {
              path: '{deps}/lib/pkgconfig/tesseract.pc',
              libs-private: { add: '-framework Accelerate' },
            }
    'ios-*': *accelerate
    'maccatalyst-*': *accelerate
    'win-*':
      after:
        - edit-pkg-config:
            { path: '{deps}/lib/pkgconfig/tesseract.pc', libs-private: { add: -lws2_32 } }
  after:
    - edit-pkg-config:
        {
          path: '{deps}/lib/pkgconfig/tesseract.pc',
          requires-private: { add: lept },
          libs-private: { set: '{cxx-runtime} -lm', missing: after-libs },
        }
    # Static SDK consumers need the thread runtime that FFmpeg itself already links.
    - edit-pkg-config:
        { path: '{deps}/lib/pkgconfig/tesseract.pc', libs-private: { add: -pthread } }
      when: { platforms: [linux-*] }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'tesseract', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CXX|g++}'
      when: { set: '{shared-mode}' }
