name: uavs3d
provides: uavs3d
license: BSD-3-Clause
license-files: [COPYING]
configure: [--enable-libuavs3d]
source: { git: https://github.com/uavs3/uavs3d, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+)$' }
# Not win-arm64: its AArch64 assembly is ELF-only. Android uses the native
# 8-bit NDK module on ARM64; its x64 NDK module forces an AVX2 baseline.
platforms: [linux-*, win-x64, osx-*, ios-*, maccatalyst-*, android-arm64]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        shared-args:
          - -DBUILD_SHARED_LIBS=ON
          - '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,defs -Wl,--version-script={src}/ffb-public-api.map'
      runtime: ['lib/libuavs3d.so*']
build:
  # uavs3d: AVS3 video decoder (BSD-3-Clause), static, 8- and 10-bit, for FFmpeg's libuavs3d decoder (found through
  # uavs3d.pc, 1.1.41 or later: version.sh writes 1.2.<commits in the clone>). Its decoder program, never installed,
  # is left out of the build (on iOS and Mac Catalyst it is an app that doesn't link).
  system: none
  vars: { shared-mode: '', shared-args: [], ndk-build: '' }
  args: [-DCOMPILE_10BIT=1, '{shared-args}']
  steps:
    - run:
        [
          cmake,
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5,
          -B,
          _build,
          -S,
          .,
          -DCMAKE_BUILD_TYPE=Release,
          '-DCMAKE_INSTALL_PREFIX={deps}',
          -DCMAKE_INSTALL_LIBDIR=lib,
          '-DCMAKE_PREFIX_PATH={deps}',
          -DBUILD_SHARED_LIBS=OFF,
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON,
          '{cmake-cross-args}',
          '{args}',
        ]
      when: { unset: '{ndk-build}' }
    - run: [cmake, --build, _build, '-j{jobs}', --target, uavs3d]
      when: { unset: '{ndk-build}' }
    - run: [cmake, --install, _build]
      when: { unset: '{ndk-build}' }
  before:
    - run:
        - python3
        - -c
        - "import os, shutil, sys; shutil.copyfile(os.path.join(os.environ['RECIPES'], 'uavs3d', 'exports.map'), sys.argv[1])"
        - '{src}/ffb-public-api.map'
      when: { set: '{shared-mode}' }
  after:
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'uavs3d', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-public-api'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
  platforms:
    # Upstream documents this native NDK route, which does not link -lpthread.
    # Its hardcoded configuration is 8-bit; preserve it without Makefile edits.
    android-arm64:
      vars: { ndk-build: yes }
      before:
        - [sh, ./version.sh]
        - run:
            [
              '{ANDROID_NDK_HOME}/ndk-build',
              'NDK_PROJECT_PATH={src}/build/android/ndk',
              'APP_BUILD_SCRIPT={src}/build/android/ndk/jni/Android.mk',
              'NDK_APPLICATION_MK={src}/build/android/ndk/jni/Application.mk',
              APP_ABI=arm64-v8a,
              'APP_PLATFORM=android-{API}',
              APP_MODULES=uavs3d-static,
              APP_OPTIM=release,
              'APP_CFLAGS={CFLAGS|} -ffile-prefix-map={src}=/work/src/uavs3d',
              'NDK_OUT={src}/_ndk/obj',
              'NDK_LIBS_OUT={src}/_ndk/libs',
              '-j{jobs}',
              V=1,
            ]
          cwd: build/android/ndk/jni
        - copy: { from: _ndk/obj/local/arm64-v8a/libuavs3d.a, into: '{deps}/lib' }
        - copy: { from: source/decoder/uavs3d.h, into: '{deps}/include' }
        - pkg-config:
            name: uavs3d
            description: AVS3 decoder library, native Android 8-bit module
            version: '{version}'
            libs: -luavs3d
            libs-private: -lm -llog
