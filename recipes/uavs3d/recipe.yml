name: uavs3d
provides: uavs3d
license: BSD-3-Clause
license-files: [COPYING]
configure: [--enable-libuavs3d]
source: { git: https://github.com/uavs3/uavs3d, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+)$' }
# Not win-arm64: its AArch64 assembly is ELF-only.
platforms: [linux-*, win-x64, osx-*, ios-*, maccatalyst-*, android-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        shared-args:
          - -DBUILD_SHARED_LIBS=ON
          - '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,defs -Wl,--version-script={src}/ffb-public-api.map'
      runtime: ['lib/libuavs3d.so*']
build:
  # uavs3d: AVS3 video decoder (BSD-3-Clause), static, 8- and 10-bit, for FFmpeg's libuavs3d decoder (found through
  # uavs3d.pc, 1.1.41 or later: version.sh writes 1.2.<commits in the clone>). Its decoder program, never installed,
  # is left out of the build (on iOS and Mac Catalyst it is an app that doesn't link).
  system: cmake
  build-targets: [uavs3d]
  vars: { shared-mode: '', shared-args: [] }
  args: [-DCOMPILE_10BIT=1, '{shared-args}']
  before:
    - run:
        - python3
        - -c
        - "import os, shutil, sys; shutil.copyfile(os.path.join(os.environ['RECIPES'], 'uavs3d', 'exports.map'), sys.argv[1])"
        - '{src}/ffb-public-api.map'
      when: { set: '{shared-mode}' }
    # Upstream has no SONAME version. Use an engine-defined full-version ABI
    # name, making no compatibility promise about distro packages.
    - replace-in-file:
        path: source/CMakeLists.txt
        from: 'add_library(${LIBNAME} ${DIR_UAVS3D_SRC} ${UAVS3D_ASM_FILES})'
        to: "add_library(${LIBNAME} ${DIR_UAVS3D_SRC} ${UAVS3D_ASM_FILES})\nset_target_properties(uavs3d PROPERTIES VERSION {version} SOVERSION {version})"
      when: { set: '{shared-mode}' }
  after:
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'uavs3d', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-public-api'
        - '{CC|gcc}'
        - '{version}'
      when: { set: '{shared-mode}' }
  platforms:
    # Android's C library has the threads; there is no libpthread to link (its CMake links one, and its .pc names it)
    'android-*':
      before:
        - replace-in-file:
            { path: source/CMakeLists.txt, from: if(CMAKE_USE_PTHREADS_INIT), to: if(FALSE) }
