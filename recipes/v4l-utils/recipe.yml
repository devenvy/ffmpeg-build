name: v4l-utils
provides: v4l2
# libv4l (libv4l2 and libv4lconvert), what is built of v4l-utils
license: LGPL-2.1-or-later
license-files: [COPYING.libv4l, COPYING]
configure: [--enable-libv4l2]
source:
  url: 'https://linuxtv.org/downloads/v4l-utils/v4l-utils-{version}.tar.xz'
versions:
  {
    listing: 'https://linuxtv.org/downloads/v4l-utils/',
    files: '^v4l-utils-(\d+\.\d+\.\d+)\.tar\.xz$',
  }
platforms: [linux-*]
notes:
  '>=1.32.0': >-
    OV511/OV518 conversion requires independent system helpers at
    /usr/lib/libv4l/ov511-decomp and /usr/lib/libv4l/ov518-decomp.
    They are GPL-2.0-only programs, with BSD-2-Clause utility code;
    they are neither linked into FFmpeg nor bundled in its runtime archive.
    Other native software conversions do not need these programs.
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-mode: 'yes', library-arg: --default-library=shared }
      runtime: ['lib/libv4l1.so*', 'lib/libv4l2.so*', 'lib/libv4lconvert.so*', 'lib/libv4l2rds.so*']
build:
  # libv4l2 and libv4lconvert (LGPL-2.1-or-later), static, for FFmpeg's v4l2 input device (its use_libv4l2 option:
  # libv4l's format conversion, for cameras whose formats FFmpeg doesn't take). The libraries alone: no tools,
  # device plugins in either mode, LD_PRELOAD wrappers, libdvbv5, JPEG decoding (MJPEG cameras convert
  # without it in FFmpeg itself) or docs.
  system: meson
  env: { DESTDIR: '{src}/_stage' }
  vars: { shared-mode: '', library-arg: [] }
  args:
    [
      '{library-arg}',
      --prefix=/usr,
      -Dauto_features=disabled,
      -Dv4l-utils=false,
      -Dv4l-plugins=false,
      -Dv4l-wrappers=false,
      -Ddoxygen-doc=disabled,
    ]
  platforms:
    # musl's ioctl takes an int request (POSIX's), and libv4l2 is built so (its config.h's LIBV4L_HAVE_POSIX_IOCTL);
    # its installed header only says so when the user defines that, and declares glibc's unsigned long otherwise, which
    # FFmpeg's v4l2 device (whose ioctl pointer is POSIX's on musl) can't take
    'linux-musl-*':
      after:
        - edit-pkg-config:
            { path: '{deps}/lib/pkgconfig/libv4l2.pc', cflags: { add: -DLIBV4L_HAVE_POSIX_IOCTL } }
  after:
    - copy: { from: '{src}/_stage/usr', to: '{deps}', recursive: true, preserve: true }
    - edit-pkg-config:
        path: '{deps}/lib/pkgconfig/libv4l*.pc'
        variables: { prefix: '{deps}' }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'v4l-utils', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{CC|gcc}'
        - '{shared-mode}'
      when: { platforms: [linux-x64] }
