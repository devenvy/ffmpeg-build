name: vulkan-headers
license: Apache-2.0 OR MIT
license-files: [LICENSE.md, LICENSES/Apache-2.0.txt, LICENSES/MIT.txt]
# FFmpeg's flag where these headers are the vulkan option's library (Windows, linux-armhf, Android: FFmpeg loads the
# system's Vulkan library at run time)
configure: [--enable-vulkan]
# FFmpeg's Vulkan code also needs the SPIR-V headers (swscale's SPIR-V backend); upstream installs both together.
needs: [spirv-headers]
source: { git: https://github.com/KhronosGroup/Vulkan-Headers, ref: 'vulkan-sdk-{version}' }
versions: { git-tags: '^vulkan-sdk-(\d+\.\d+\.\d+\.\d+)$' }
# released together as one Vulkan SDK: the lock gives all three one SDK version (devenvy/ffmpeg's Renovate rule did too)
version-group: vulkan-sdk
# Wherever upstream sets BUILD_VULKAN (v3 cells): every platform but the lean ios-sim-arm64 slice.
platforms: [linux-*, win-*, osx-*, ios-arm64, maccatalyst-*, android-*]
build:
  # Vulkan-Headers: Khronos Vulkan API headers (Apache-2.0 OR MIT) for FFmpeg's Vulkan filters/hwaccel and whisper's
  # GPU backend, header-only. Ported from devenvy/ffmpeg scripts/deps/vulkan-headers.sh. vulkan.pc's version is the
  # newest API version the headers define (1.4, else 1.3) and their header revision.
  system: cmake
  after:
    - read:
        file: '{deps}/include/vulkan/vulkan_core.h'
        pattern: '^#define VK_HEADER_VERSION [ \t]*(\S+)'
        var: header-rev
        message: no VK_HEADER_VERSION in vulkan_core.h
    - read:
        file: '{deps}/include/vulkan/vulkan_core.h'
        pattern: '^#define VK_API_VERSION_1_([34]) '
        last: true
        var: api-minor
        message: Vulkan support requires Vulkan 1.3+ headers.
    - pkg-config:
        file: vulkan
        name: Vulkan-Headers
        description: Vulkan header-only SDK for FFmpeg configure checks
        version: '1.{api-minor}.{header-rev}'
