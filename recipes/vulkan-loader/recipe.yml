name: vulkan-loader
provides: vulkan
license: Apache-2.0
license-files:
  [
    LICENSE.txt,
    LICENSES/Apache-2.0.txt,
    LICENSES/MIT.txt,
    LICENSES/MIT-Khronos-old.txt,
    LICENSES/HPND-Kevlin-Henney.txt,
  ]
configure: [--enable-vulkan]
# spirv-headers: upstream installs them wherever Vulkan is enabled, because FFmpeg's own Vulkan code needs them
# too (n9's swscale SPIR-V backend compiles only behind HAVE_SPIRV_HEADERS_SPIRV_H / HAVE_SPIRV_UNIFIED1_SPIRV_H).
# macOS has no native Vulkan: the loader is paired with MoltenVK (Vulkan-over-Metal), which ships beside it with its
# ICD manifest, so --enable-vulkan actually runs on Metal.
needs: [vulkan-headers, spirv-headers, { moltenvk: { platforms: [osx-*] } }]
source: { git: https://github.com/KhronosGroup/Vulkan-Loader, ref: 'vulkan-sdk-{version}' }
versions: { git-tags: '^vulkan-sdk-(\d+\.\d+\.\d+\.\d+)$' }
# released together as one Vulkan SDK: the lock gives all three one SDK version (devenvy/ffmpeg's Renovate rule did too)
version-group: vulkan-sdk
# Upstream's BUILD_VULKAN_LOADER: glibc and musl Linux, and macOS paired with MoltenVK (iOS and Mac Catalyst link
# MoltenVK statically instead: see moltenvk).
platforms: [linux-x64, linux-arm64, linux-musl-*, osx-*] # not linux-armhf: upstream uses the headers there
linkage:
  default: shared
  defaults: { linux-x64: static, osx-arm64: static }
  modes:
    static:
      platforms: [linux-x64, osx-arm64]
      configure:
        - --enable-vulkan-static
        - '--extra-libs=-lc++ -framework Metal -framework Foundation -framework QuartzCore -framework CoreGraphics -framework IOSurface -framework IOKit -framework AppKit':
            { platforms: [osx-arm64] }
      requires-link: { moltenvk: { modes: [static], platforms: [osx-*] } }
      vars:
        {
          static-loader: yes,
          loader-args: [-DCMAKE_POSITION_INDEPENDENT_CODE=ON, -DSYSCONFDIR=/etc],
        }
      runtime: []
    shared:
      requires-link: { moltenvk: { modes: [shared], platforms: [osx-*] } }
runtime:
  - 'lib/libvulkan.so*': { platforms: [linux-*] }
  - 'lib/libvulkan*.dylib': { platforms: [osx-*] }
build:
  # Vulkan-Loader: minimal Vulkan ICD loader (Apache-2.0), built with WSI disabled. Linux x64 can embed a PIC
  # static loader; other platforms retain the bundled shared loader until their static builds are verified.
  #
  # Whisper's ggml-vulkan links this loader directly. FFmpeg links it in static mode through vulkan-static,
  # and resolves it at runtime in shared mode. Both modes still load the recipient's installed ICD driver:
  # selecting a static loader does not embed a GPU driver. FFmpeg passes its owner proc-address callback when
  # libplacebo imports a Vulkan device, so a second private loader does not dispatch foreign handles.
  #
  # The Vulkan-Headers CMake package its find_package needs is installed by the vulkan-headers recipe.
  # Its own cmake line (not the standard one): no prefix path, no cross arguments but on macOS.
  system: none
  vars: { static-loader: '', loader-args: [], direct-moltenvk: '' }
  platforms:
    # macOS: the toolchain's arguments (osx-x64 is cross-compiled on Apple silicon; both keep Homebrew's packages
    # out). And /etc as the configuration folder the loader searches: by default it compiles in the install prefix's
    # etc/, which is a folder of the build machine (the staged-binary check rejects its path) and of no user's.
    'osx-*': { args: ['{cmake-cross-args}', -DSYSCONFDIR=/etc] }
  steps:
    # macOS has no native static Khronos loader. This mode routes directly to
    # the dependency's native MoltenVK archive, without a loader or ICD payload.
    - vars: { direct-moltenvk: yes }
      when: { platforms: [osx-arm64], set: '{static-loader}' }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'vulkan-loader', 'direct-moltenvk.py'), run_name='__main__')"
        - '{deps}'
      when: { set: '{direct-moltenvk}' }
    # Upstream's Unix loader is unconditionally shared. Keep this exact edit confined to the static mode.
    - replace-in-file:
        path: loader/CMakeLists.txt
        from: '        add_library(vulkan SHARED)'
        to: '        add_library(vulkan STATIC)'
      when: { platforms: [linux-x64], set: '{static-loader}' }
    - replace-in-file:
        path: loader/CMakeLists.txt
        from: target_link_libraries(vulkan PRIVATE loader_specific_options)
        to: target_link_libraries(vulkan PRIVATE $<BUILD_INTERFACE:loader_specific_options>)
      when: { platforms: [linux-x64], set: '{static-loader}' }
    - run:
        - cmake
        - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        - -S
        - .
        - -B
        - _build
        - '-DCMAKE_INSTALL_PREFIX={deps}'
        - '-DVULKAN_HEADERS_INSTALL_DIR={deps}'
        - -DCMAKE_INSTALL_LIBDIR=lib
        - -DCMAKE_BUILD_TYPE=Release
        - -DBUILD_TESTS=OFF
        - -DBUILD_WSI_XLIB_SUPPORT=OFF
        - -DBUILD_WSI_XCB_SUPPORT=OFF
        - -DBUILD_WSI_WAYLAND_SUPPORT=OFF
        - -DBUILD_WSI_DIRECTFB_SUPPORT=OFF
        - '{loader-args}'
        - '{args}'
      when: { unset: '{direct-moltenvk}' }
    - run: [cmake, --build, _build, -j, '{jobs}']
      when: { unset: '{direct-moltenvk}' }
    - run: [cmake, --install, _build]
      when: { unset: '{direct-moltenvk}' }
    - edit-pkg-config:
        path: '{deps}/lib/pkgconfig/vulkan.pc'
        libs-private: { add: '-ldl -lm -pthread' }
      when: { platforms: [linux-x64], set: '{static-loader}' }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'vulkan-loader', 'check-moltenvk-api.py'), run_name='__main__')"
        - '{deps}'
        - '{CC|cc}'
      when: { platforms: [osx-arm64] }
