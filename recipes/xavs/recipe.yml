# xavs's own repository is SourceForge Subversion, untouched since r55 (2011), with no releases or tarballs. This is
# the git-svn mirror media-autobuild_suite builds from; its trunk branch is r55, pinned by commit in the lock.
name: xavs
provides: xavs
# no licence file: the sources' headers say GPL version 2 "or (at your option) any later version", and xavs.h is
# the notice kept with the build
license: GPL-2.0-or-later
license-files: [xavs.h]
configure: [--enable-libxavs]
source: { git: https://github.com/Distrotech/xavs }
versions: { git-branch: trunk }
# x86-64 Linux and Windows: an x264 fork of 2011 whose configure knows no other targets FFmpeg builds for
platforms: [linux-x64, linux-musl-x64, win-x64]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-mode: 'yes'
        shared-args:
          [--enable-shared, '--extra-ldflags=-Wl,-z,defs,--version-script={src}/ffb-public-api.map']
        library-target: libxavs.so.1
        library-file: libxavs.so.1
        shared-make-args: ['SOFLAGS={library-file}']
      runtime: ['lib/libxavs.so*']
build:
  # xavs: AVS (GB/T 20090.2, "AVS1") video encoder (GPL-2.0-or-later), static, for FFmpeg's libxavs encoder; GPL
  # builds only. FFmpeg finds it with `-lxavs` (no pkg-config). Its x264-era configure and Makefile: the archive
  # only (`make libxavs.a`), installed by hand with xavs.h. Plain C: its assembly is yasm's, which the images don't
  # have. Keep its native configure, including the mingw probe-output filename.
  system: none
  vars:
    {
      cross: [],
      shared-mode: '',
      shared-args: [],
      library-target: libxavs.a,
      library-file: libxavs.a,
      shared-make-args: [],
    }
  platforms:
    win-x64: { vars: { cross: [--host=x86_64-w64-mingw32, '--cross-prefix={CROSS_PREFIX}-'] } }
  steps:
    - run:
        - python3
        - -c
        - "import os, shutil; shutil.copyfile(os.path.join(os.environ['RECIPES'], 'xavs', 'exports.map'), 'ffb-public-api.map')"
      when: { set: '{shared-mode}' }
    - [./configure, '--prefix={deps}', --disable-asm, --enable-pic, '{cross}', '{shared-args}']
    # Its Makefile already supplies -Wl,-soname; SOFLAGS supplies the native name.
    - [make, '-j{jobs}', '{library-target}', '{shared-make-args}']
    - copy: { from: '{library-file}', into: '{deps}/lib' }
    - run: [ln, -s, libxavs.so.1, '{deps}/lib/libxavs.so']
      when: { set: '{shared-mode}' }
    - copy: { from: xavs.h, into: '{deps}/include' }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'xavs', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
