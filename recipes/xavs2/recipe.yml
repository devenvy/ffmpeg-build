name: xavs2
provides: xavs2
license: GPL-2.0-or-later
license-files: [COPYING]
configure: [--enable-libxavs2]
source: { git: https://github.com/pkuvcl/xavs2, ref: '{version}' }
versions: { git-tags: '^(\d+\.\d+)$' }
# Not Android: its thread pool calls pthread_setaffinity_np, which bionic hasn't got.
platforms: [linux-x64, linux-musl-x64, win-x64, linux-arm64, linux-musl-arm64]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        library-args: [--enable-shared, '--extra-ldflags=-Wl,-z,defs']
        library-target: lib-shared
        install-target: install-lib-shared
      runtime: ['lib/libxavs2.so*']
build:
  # xavs2: AVS2 (IEEE 1857.4) video encoder from Peking University (GPL-2.0-or-later), static, for FFmpeg's libxavs2
  # encoder; GPL builds only. Found through xavs2.pc (1.3.0 or later). x264's configure, in build/linux; the library
  # alone (no CLI). As davs2: version.sh's origin/master count is 0 (a tag's shallow clone has no origin/master), and
  # its endianness probe can't fail. Its 2019 code passes incompatible pointers, an error since
  # GCC 14, and its nasm macros use parameters the way nasm 2.16 warns about (warnings, not errors).
  system: none
  vars:
    cross: []
    library-args: [--enable-static]
    library-target: lib-static
    install-target: install-lib-static
  args:
    [
      --extra-cflags=-Wno-error=incompatible-pointer-types -std=gnu17,
      --extra-asflags=-w-macro-params-legacy,
    ]
  platforms:
    win-x64: { vars: { cross: ['--cross-prefix={CROSS_PREFIX}-', --host=x86_64-w64-mingw32] } }
    # its ARM assembly is commented out or missing: plain C on ARM
    linux-arm64: { args: [--disable-asm] }
    linux-musl-arm64: { args: [--disable-asm] }
    # its x86-64 assembly assumes 32-byte-aligned memory that musl's threads don't give it (AVX2 stores crash): plain C
    linux-musl-x64: { args: [--disable-asm] }
  steps:
    - replace-in-file:
        { path: version.sh, from: 'VER_R=`git rev-list --count origin/master`', to: VER_R=0 }
    - replace-in-file: { path: build/linux/configure, from: 'elif !(', to: 'elif false && !(' }
    - run:
        [
          ./configure,
          '--prefix={deps}',
          --disable-cli,
          '{library-args}',
          --enable-pic,
          '{cross}',
          '{args}',
        ]
      cwd: build/linux
    - run: [make, '-j{jobs}', '{library-target}']
      cwd: build/linux
    - run: [make, '{install-target}']
      cwd: build/linux
