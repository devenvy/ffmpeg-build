name: xevd
provides: xevd
# Samsung's code and the ISO/IEC MPEG-5 EVC reference software it builds on, each under BSD-3-Clause (no patent grant)
license: BSD-3-Clause
license-files: [COPYING]
configure: [--enable-libxevd]
source: { git: https://github.com/mpeg5/xevd, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
# Not linux-armhf: its NEON code uses AArch64-only intrinsics.
platforms: [linux-x64, linux-arm64, linux-musl-*, win-*, osx-*, ios-*, maccatalyst-*, android-*]
build:
  # XEVD: MPEG-5 EVC decoder, main profile (BSD-3-Clause), static, for FFmpeg's libxevd decoder (found through xevd.pc,
  # 0.4.1 or later). Its CMake always builds the shared library beside the static one, puts the static one in lib/xevd/
  # (xevd.pc reaches it only through Libs.private), and its gcc branch, which Apple's clang also takes, adds -Werror
  # to gcc-only warning flags. So: no -Werror, no command-line app, and after the install the static archive is
  # moved to lib/, the shared library (and Windows' DLL and import library) removed, and the .pc's extra -L dropped.
  system: cmake
  args: [-DSET_PROF=MAIN]
  before:
    - replace-in-file: { path: CMakeLists.txt, from: ' -Werror', to: '' }
    - replace-in-file: { path: CMakeLists.txt, from: 'add_subdirectory(app)', to: '' }
  after:
    - remove: { path: '{deps}/lib/libxevd.so*' }
    - remove: { path: '{deps}/lib/libxevd*.dylib' }
    - remove: { path: '{deps}/lib/libxevd.dll.a' }
    - remove: { path: '{deps}/bin/libxevd.dll' }
    - remove: { path: '{deps}/lib/xevd/import', recursive: true }
    - move: { from: '{deps}/lib/xevd/libxevd.a', to: '{deps}/lib/libxevd.a' }
    - edit-pkg-config:
        { path: '{deps}/lib/pkgconfig/xevd.pc', libs-private: { remove: '-L${libdir}/xevd' } }
