name: xorgproto
# the X11 protocol headers' licences, as Fedora's xorg-x11-proto-devel names them
license: BSD-2-Clause AND HPND AND HPND-sell-variant AND ICU AND MIT AND MIT-open-group AND SGI-B-2.0 AND SMLNJ AND X11 AND X11-distribute-modifications-variant
license-files:
  [
    COPYING-applewmproto,
    COPYING-bigreqsproto,
    COPYING-compositeproto,
    COPYING-damageproto,
    COPYING-dmxproto,
    COPYING-dri2proto,
    COPYING-dri3proto,
    COPYING-evieproto,
    COPYING-fixesproto,
    COPYING-fontcacheproto,
    COPYING-fontsproto,
    COPYING-glproto,
    COPYING-inputproto,
    COPYING-kbproto,
    COPYING-lg3dproto,
    COPYING-pmproto,
    COPYING-presentproto,
    COPYING-printproto,
    COPYING-randrproto,
    COPYING-recordproto,
    COPYING-renderproto,
    COPYING-resourceproto,
    COPYING-scrnsaverproto,
    COPYING-trapproto,
    COPYING-videoproto,
    COPYING-windowswmproto,
    COPYING-x11proto,
    COPYING-xcmiscproto,
    COPYING-xextproto,
    COPYING-xf86bigfontproto,
    COPYING-xf86dgaproto,
    COPYING-xf86driproto,
    COPYING-xf86miscproto,
    COPYING-xf86rushproto,
    COPYING-xf86vidmodeproto,
    COPYING-xineramaproto,
    COPYING-xwaylandproto,
  ]
source:
  url: 'https://xorg.freedesktop.org/releases/individual/proto/xorgproto-{version}.tar.xz'
  mirrors: ['https://www.x.org/releases/individual/proto/xorgproto-{version}.tar.xz']
versions:
  {
    listing: 'https://xorg.freedesktop.org/releases/individual/proto/',
    files: '^xorgproto-(\d+\.\d+(?:\.\d+)?)\.tar\.xz$',
  }
# where the X11 libraries build
platforms: [linux-*]
build:
  # xorgproto: the X11 protocol headers (and their .pc files), for libX11, libXext and libXv. Headers only. Its .pc
  # files go where the build's pkg-config looks (lib/pkgconfig, not share/pkgconfig).
  system: meson
  after:
    - copy: { from: '{deps}/share/pkgconfig/*.pc', into: '{deps}/lib/pkgconfig' }
