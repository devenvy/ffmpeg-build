name: xtrans
license: HPND AND HPND-sell-variant AND MIT AND MIT-open-group AND X11
license-files: [COPYING]
source:
  url: 'https://xorg.freedesktop.org/releases/individual/lib/xtrans-{version}.tar.xz'
  mirrors: ['https://www.x.org/releases/individual/lib/xtrans-{version}.tar.xz']
versions:
  {
    listing: 'https://xorg.freedesktop.org/releases/individual/lib/',
    files: '^xtrans-(\d+\.\d+\.\d+)\.tar\.xz$',
  }
# where libX11 builds
platforms: [linux-*]
build:
  # xtrans: X's transport layer, as C sources libX11 compiles in (headers only here). Its xtrans.pc goes where the
  # build's pkg-config looks (lib/pkgconfig, not share/pkgconfig).
  system: autotools
  install-targets: [install, 'pkgconfigdir={deps}/lib/pkgconfig']
