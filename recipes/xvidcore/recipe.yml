# Xvid publishes release tarballs only (its source is in Subversion, svn.xvid.org); the listing is its downloads folder.
name: xvidcore
provides: xvid
license: GPL-2.0-or-later
license-files: [LICENSE]
# FFmpeg finds it with a plain -lxvidcore probe, which a static library calling the maths library fails
# without libm on the link
configure: [--enable-libxvid, --extra-libs=-lm]
source: { url: 'https://downloads.xvid.com/downloads/xvidcore-{version}.tar.gz' }
versions:
  { listing: 'https://downloads.xvid.com/downloads/', files: '^xvidcore-(\d+\.\d+\.\d+)\.tar\.gz$' }
# Linux cross-builds use the available Clang with the existing GNU MinGW sysroot.
# Its real numeric version is understood by upstream's configure; native MSYS2 keeps its compiler.
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { archive: libxvidcore.so.4.3, shared-library: yes }
      runtime: ['lib/libxvidcore.so*']
build:
  # Xvid: MPEG-4 Part 2 (ASP) encoder (GPL-2.0-or-later), static, for FFmpeg's libxvid encoder; GPL builds only.
  # FFmpeg finds it with `-lxvidcore` (no pkg-config). Its own configure and Makefile in build/generic, which build the
  # static and the shared library together; only the static one is made (`make <archive>`), and it and xvid.h are
  # installed by hand (the Makefile's install wants both). mingw names the archive xvidcore.a, which -lxvidcore
  # doesn't find: it is installed as libxvidcore.a.
  system: none
  vars:
    archive: libxvidcore.a
    shared-library: ''
    cross-clang: ''
    clang-cc: 'x86_64-w64-mingw32-clang --sysroot=/usr/x86_64-w64-mingw32 -rtlib=libgcc'
  before:
    - vars: { cross-clang: yes }
      when: { platforms: [win-x64], unset: '{MSYSTEM?}' }
  platforms:
    'win-*': { vars: { archive: xvidcore.a } }
    # x86-64 assembly only where it links into position-independent code without text relocations
    'osx-x64': { args: [--disable-assembly] }
    'maccatalyst-x64': { args: [--disable-assembly] }
    'android-x64': { args: [--disable-assembly] }
  # C17: its `typedef int bool` is an error under C23, newer GCCs' default
  env: { CFLAGS: '+= -std=gnu17' }
  steps:
    - run: ['./configure', '--prefix={deps}', '--host={host?}', '{args}']
      cwd: build/generic
      when: { unset: '{cross-clang}' }
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'xvidcore', 'check-gnu-compiler.py'), run_name='__main__')"
        - '--prefix={deps}'
        - '--host={host?}'
        - '{args}'
      cwd: build/generic
      env: { CC: '{clang-cc}' }
      when: { set: '{cross-clang}' }
    - run: [make, '-j{jobs}', '{archive}']
      cwd: build/generic
    - copy: { from: 'build/generic/=build/{archive}', to: '{deps}/lib/libxvidcore.a' }
      when: { unset: '{shared-library}' }
    - copy: { from: 'build/generic/=build/{archive}', into: '{deps}/lib' }
      when: { set: '{shared-library}' }
    - run: [ln, -sf, libxvidcore.so.4.3, '{deps}/lib/libxvidcore.so.4']
      when: { set: '{shared-library}' }
    - run: [ln, -sf, libxvidcore.so.4, '{deps}/lib/libxvidcore.so']
      when: { set: '{shared-library}' }
    - copy: { from: src/xvid.h, into: '{deps}/include' }
