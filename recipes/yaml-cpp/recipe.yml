name: yaml-cpp
license: MIT
license-files: [LICENSE]
source: { git: https://github.com/jbeder/yaml-cpp, ref: 'yaml-cpp-{version}' }
versions: { git-tags: '^yaml-cpp-(\d+\.\d+\.\d+)$' }
# only OpenColorIO builds against it, where it builds
platforms: [linux-*, osx-*, win-*, android-*]
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        library-arg: -DYAML_BUILD_SHARED_LIBS=ON
        shared-mode: 'yes'
        shared-args:
          [
            '-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -Wl,-z,defs,--exclude-libs,libstdc++.a:libsupc++.a,--version-script={src}/ffb-public-api.map',
          ]
      runtime: ['lib/libyaml-cpp.so*']
build:
  # yaml-cpp: a YAML parser and emitter for C++ (MIT), static, for OpenColorIO's config files. The library alone: no
  # tools, contrib or tests (as OpenColorIO's own build of it).
  system: cmake
  vars: { library-arg: -DYAML_BUILD_SHARED_LIBS=OFF, shared-mode: '', shared-args: [] }
  args:
    [
      '{library-arg}',
      '{shared-args}',
      -DYAML_CPP_BUILD_TESTS=OFF,
      -DYAML_CPP_BUILD_TOOLS=OFF,
      -DYAML_CPP_BUILD_CONTRIB=OFF,
    ]
  before:
    - run:
        - python3
        - -c
        - "import os, shutil; shutil.copyfile(os.path.join(os.environ['RECIPES'], 'yaml-cpp', 'exports.map'), 'ffb-public-api.map')"
      when: { set: '{shared-mode}' }
  after:
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'yaml-cpp', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CXX|g++}'
      when: { set: '{shared-mode}' }
