name: zimg
provides: zimg
license: WTFPL
license-files: [COPYING]
configure: [--enable-libzimg]
source: { git: https://github.com/sekrit-twc/zimg.git, ref: 'release-{version}', submodules: true }
versions: { git-tags: '^release-(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars:
        shared-arg: --enable-shared
        static-arg: --disable-static
        runtime-link-flags: '-Wl,--as-needed -Wl,--exclude-libs,libstdc++.a:libgcc.a:libgcc_eh.a'
        runtime-libs: '-l:libstdc++.a -l:libgcc.a -l:libgcc_eh.a'
      runtime: ['lib/libzimg.so*']
build:
  # zimg: high-quality image scaling/colorspace/depth conversion (WTFPL), static.
  # Ported from devenvy/ffmpeg scripts/deps/zimg.sh. Its submodules come with the source.
  system: none
  vars:
    {
      shared-arg: --disable-shared,
      static-arg: --enable-static,
      runtime-link-flags: '',
      runtime-libs: '',
    }
  env: { LDFLAGS: '+= {runtime-link-flags?}', LIBS: '+= {runtime-libs?}' }
  bootstrap: autogen
  steps:
    - [./configure, '--prefix={deps}', '{shared-arg}', '{static-arg}', --with-pic, '{args}']
    - [make, '-j{jobs}']
    - [make, install]
  after:
    # zimg's installed pkg-config omits -lm from Libs.private, so FFmpeg's static
    # link test fails (--as-needed drops libm despite log10f etc. being used). Add it.
    - edit-pkg-config:
        { path: '{deps}/lib/pkgconfig/zimg.pc', libs-private: { set: -lstdc++ -lm, missing: skip } }
  platforms:
    win-x64: { args: [--host=x86_64-w64-mingw32] }
    # Scalar Windows ARM64 build: upstream's native --disable-simd avoids the CPU-detection source's Windows.h
    # casing assumption. Use the compiler's standard <exception> header through its existing forced-include
    # option; no authored compatibility header or upstream source/build-file edit is carried.
    win-arm64:
      args: [--host=aarch64-w64-mingw32, --disable-simd, 'CXXFLAGS=-O2 -include exception']
    linux-armhf: { args: [--host=arm-linux-gnueabihf] }
    android-arm64: { args: [--host=aarch64-linux-android] }
    android-x64: { args: [--host=x86_64-linux-android] }
    ios-arm64: { args: [--host=aarch64-apple-darwin] }
    ios-sim-arm64: { args: [--host=aarch64-apple-darwin] }
    maccatalyst-arm64: { args: [--host=aarch64-apple-darwin] }
    maccatalyst-x64: { args: [--host=x86_64-apple-darwin] }
    osx-x64: { args: [--host=x86_64-apple-darwin] } # cross-compiled on Apple silicon
