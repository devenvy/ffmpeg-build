name: zvbi
provides: zvbi
# COPYING.md: the library's sources are LGPL-2.0-or-later, but for src/pdc.* and src/packet-830.* (Teletext packet 8/30
# and Program Delivery Control, which the Teletext decoder uses), GPL-2.0-only; src/ure.* is MIT, src/dvb/*.h and
# src/strptime.* LGPL-2.1-or-later. As compiled, then, GPL-2.0-only rules: gplv2 builds (and nonfree) only, though
# FFmpeg's configure counts zvbi 0.2.28 and later as LGPL.
license: LGPL-2.0-or-later AND GPL-2.0-only AND LGPL-2.1-or-later AND MIT
license-files: [COPYING.md]
configure: [--enable-libzvbi]
# iconv: the C library's on Linux and Android (API 28), GNU libiconv's elsewhere
needs: [{ libiconv: { platforms: [win-*, osx-*, ios-*, maccatalyst-*] } }]
source: { git: https://github.com/zapping-vbi/zvbi, ref: 'v{version}' }
versions: { git-tags: '^v(\d+\.\d+\.\d+)$' }
platforms: all
linkage:
  default: static
  modes:
    static: {}
    shared:
      platforms: [linux-x64]
      vars: { shared-arg: --enable-shared, static-arg: --disable-static, shared-mode: 'yes' }
      runtime: ['lib/libzvbi.so*']
build:
  # libzvbi: VBI and Teletext decoding, static, for FFmpeg's libzvbi_teletext decoder (found through zvbi-0.2.pc,
  # 0.2.28 or later). The library alone: no capture interfaces (V4L, DVB, BSD bktr, the proxy daemon), programs,
  # examples, tests or docs.
  #
  # - Native gettext tools provide its bootstrap macros and iconv discovery. NLS is disabled through configure.
  # - It would take libpng (PNG export of Teletext pages, which FFmpeg doesn't use) from whatever the build has: told
  #   there is none.
  # - AC_FUNC_MALLOC and AC_FUNC_REALLOC assume a cross build's malloc(0) returns NULL and call rpl_malloc and
  #   rpl_realloc, which nothing defines (Android's link failed): every C library this builds for returns a pointer.
  # - Native autoreconf generates the configure script without engine edits.
  system: autotools
  vars:
    {
      shared-arg: --disable-shared,
      static-arg: --enable-static,
      shared-mode: '',
      pthread-probe-flags: '',
    }
  # the platform's CFLAGS take the place of configure's default -g -O2: optimized as upstream builds it; GNU libiconv
  # is found in deps (it has no .pc)
  env:
    {
      CFLAGS: '+= -O2{pthread-probe-flags}',
      CPPFLAGS: '-I{deps}/include {CPPFLAGS|}',
      LDFLAGS: '-L{deps}/lib {LDFLAGS|}',
    }
  args:
    [
      '{shared-arg}',
      '{static-arg}',
      --with-pic,
      --disable-nls,
      --disable-v4l,
      --disable-dvb,
      --disable-bktr,
      --disable-proxy,
      --disable-tests,
      --disable-examples,
      --without-doxygen,
      --without-x,
      ac_cv_lib_png_png_destroy_write_struct=no,
      ac_cv_func_malloc_0_nonnull=yes,
      ac_cv_func_realloc_0_nonnull=yes,
    ]
  make-targets: [-C, src]
  install-targets: [-C, src, install]
  after:
    - [make, install-pkgconfigDATA]
    - run:
        - python3
        - -c
        - "import os, runpy; runpy.run_path(os.path.join(os.environ['RECIPES'], 'zvbi', 'check-public-api.py'), run_name='__main__')"
        - '{deps}'
        - '{src}/ffb-sdk'
        - '{CC|gcc}'
      when: { set: '{shared-mode}' }
  before:
    - [autoreconf, -fi]
  platforms:
    'android-*':
      # Its native fallback links an undeclared pthread_create symbol. Permit
      # that configure probe instead of rewriting it or inventing a cache result.
      vars: { pthread-probe-flags: ' -Wno-error=implicit-function-declaration' }
    'osx-*': &apple-gettext
      env:
        PATH: '{HOMEBREW_PREFIX|/opt/homebrew}/opt/gettext/bin:{PATH}'
        ACLOCAL_PATH: '{HOMEBREW_PREFIX|/opt/homebrew}/opt/gettext/share/aclocal:{ACLOCAL_PATH|}'
    'ios-*': *apple-gettext
    'maccatalyst-*': *apple-gettext
