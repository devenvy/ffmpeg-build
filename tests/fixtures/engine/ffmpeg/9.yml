major: 9
releases: [9.0.0, 9.0.1, 9.0.2, 9.1.0]
options:
  whep: { builtin: true, kind: muxer, since: 9.1.0 }
  amf: { builtin: true, kind: hwaccel, since: 9.1.0, platforms: [win-*, linux-*] }
  schannel: { builtin: true, kind: tls, platforms: [win-*], group: tls }
  securetransport: { builtin: true, kind: tls, platforms: [osx-*, ios-*], group: tls }
  openssl: { needs: openssl, min: 3.0.0, ships: { protocols: [tls, https] } }
  gnutls: { needs: gnutls, min: 3.6.0 }
  x265: { needs: x265, ffmpeg-license: gpl, ships: { encoders: [libx265] } }
  fdk-aac: { needs: fdk-aac, ffmpeg-license: nonfree }
  dav1d: { needs: dav1d, min: 1.0.0, ships: { decoders: [libdav1d] } }
  nvenc: { needs: nv-codec, platforms: [linux-*, win-*] }
  whisper: { needs: whisper.cpp, min: 1.7.5, ships: { filters: [whisper] } }
  srt: { needs: srt, min: 1.3.0, ships: { protocols: [srt] } }
  vaapi:
    needs: libva
    platforms: [linux-*, android-*]
    ships:
      hwaccels: [vaapi]
      filters: [{ transpose_vaapi: { platforms: [linux-*] } }]
  opus:
    needs: opus
    ships: { encoders: [libopus], resamplers: [{ soxr: { with: [dav1d] } }] }
